# The card workflows' one Python setup: Python 3.14 and AutoCroissant requirements-cards.txt (the psd-tools fork's one
# pin) in a venv cached whole per its requirement lines (comments don't count), runner and Python patch version (its
# interpreter's path; one entry for every card job): a hit restores it (its packages' metadata checked); a runner image's
# new patch takes the last patch's entry, its interpreter links made again (cp314 packages fit every 3.14.x). A miss builds
# the wheels with pip (uv has no `pip wheel`), installs them with uv and saves the venv. The oxipng CLI (the lossless PNG
# recompression, AutoCroissant png_export) is the release binary, its sha256 pinned, kept in the venv (.oxipng/): fetched
# on a miss whatever the input, which only puts it on PATH. The bot checkout is at bot/.
name: Card Python
description: Python 3.14 with the card packages from the shared venv cache

inputs:
  venv:
    description: "The venv's path (no pip in it); empty: runner.temp/venv, first on PATH (`python` is it)"
    default: ""
  oxipng:
    description: "The oxipng CLI on PATH (false: the PNGs written are not recompressed)"
    default: "true"
  help:
    description: "commands.<module> --help for each of these (space separated, run in bot/): the import closure"
    default: ""

outputs:
  wheels:
    description: "built when the venv was installed (a new entry saved)"
    value: ${{ steps.install.outputs.wheels }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      id: python
      with:
        python-version: "3.14"     # no `cache: pip`: the caches below hold every package

    - id: reqs     # pip's comment rule: a # at the start or after whitespace
      shell: bash
      env:
        VENV: ${{ inputs.venv || format('{0}/venv', runner.temp) }}
      run: |
        sha=$(sed -E 's/(^|[[:space:]]+)#.*//; s/[[:space:]]+$//; /^$/d' bot/requirements-cards.txt | sha256sum | cut -d' ' -f1)
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "venv=$VENV" >> "$GITHUB_OUTPUT"
        echo "minor=$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')" >> "$GITHUB_OUTPUT"

    # The path is part of the entry: card-sync's venv and the default are one. Else another 3.14 patch's (a new image) or
    # oxipng's entry: re-pointed at this Python in check and saved under this key (about 5 s, not 51-63 s of wheels)
    - id: env
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.reqs.outputs.venv }}
        key: card-venv-${{ steps.reqs.outputs.sha }}-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-ox10.2.1
        restore-keys: card-venv-${{ steps.reqs.outputs.sha }}-${{ runner.os }}-${{ runner.arch }}-py${{ steps.reqs.outputs.minor }}.

    - id: check     # a restored venv missing its packages is installed again
      shell: bash
      env:
        HIT: ${{ steps.env.outputs.cache-hit }}
        MATCHED: ${{ steps.env.outputs.cache-matched-key }}
        KEY: ${{ steps.env.outputs.cache-primary-key }}
        VENV: ${{ steps.reqs.outputs.venv }}
        PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        if [ "$HIT" != true ] && [ -n "$MATCHED" ]; then     # venv --upgrade keeps a link, even a dangling one
          if find "$VENV/bin" -maxdepth 1 -type l -delete && "$PYTHON" -m venv --upgrade --without-pip "$VENV"; then HIT=moved; else rm -rf "$VENV"; fi
          [ "${MATCHED##*-ox}" = "${KEY##*-ox}" ] || rm -rf "$VENV/.oxipng"     # another oxipng: fetched below
        fi
        if [ "$HIT" = true ] || [ "$HIT" = moved ]; then
          if "$VENV/bin/python" -c 'import importlib.metadata as m; [m.version(p) for p in ("psd-tools", "fonttools", "requests")]'; then   # metadata only: a full import cost 3.5 s
            echo "ok=true" >> "$GITHUB_OUTPUT"
            [ "$HIT" != moved ] || echo "save=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::the cached venv failed its import check: installed again"
          rm -rf "$VENV"
        fi
        echo "ok=false" >> "$GITHUB_OUTPUT"

    - if: steps.check.outputs.ok != 'true'
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
      with:
        version: "0.13.5"
        enable-cache: false

    - id: install
      if: steps.check.outputs.ok != 'true'
      shell: bash
      env:
        VENV: ${{ steps.reqs.outputs.venv }}
        PYTHON: ${{ steps.python.outputs.python-path }}
        UV_COMPILE_BYTECODE: "1"
      run: |
        env -u GIT_NO_LAZY_FETCH pip wheel -q -w "$RUNNER_TEMP/card-wheels" -r bot/requirements-cards.txt --uploaded-prior-to 2026-11-07   # PyPI as then, the fork's build packages too: bump it with each fork re-pin. env -u: pip clones the fork blobless, and a job's GIT_NO_LAZY_FETCH=1 (Card checks) fails its checkout
        echo "wheels=built" >> "$GITHUB_OUTPUT"
        sed 's/ @ [^;]*//' bot/requirements-cards.txt > "$RUNNER_TEMP/cards.txt"   # by name: a URL line would clone and build the fork
        "$PYTHON" -m venv "$VENV" --without-pip
        UV_PYTHON=$VENV/bin/python uv pip install -q --no-index -f "$RUNNER_TEMP/card-wheels" -r "$RUNNER_TEMP/cards.txt"

    # The CLI in the venv entry: a miss fetches it before the save; a hit only checks it (no network), else fetches it
    - id: oxipng     # AutoCroissant docs/Future/SMALLER_PNG_PUSHES.md
      if: steps.check.outputs.ok != 'true' || steps.check.outputs.save == 'true' || inputs.oxipng == 'true'
      shell: bash
      env:
        VERSION: "10.2.1"     # the venv key's -ox tag
        SHA256: "1813750ef592c5350ca79c88f98b2c0876d05c826dc7156245256d4255c1ad17"   # x86_64-unknown-linux-musl
        ASSET: "541676949"              # the same file through the API (the release link gave 504s on 2026-11-08)
        TOKEN: ${{ github.token }}
        BIN: ${{ steps.reqs.outputs.venv }}/.oxipng
        WANT: ${{ inputs.oxipng }}
      run: |
        name=oxipng-$VERSION-x86_64-unknown-linux-musl
        get() { curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/$name.tar.gz" "$@"; }
        fetch() {
          [ "$RUNNER_OS-$RUNNER_ARCH" = Linux-X64 ] || { echo "::error::oxipng: a Linux X64 runner only"; return 1; }
          { get "https://github.com/oxipng/oxipng/releases/download/v$VERSION/$name.tar.gz" \
              || get -H "Accept: application/octet-stream" -H "Authorization: Bearer $TOKEN" \
                   "https://api.github.com/repos/oxipng/oxipng/releases/assets/$ASSET"; } \
            && echo "$SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c --quiet \
            && mkdir -p "$BIN" && tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$BIN" --strip-components 1 "$name/oxipng" \
            && "$BIN/oxipng" --version
        }
        if ! "$BIN/oxipng" --version 2> /dev/null && ! fetch; then
          rm -rf "$BIN"
          [ "$WANT" != true ] || exit 1
          echo "::warning::no oxipng CLI: the venv is not saved"
          echo "unsaved=true" >> "$GITHUB_OUTPUT"
        fi
        [ "$WANT" != true ] || echo "$BIN" >> "$GITHUB_PATH"

    - if: (steps.check.outputs.ok != 'true' || steps.check.outputs.save == 'true') && steps.oxipng.outputs.unsaved != 'true'     # once it installed
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.reqs.outputs.venv }}
        key: ${{ steps.env.outputs.cache-primary-key }}

    - shell: bash
      env:
        OWN: ${{ inputs.venv }}
        VENV: ${{ steps.reqs.outputs.venv }}
        HELP: ${{ inputs.help }}
      run: |
        if [ -z "$OWN" ]; then echo "$VENV/bin" >> "$GITHUB_PATH"; fi
        for module in $HELP; do (cd bot && "$VENV/bin/python" -m "commands.$module" --help > /dev/null); done
