# The card workflows' one Python setup: Python 3.14 and AutoCroissant requirements-cards.txt (the psd-tools fork's one
# pin) in a venv cached whole per its requirement lines (comments don't count), runner and Python (one entry for every
# card job): a hit restores it (an import checks it). A miss installs it offline with uv from the wheels, cached
# the same way (a miss builds them with pip: uv has no `pip wheel`), and saves both. The oxipng CLI (the lossless PNG
# recompression, AutoCroissant png_export) is the release binary, its sha256 pinned. The bot checkout is at bot/.
name: Card Python
description: Python 3.14 with the card packages from the shared venv and wheel caches

inputs:
  venv:
    description: "The venv's path (no pip in it); empty: runner.temp/venv, first on PATH (`python` is it)"
    default: ""
  oxipng:
    description: "Install the oxipng CLI (false: the PNGs written are not recompressed)"
    default: "true"
  help:
    description: "commands.<module> --help for each of these (space separated, run in bot/): the import closure"
    default: ""

outputs:
  wheels:
    description: "built when the wheel cache missed (a new entry was saved)"
    value: ${{ steps.install.outputs.wheels }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      id: python
      with:
        python-version: "3.14"     # no `cache: pip`: the caches below hold every package

    - id: reqs     # pip's comment rule: a # at the start or after whitespace
      shell: bash
      env:
        VENV: ${{ inputs.venv || format('{0}/venv', runner.temp) }}
      run: |
        sha=$(sed -E 's/(^|[[:space:]]+)#.*//; s/[[:space:]]+$//; /^$/d' bot/requirements-cards.txt | sha256sum | cut -d' ' -f1)
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "venv=$VENV" >> "$GITHUB_OUTPUT"

    - id: env     # the path is part of the entry: card-sync's venv and the default are one
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.reqs.outputs.venv }}
        key: cards-venv-${{ steps.reqs.outputs.sha }}-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}

    - id: check     # a restored venv that can't import its packages is installed again
      shell: bash
      env:
        HIT: ${{ steps.env.outputs.cache-hit }}
        VENV: ${{ steps.reqs.outputs.venv }}
      run: |
        if [ "$HIT" = true ]; then
          if "$VENV/bin/python" -c 'import psd_tools.composite.text, fontTools.ttLib, requests'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::the cached venv failed its import check: installed again"
          rm -rf "$VENV"
        fi
        echo "ok=false" >> "$GITHUB_OUTPUT"

    - id: wheels
      if: steps.check.outputs.ok != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/card-wheels
        key: cards-${{ steps.reqs.outputs.sha }}-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}

    - if: steps.check.outputs.ok != 'true'
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
      with:
        version: "0.13.5"
        enable-cache: false

    - id: install
      if: steps.check.outputs.ok != 'true'
      shell: bash
      env:
        HIT: ${{ steps.wheels.outputs.cache-hit }}
        VENV: ${{ steps.reqs.outputs.venv }}
        PYTHON: ${{ steps.python.outputs.python-path }}
        UV_COMPILE_BYTECODE: "1"
      run: |
        if [ "$HIT" != true ]; then
          mkdir -p ~/.cache/card-wheels
          pip wheel -q -f ~/.cache/card-wheels -w ~/.cache/card-wheels -r bot/requirements-cards.txt
          echo "wheels=built" >> "$GITHUB_OUTPUT"
        fi
        sed 's/ @ [^;]*//' bot/requirements-cards.txt > "$RUNNER_TEMP/cards.txt"   # by name: a URL line would clone and build the fork
        "$PYTHON" -m venv "$VENV" --without-pip
        UV_PYTHON=$VENV/bin/python uv pip install -q --no-index -f ~/.cache/card-wheels -r "$RUNNER_TEMP/cards.txt"

    - if: steps.check.outputs.ok != 'true' && steps.wheels.outputs.cache-hit != 'true'     # only once they installed
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/card-wheels
        key: ${{ steps.wheels.outputs.cache-primary-key }}

    - if: steps.check.outputs.ok != 'true'     # only once it installed
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.reqs.outputs.venv }}
        key: ${{ steps.env.outputs.cache-primary-key }}

    - shell: bash
      env:
        OWN: ${{ inputs.venv }}
        VENV: ${{ steps.reqs.outputs.venv }}
        HELP: ${{ inputs.help }}
      run: |
        if [ -z "$OWN" ]; then echo "$VENV/bin" >> "$GITHUB_PATH"; fi
        for module in $HELP; do (cd bot && "$VENV/bin/python" -m "commands.$module" --help > /dev/null); done

    - if: inputs.oxipng == 'true'     # AutoCroissant docs/Future/SMALLER_PNG_PUSHES.md
      shell: bash
      env:
        VERSION: "10.2.1"
        SHA256: "1813750ef592c5350ca79c88f98b2c0876d05c826dc7156245256d4255c1ad17"   # x86_64-unknown-linux-musl
      run: |
        [ "$RUNNER_OS-$RUNNER_ARCH" = Linux-X64 ] || { echo "::error::oxipng: a Linux X64 runner only"; exit 1; }
        name=oxipng-$VERSION-x86_64-unknown-linux-musl
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/oxipng/oxipng/releases/download/v$VERSION/$name.tar.gz"
        echo "$SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c --quiet
        mkdir -p "$RUNNER_TEMP/oxipng"
        tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP/oxipng" --strip-components 1 "$name/oxipng"
        "$RUNNER_TEMP/oxipng/oxipng" --version
        echo "$RUNNER_TEMP/oxipng" >> "$GITHUB_PATH"
