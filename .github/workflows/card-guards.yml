# The push guards (AutoCroissant docs/Campaigns/PUSH_GUARDS.md; the bot's commands/card_guards.py):
#   1. a card PSD pushed without its PNG gets the PNG the bake would make: the psd-tools fork renders the changed
#      layers in the card's ICC export mode and the old PNG takes the change, gated as the bake is; the PSD's stored image
#      (Photoshop's composite) is never written, only a cross-check that can refuse. A PSD with no stored image (saved
#      without Maximize Compatibility) gets the PNG under the bake's own gates alone, told "no stored image to cross-check".
#      When a gate refuses, no PNG and a report instead ("PNG not made: ...; export it in Photoshop");
#   2. the pushed PSDs are checked against the card standards (CARD_STANDARDIZATION_CAMPAIGN.md); only the owner's easy
#      fix (Txt2 stories kept in sync, 0 pixels) is made, the rest is reported. Missing fonts are the font check's alone;
#   3. every card PNG the push brought is recompressed losslessly (oxipng: the same pixels and chunks) when that saves
#      more than 10%, and so is every PNG the bot writes (owner, 2026-10-23: Photoshop's exports are 3-4x bigger);
#   4. the card check and the font check (card-check.yml and font-check.yml until 2026-10-25), on every push whatever
#      CARD_GUARDS says: AutoCroissant commands/card_check.py (the parser's and validator's notes, the lines /update_stats
#      prints) and commands/font_check.py (fonts MDW/Fonts does not supply). Each: the job summary and its own comment on
#      the commit; its notes the push made new go in the standards post (below). Never a gate.
#   5. silent conversions (owner 2026-11-07; AutoCroissant commands/psd_links.py): a pushed PSD (cards, MDW/Templates,
#      MDW/Unfinished) with an embedded picture, sub or superscript text, a merged image or a link to repair is
#      converted (pictures linked to Types/ and MDW/Linked/); unused MDW/Linked files go, duplicates are merged. Decided
#      comes before the conversion, so Card sync's wait does not hold for it. No comment, no Discord.
# The guards' report (1-3), one per push: the job summary and a comment on the commit. The PNGs and the fixes land
# right after the check (owner, 2026-11-03; a 30-minute quiet window before): a PNG the author pushed meanwhile withdraws
# its refusal, a card pushed again is left to that push's run, a write that did not land is told (in report mode, the PNG
# the bot would make). It never reverts or rejects a push.
# ONE Discord post per push to the standards channel (owner 2026-11-11; the tell job, AutoCroissant standards_post.py):
# the guards' lines and the two checks' notes, "<login> pushed <card>: <notes>. [<sha8>](<commit>)" a line per card,
# only what the push made new on a card (old notes stay in the comments and job summaries), a note two checks tell
# once, the card makers' role pinged only for a missing font, no link previews. A broken push run tells the standards
# channel once ("Card guards failed on <login>'s push <sha8>: <failed steps> <run>"; a cancel by hand does not), and
# leaves the failure marker comment Card sync reads too, so a push broken in both is told once.
# One main lane per guarded push (P-2): a push with fixes to land (on) marks its check job
# ("Fixes to land"); that push's Card sync run skips its main lane. With 25 PSDs or fewer to convert the check job starts
# Card sync right after the mark (that run sets up, then waits for Landed; Follow up starts another if a newer run took a
# lane's place), else the post job's Follow up starts it, landed or not.
# The card packages (AutoCroissant requirements-cards.txt, the psd-tools fork's one pin) install from the card workflows'
# venv cache (.github/actions/cards-venv); the fonts from the card-fonts- cache, as Card sync's.
#
# Jobs: `check` runs the guards' check, lands and comments; `post` settles the comment right after it (the 30-minute
# quiet window and its environment card-guards-quiet went on 2026-11-03). `checks` runs a push's two checks beside
# them, so Card sync and the post wait for neither (2026-11-07); a dispatch runs them in `check`. `tell` posts once all
# three are done; `finish` turns the run red where it should be and tells a broken push.
#
# Switches: the repo variable CARD_GUARDS (Settings > Variables; unset or off = the guards skipped, the two checks still
# run; report = check, comment and post but never commit, on = also land; any letter case). A dispatch defaults to a dry
# run (job summary and artifacts only); CARD_GUARDS does not bind it, and one that lands refuses while a push run of its
# commit is still unfinished.
name: Card guards

on:
  push:
    branches: [main]
    paths:
      - "**/*.psd"
      - "**/*.PSD"
      - "**/*.png"
      - "**/*.PNG"
      - "MDW/Fonts/*"         # the font check: a font added
      - "Types/**"            # linked files: duplicates and unused ones
      - "MDW/Linked/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Job summary and artifacts only: no comment, no Discord, no commit"
        type: boolean
        default: true
      sha:
        description: "Check this commit as if pushed (against its first parent); empty = main's head"
        type: string
        default: ""
      cards:
        description: "Only these cards (comma separated, matched like Card Authors.txt); empty = all in the commit"
        type: string
        default: ""
      all:
        description: "Every card PSD: standards, PNG-vs-PSD and both checks, job summary only (about 813 downloads each, 2 hours)"
        type: boolean
        default: false

permissions:          # the post job's; the others have their own
  contents: write     # the commit comment
  actions: write      # Follow up's gh workflow run card-sync.yml (a GITHUB_TOKEN push triggers no workflow)

# Each push keeps its own run (a shared group keeps one pending run, so a burst of pushes would lose the middle ones'
# reports); a dispatch gets a group of its own. Parallel landings are safe: each rests on its blobs and retries a moved head.
concurrency:
  group: ${{ github.event_name == 'push' && format('card-guards-{0}', github.sha) || format('card-guards-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Every push and dispatch (GITHUB_TOKEN pushes start no run; inside a range the bot's commits are left out by author,
  # card_guards.Writer.bot). The guards' steps unless MODE is off; a dispatch's two checks always.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.all && 150 || 60 }}    # Normalise's 36 and Land's 20; finish's alert reads 60
    permissions:
      contents: write     # the commit comment and Land's commit
      actions: write      # gh run list; Start Card sync
    env:
      # the comment's mark that this push's one Discord post went out (a re-run checks it; the tell job sets it)
      TOLD: "<!-- card-guards: told on Discord -->"
      # off | report | on for a push; dry | on for a dispatch (an `all` dispatch never posts or commits); Start lowercases it
      MODE: ${{ github.event_name == 'push' && (vars.CARD_GUARDS || 'off') || ((inputs.dry_run || inputs.all) && 'dry' || 'on') }}
      # The guards and their import closure (no config.py: github_api reads it in a try/except, the token comes from the
      # environment), and the packages they install. AutoCroissant tests/test_card_guards.py runs --help on exactly this
      # list (card_guards.SPARSE_FILES).
      BOT_FILES: &bot-files |
        /commands/card_guards.py
        /commands/png_export.py
        /commands/card_standards.py
        /commands/txt2_repair.py
        /commands/psd_diff.py
        /commands/card_bake.py
        /commands/card_check.py
        /commands/psd_edit.py
        /commands/psd_regions.py
        /commands/psd_parser.py
        /commands/psd_parts.py
        /commands/text_align.py
        /commands/card_models.py
        /commands/card_edits.py
        /commands/font_check.py
        /commands/github_api.py
        /commands/git_commit.py
        /commands/repo_history.py
        /global_config.py
        /commands/psd_remote.py
        /requirements-cards.txt
        /commands/ability_place.py
        /commands/ability_index.json
        /commands/psd_links.py
        /commands/status_font.py
        /commands/psd_details.py
        /commands/png_changes.py
        /commands/standards_post.py
    outputs:
      mode: ${{ steps.start.outputs.mode }}
      started: ${{ steps.start.outputs.started }}
      checked: ${{ steps.check.outcome }}
      comment: ${{ steps.comment.outputs.id }}
      told: ${{ steps.comment.outputs.told }}
      land: ${{ steps.plan.outputs.land }}
      fixes: ${{ steps.plan.outputs.fixes }}
      card_errors: ${{ steps.plan.outputs.card_errors }}
      early: ${{ steps.early.outputs.started }}
      early_run: ${{ steps.early.outputs.run }}
      land_ran: ${{ steps.land.outputs.ran }}
      land_sha: ${{ steps.land.outputs.sha }}
      land_already: ${{ steps.land.outputs.already }}
      saved: ${{ steps.setup.outputs.wheels == 'built' || (steps.font-cache.outcome == 'success' && steps.font-cache.outputs.cache-hit != 'true') }}
    steps:
      # OUT is set here: a job's env may not read the runner context. MODE lowercased: the job's `if` takes "On", the
      # shell does not. STARTED: the failure alert tells a cancel by hand from a job's timeout. The post job reads them.
      - name: Start
        id: start
        shell: bash
        run: |
          mode=$(printf %s "$MODE" | tr '[:upper:]' '[:lower:]')
          {
            echo "OUT=$RUNNER_TEMP/guards"
            echo "MODE=$mode"
          } >> "$GITHUB_ENV"
          { echo "started=$(date +%s)"; echo "mode=$mode"; } >> "$GITHUB_OUTPUT"

      # In the background beside the card checkout (in RUNNER_TEMP: that checkout empties the workspace): BOT_FILES at the
      # bot's main, the token in a header, never saved; in check, the data's render and spot records too (db/ on the data
      # branch, Card sync's; 3 tries), which the guards' renders and conversions read (AutoCroissant psd_edit.RECORDS_DIR;
      # one not read: {}). Bot waits for them. In check also every commit and tree of main and the data branch, the
      # checkout's slow part when GitHub is cold (3-9 s on 8 of 17 pushes, 11-09/10): History start joins them.
      - &bot-start
        name: Bot start
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_REPO: bobberlington/AutoCroissant
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          ( export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
            code=0
            { timeout 30 git clone -q --depth 1 --no-tags --single-branch --branch main --no-checkout \
                "$GITHUB_SERVER_URL/$BOT_REPO" "$RUNNER_TEMP/bot" \
              && git -C "$RUNNER_TEMP/bot" sparse-checkout set --no-cone --stdin <<< "$BOT_FILES" \
              && timeout 30 git -C "$RUNNER_TEMP/bot" checkout -q main; } || code=$?
            echo "$code" > "$RUNNER_TEMP/bot.code" ) < /dev/null > "$RUNNER_TEMP/bot.log" 2>&1 &
          [ "$GITHUB_JOB" = check ] || exit 0     # the two checks read no records, no history
          h=$RUNNER_TEMP/history.git
          ( export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
            code=0
            { git init -q --bare "$h" && git -C "$h" config uploadpack.allowFilter true \
              && timeout -k 5 120 git -C "$h" fetch -q --no-tags --filter=blob:none "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                +refs/heads/main:refs/heads/main +refs/heads/data:refs/heads/data; } || code=$?
            echo "$code" > "$h.code" ) < /dev/null > "$h.log" 2>&1 &
          dir=$RUNNER_TEMP/records
          mkdir -p "$dir"
          echo "CARD_RECORDS_DIR=$dir" >> "$GITHUB_ENV"
          ( for f in render_record.json spot_record.json; do
              { for try in 1 2 3; do
                  if timeout -k 2 20 gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/db/$f?ref=data" > "$dir/$f.part" 2> /dev/null \
                      && jq -e 'type == "object"' "$dir/$f.part" > /dev/null; then
                    mv "$dir/$f.part" "$dir/$f"
                    break
                  fi
                  rm -f "$dir/$f.part"
                  if [ "$try" = 3 ]; then echo "::warning::db/$f not read from the data branch: renders go without it"; else sleep "$try"; fi
                done; } &
            done
            wait; touch "$RUNNER_TEMP/records.done" ) < /dev/null > "$RUNNER_TEMP/records.log" 2>&1 &

      # The head's commit and trees, no card blobs (the 28 GB of PSDs and PNGs are never checked out): the push's range and
      # its PNG pairing come from the trees; the pushed PSDs and PNGs come by blob sha through the API, verified. Every
      # other commit comes in the background: the push's first head (Pushed blobs start), in check the rest (History).
      - &card-repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: "blob:none"
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/

      # A push's PSD and PNG blobs (both sides), as git's own lazy fetch asks: the checks and the guards read the clone
      # first, so ~3 REST reads per card become none. It needs only the trees, so it starts here, in the background:
      # first the push's first head (depth 1; in check the data branch too), then the list (blobs.ready: History start
      # and the two checks wait for it), then the fetch. Check (and in `checks` the two checks) waits for each listed
      # blob it reads (CARD_BLOBS_PENDING); 5 minutes at most, its exit code in blobs.done (then a blob still missing goes
      # by REST). Blob fetches never deepen, so they run beside History start's join.
      # 8 at most to a fetch, 4 at a time, in diff order: GitHub's delta search is what takes the time, and small packs
      # barely need one; a file's two sides stay in one fetch, so the deltas still shrink the transfer.
      # In `check` also the other blobs Check reads: first the edits, the icon manifest, the status chart, the card data
      # and its links (main's head and the data branch), then with each pushed card PSD its PNG and numbered PNGs
      # (png_for, loosely: one missed goes by REST).
      - &blobs-start
        name: Pushed blobs start
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$BEFORE" in ''|*[!0]*) ;; *) echo "a new branch: nothing to fetch"; exit 0;; esac
          [ -n "$BEFORE" ] || exit 0
          export GIT_NO_LAZY_FETCH=1
          list=$RUNNER_TEMP/blobs
          (
            git cat-file -e "$BEFORE^{commit}" 2> /dev/null \
              || git fetch -q --depth=1 --no-tags --no-write-fetch-head --filter=blob:none origin "$BEFORE" &
            [ "$GITHUB_JOB" != check ] \
              || git fetch -q --no-tags --no-write-fetch-head --filter=blob:none origin +refs/heads/data:refs/remotes/origin/data &
            wait
            pngs=/dev/null
            if [ "$GITHUB_JOB" = check ]; then           # the head's PNGs, "<blob>\t<path>"
              pngs=$list.pngs
              git -c core.quotePath=false ls-tree -r "$GITHUB_SHA" \
                | awk -F '\t' 'tolower($2) ~ /\.png$/ {split($1, f, " "); print f[3] "\t" $2}' > "$pngs" || true
            fi
            # a line a changed file: its two sides, then a card PSD's PNGs
            git -c core.quotePath=false diff-tree -r --no-renames "$BEFORE" "$GITHUB_SHA" -- '*.psd' '*.PSD' '*.png' '*.PNG' \
              | awk -F '\t' -v pngs="$pngs" '
                  function dir(p) { return match(p, /.*\//) ? substr(p, 1, RLENGTH) : "" }
                  function stem(p, d) { return tolower(substr(p, length(d) + 1, length(p) - length(d) - 4)) }
                  BEGIN {
                    while ((getline line < pngs) > 0) {
                      split(line, f, "\t"); d = dir(f[2]); k = ++n[d]; name[d, k] = stem(f[2], d); sha[d, k] = f[1]
                    }
                  }
                  {
                    split($1, f, " "); out = f[3] " " f[4]
                    if (f[5] ~ /^[AM]/ && tolower($2) ~ /\.psd$/ && ("/" $2) !~ /\/(MDW|Markers)\//) {
                      d = dir($2); s = stem($2, d)
                      for (i = 1; i <= n[d]; i++)
                        if (substr(name[d, i], 1, length(s)) == s && substr(name[d, i], length(s) + 1) ~ /^[0-9]*$/) out = out " " sha[d, i]
                    }
                    print out
                  }' > "$list.push" || true
            [ -s "$list.push" ] || { echo "no card blobs pushed"; touch "$list.ready"; exit 0; }
            # the list: a blob a line; the fetches: a line each, whole lines of $list.push up to 8 blobs
            if [ "$GITHUB_JOB" = check ]; then
              for spec in "$GITHUB_SHA:site/Card Edits.json" "$GITHUB_SHA:MDW/Fonts/stoogedings-src/stoogedings.json" \
                  "$GITHUB_SHA:MDW/Croissant's Special Folder/Satus Effect Colors.psd" origin/data:db/stats.json \
                  origin/data:db/links.json; do
                git rev-parse -q --verify "$spec" || true
              done | tr '\n' ' '
              echo
            fi | cat - "$list.push" | awk -v list="$list" '
                { k = 0; for (i = 1; i <= NF; i++) if ($i !~ /^0+$/ && !seen[$i]++) { print $i > list; u[++k] = $i } }
                n && n + k > 8 { print line; line = ""; n = 0 }
                { for (i = 1; i <= k; i++) line = line (n++ ? " " : "") u[i] }
                END { if (n) print line }' > "$list.fetch"
            touch "$list.ready"
            echo "fetching $(wc -l < "$list") blobs"
            # the shallow file hidden, as before depth 1: GitHub sends them as stored (13 blobs, 247 MB: 5-7 s; with the
            # shallow lines its delta search took 8-10 s, 11-10)
            GIT_SHALLOW_FILE='' timeout -k 10 300 xargs -P 4 -L 1 git -c fetch.negotiationAlgorithm=noop fetch -q --no-tags \
              --no-write-fetch-head --recurse-submodules=no --filter=blob:none origin < "$list.fetch" || code=$?
            echo "${code:-0}" > "$list.done"
          ) < /dev/null > "$list.log" 2>&1 &
          echo $! > "$list.pid"
          echo "listing and fetching in the background"

      # In check, the depth-1 checkout and the push's first head (Pushed blobs start's, once listed) joined to Bot start's
      # history in the background (a local fetch: 0.3 s; GitHub's history is the fallback), while Bot and the venv set up.
      # Only the two deepening fetches take shallow.lock, so the join waits for the first head; History waits for it.
      - name: History start
        if: env.MODE != 'off'
        shell: bash
        run: |
          h=$RUNNER_TEMP/history.git list=$RUNNER_TEMP/blobs
          (
            export GIT_NO_LAZY_FETCH=1
            until [ -s "$h.code" ] || [ "$SECONDS" -ge 130 ]; do sleep 0.05; done      # its fetch: 120 s at most
            [ ! -s "$list.pid" ] || while [ ! -e "$list.ready" ] && kill -0 "$(cat "$list.pid")" 2> /dev/null; do sleep 0.05; done
            code=$(cat "$h.code" 2> /dev/null) || code=none
            if [ "$code" = 0 ] && [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              specs=(refs/heads/main)
              git rev-parse -q --verify refs/remotes/origin/data > /dev/null || specs+=(+refs/heads/data:refs/remotes/origin/data)
              git -c remote.history.url="file://$h" -c remote.history.promisor=true -c remote.history.partialclonefilter=blob:none \
                fetch -q --unshallow --no-tags --no-write-fetch-head --filter=blob:none history "${specs[@]}" || true
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              echo "::warning::the card repo's history fetched again (Bot start's: $code)"; cat "$h.log" 2> /dev/null || true
              git fetch -q --unshallow --no-tags --no-write-fetch-head --filter=blob:none origin || true
            fi
            touch "$RUNNER_TEMP/history.done"
          ) < /dev/null > "$RUNNER_TEMP/history.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/history.pid"

      # The clone in bot/ (15 s at most) and the records (75) once done; a clone failed or late: checked out as ever
      - &bot
        name: Bot
        id: bot
        shell: bash
        run: |
          while [ ! -s "$RUNNER_TEMP/bot.code" ] && [ "$SECONDS" -lt 15 ]; do sleep 0.02; done
          while [ -n "${CARD_RECORDS_DIR:-}" ] && [ ! -f "$RUNNER_TEMP/records.done" ] && [ "$SECONDS" -lt 75 ]; do sleep 0.05; done
          cat "$RUNNER_TEMP/records.log" 2> /dev/null || true
          if [ "$(cat "$RUNNER_TEMP/bot.code" 2> /dev/null)" = 0 ] && mv "$RUNNER_TEMP/bot" bot; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the bot's clone failed or took 15 s: checked out instead"; cat "$RUNNER_TEMP/bot.log" 2> /dev/null || true
          fi

      - &bot-repo
        if: steps.bot.outputs.ok != 'true'
        uses: actions/checkout@v7
        with:
          repository: bobberlington/AutoCroissant
          path: bot
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ env.BOT_FILES }}

      # requirements-cards.txt's wheels and the oxipng CLI (the lossless PNG recompression; the checks write no PNG)
      - &setup
        timeout-minutes: 10
        uses: ./.github/actions/cards-venv
        id: setup
        with:
          oxipng: ${{ github.job != 'checks' }}

      # History start's join (Check, the earlier fonts and a dispatch's window read every commit): a shallow clone fails
      - name: History
        if: env.MODE != 'off'
        timeout-minutes: 5
        shell: bash
        run: |
          while [ ! -e "$RUNNER_TEMP/history.done" ] && kill -0 "$(cat "$RUNNER_TEMP/history.pid" 2> /dev/null)" 2> /dev/null; do
            sleep 0.05
          done
          cat "$RUNNER_TEMP/history.log" 2> /dev/null || true
          if [ "$(GIT_NO_LAZY_FETCH=1 git rev-parse --is-shallow-repository)" != false ]; then
            echo "::error::the card repo's history did not come: not checked"
            exit 1
          fi

      # The icon font, current first (Check's first font read, before the fonts restore is in), then its past versions
      # (AutoCroissant card_guards.earlier_fonts: badge widths; 10, 79 MB on 11-08), 40 at most, in the background: raw
      # files by commit (no REST read), 4 at a time, into CARD_EARLIER_FONTS. Check reads a version there first; one
      # missing or late goes by the fonts restore or REST as before.
      - name: Earlier fonts start
        if: env.MODE != 'off'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AFTER: ${{ inputs.sha || github.sha }}
        run: |
          dir=$RUNNER_TEMP/earlier-fonts
          font=MDW/Fonts/stoogedings.ttf
          mkdir -p "$dir"
          now=$(GIT_NO_LAZY_FETCH=1 git rev-parse -q --verify "$AFTER:$font") || { echo "no icon font"; exit 0; }
          at=$(GIT_NO_LAZY_FETCH=1 git rev-parse "$AFTER^{commit}")
          { GIT_NO_LAZY_FETCH=1 git log --no-renames --raw --no-abbrev --format='C %H' "$AFTER" -- "$font" || true; } \
            | awk -v now="$now" -v at="$at" 'BEGIN {print at, now; seen[now] = 1} $1 == "C" {c = $2; next}
                /^:/ && $4 !~ /^0+$/ && !seen[$4]++ {print c, $4; if (++n == 40) exit}' > "$dir/list"
          echo "CARD_EARLIER_FONTS=$dir" >> "$GITHUB_ENV"
          FONT=$font nohup timeout -k 10 120 xargs -P 4 -n 2 bash -c 'printf "header = \"Authorization: token %s\"\n" "$GH_TOKEN" \
            | curl -fsS --retry 2 -K - -o "$0/$2.part" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$1/$FONT" \
            && mv "$0/$2.part" "$0/$2"' "$dir" < "$dir/list" > "$dir/log" 2>&1 &
          echo "fetching $(wc -l < "$dir/list") icon fonts"

      # A landing dispatch would post before a waiting push run of its commit (or a later one): refused.
      - name: No push run in its window
        if: github.event_name == 'workflow_dispatch' && env.MODE == 'on'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha }}
        run: |
          sha=$(git rev-parse --verify "${SHA:-$GITHUB_SHA}^{commit}")
          heads=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow card-guards.yml --event push --limit 50 \
            --json status,headSha --jq '.[] | select(.status != "completed") | .headSha')
          for head in $heads; do
            status=0
            GIT_NO_LAZY_FETCH=1 git merge-base --is-ancestor "$sha" "$head" 2> /dev/null || status=$?
            if [ "$status" != 1 ]; then
              echo "::error::the push run of ${head:0:8} is still in its quiet window: dispatch again once it has finished, or as a dry run"
              exit 1
            fi
          done

      # A push's Check starts here, beside the fonts restore (a dispatch's runs at Check, after its two checks): its first
      # font read waits for Fonts ready's mark (AutoCroissant card_guards.fonts_ready). Output and exit code in RUNNER_TEMP.
      - name: Check start
        if: github.event_name == 'push' && env.MODE != 'off'
        working-directory: bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AUTHOR: ${{ github.actor }}
          CARD_BLOBS_PENDING: ${{ runner.temp }}/blobs
          CARD_FONTS_READY: ${{ runner.temp }}/fonts.ready
        run: |
          args=(--clone "$GITHUB_WORKSPACE" --repo "$GITHUB_REPOSITORY" --after "$GITHUB_SHA" --out "$OUT" --mode "$MODE"
                --author "$AUTHOR" --before "$BEFORE")
          t=$RUNNER_TEMP/check
          nohup bash -c 'python -m commands.card_guards check "$@" > "$0.out" 2> "$0.err"; echo $? > "$0.code"' "$t" "${args[@]}" \
            < /dev/null > /dev/null 2>&1 &
          echo $! > "$t.pid"

      # Fonts for the font check (and R8's box text): MDW/Fonts' top level, cached by its tree sha (Card sync's key); the
      # sparse checkout fetches them only on a miss. One that fails leaves no folder: no font check (it would call every
      # font missing), R8 fetches its own, and nothing is cached.
      - &fonts
        id: fonts
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:MDW/Fonts)" >> "$GITHUB_OUTPUT"

      - id: font-cache
        uses: actions/cache@v6
        with:
          path: MDW/Fonts
          key: card-fonts-${{ steps.fonts.outputs.sha }}

      - &fonts-miss
        id: fonts-miss
        if: steps.font-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! git sparse-checkout add '/MDW/Fonts/*' '!/MDW/Fonts/stoogedings-src/'; then
            echo "::warning::the fonts were not fetched: no font check"
            rm -rf MDW/Fonts
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # The mark Check start's font reads wait for: MDW/Fonts in, or absent (R8 then fetches its own)
      - name: Fonts ready
        if: always()
        shell: bash
        run: touch "$RUNNER_TEMP/fonts.ready"

      # A dispatch's two checks (a push's are the `checks` job's), one after the other before the guards' check: on one
      # runner, an `all` dispatch reads its 813 PSDs once (twice at once would pass GITHUB_TOKEN's 1,000 requests an hour).
      # `sha`'s (or main's head's) own PSDs, or with `all` every card PSD of the tree. Each exits 0 on findings (an
      # unreadable PSD or a failed API call is one line in its report); one that breaks anyway is a warning and never
      # stops the guards. report.md, report.json and discord.json in $RUNNER_TEMP/<check>. --clone: a PSD is fetched
      # once into this clone, then read from it by the next one.
      - name: Card check
        id: card-check
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: ${{ inputs.all && 45 || 10 }}
        working-directory: bot
        shell: bash
        env:
          CHECK: card-check
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AFTER: ${{ inputs.sha || github.sha }}
          ALL: ${{ inputs.all }}
        run: |
          out=$RUNNER_TEMP/$CHECK
          mkdir -p "$out"
          args=(--repo "$GITHUB_REPOSITORY" --clone "$GITHUB_WORKSPACE" --after "$AFTER" --json "$out/report.json"
                --discord "$out/discord.json")
          [ "$CHECK" = font-check ] && args+=(--fonts "$GITHUB_WORKSPACE/MDW/Fonts")
          [ "$ALL" = true ] && args+=(--whole-tree)
          python -m "commands.${CHECK/-/_}" "${args[@]}" | tee "$out/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Font check
        id: font-check
        if: github.event_name != 'push' && steps.fonts-miss.outputs.ok != 'false'
        continue-on-error: true
        timeout-minutes: ${{ inputs.all && 45 || 10 }}
        working-directory: bot
        shell: bash
        env:
          CHECK: font-check
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AFTER: ${{ inputs.sha || github.sha }}
          ALL: ${{ inputs.all }}
        run: |
          out=$RUNNER_TEMP/$CHECK
          mkdir -p "$out"
          args=(--repo "$GITHUB_REPOSITORY" --clone "$GITHUB_WORKSPACE" --after "$AFTER" --json "$out/report.json"
                --discord "$out/discord.json")
          [ "$CHECK" = font-check ] && args+=(--fonts "$GITHUB_WORKSPACE/MDW/Fonts")
          [ "$ALL" = true ] && args+=(--whole-tree)
          python -m "commands.${CHECK/-/_}" "${args[@]}" | tee "$out/report.md" >> "$GITHUB_STEP_SUMMARY"

      # A push: before..after. A dispatch: `sha` (or main's head) against its first parent, or with `all` every card PSD.
      # report.md is the job summary and the comment; plan.json feeds Land. Exit 1: not checked (the alert). A push's
      # started at Check start: its output and exit code here once it ends.
      - name: Check
        id: check
        if: env.MODE != 'off'
        timeout-minutes: ${{ inputs.all && 60 || 15 }}
        working-directory: bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          # names an author with no GitHub account; never the dispatcher
          AUTHOR: ${{ github.event_name == 'push' && github.actor || '' }}
          SHA: ${{ inputs.sha }}
          CARDS: ${{ inputs.cards }}
          ALL: ${{ inputs.all }}
          CARD_BLOBS_PENDING: ${{ runner.temp }}/blobs    # Pushed blobs start's list: a blob in it is waited for
        run: |
          t=$RUNNER_TEMP/check
          if [ -s "$t.pid" ]; then
            while [ ! -s "$t.code" ] && kill -0 "$(cat "$t.pid")" 2> /dev/null; do sleep 0.05; done
            code=$(cat "$t.code" 2> /dev/null) || echo "::error::the check ended without an exit code"
            cat "$t.err" >&2
            tee -a "$GITHUB_STEP_SUMMARY" < "$t.out"
            exit "${code:-1}"
          fi
          args=(--clone "$GITHUB_WORKSPACE" --repo "$GITHUB_REPOSITORY" --after "${SHA:-$GITHUB_SHA}" --out "$OUT" --mode "$MODE")
          [ -n "$AUTHOR" ] && args+=(--author "$AUTHOR")
          [ -n "$BEFORE" ] && args+=(--before "$BEFORE")
          [ -n "$CARDS" ] && args+=(--cards "$CARDS")
          [ "$ALL" = "true" ] && args+=(--whole-tree)
          python -m commands.card_guards check "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Whether there is anything to land or tell (none: no Land, no post job). summary.json's told, writes and card
      # errors. fixes: a push's writes to land (on).
      # normalise: the PSDs the Normalise step converts (on and dry only; never `all`), counted as writes.
      - name: Plan for the post job
        id: plan
        if: always() && steps.check.outcome == 'success'
        shell: bash
        env:
          ALL: ${{ inputs.all }}
        run: |
          n=$(jq '.normalise // 0' "$OUT/summary.json")
          if [ "$ALL" = true ] || { [ "$MODE" != on ] && [ "$MODE" != dry ]; }; then n=0; fi
          echo "normalise=$n" >> "$GITHUB_OUTPUT"
          jq -e --arg mode "$MODE" --argjson n "$n" '.told + (if $mode == "on" then .writes + $n else 0 end) > 0' \
            "$OUT/summary.json" > /dev/null && echo "land=true" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$MODE" = on ] && jq -e --argjson n "$n" '.writes + $n > 0' "$OUT/summary.json" > /dev/null; then
            echo "fixes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "card_errors=$(jq '.card_errors // 0' "$OUT/summary.json")" >> "$GITHUB_OUTPUT"

      # The mark Card sync reads (its step "Guards' fixes", by this name): this push's main lane leaves it to the run
      # Start Card sync starts (else the post job's Follow up; landed or not).
      - name: Fixes to land
        if: always() && steps.plan.outputs.fixes == 'true'
        shell: bash
        run: echo "This push's fixes land below; the Card sync run started next bakes and saves them."

      # With fixes and 25 PSDs or fewer to convert (Normalise and Land within a minute: 23 PSDs took 42 s): Card sync at
      # once, with this run's id (its lanes set up while the guards land, then wait for Landed); its run id for Follow up.
      # A bigger Normalise would hold card-data and card-main for minutes: then, or not started, Follow up starts it.
      - name: Start Card sync
        id: early
        if: ${{ !cancelled() && steps.plan.outputs.fixes == 'true' && steps.plan.outputs.normalise <= 25 }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          out=$(gh api --method POST "repos/$GH_REPO/actions/workflows/card-sync.yml/dispatches" -f ref=main -F return_run_details=true \
            -f "inputs[dry_run]=false" -f "inputs[bake]=pending" -f "inputs[guards]=$GITHUB_RUN_ID")
          echo "started=true" >> "$GITHUB_OUTPUT"
          echo "run=$(jq -r '.workflow_run_id // ""' <<< "$out" 2> /dev/null)" >> "$GITHUB_OUTPUT"

      # The verdict is in: Card sync's wait ends here (by this name), not at the job's end. Keep it after Fixes to land.
      - name: Decided
        if: always()
        shell: bash
        run: "true"

      # Waits for Pushed blobs start's fetch and counts what it brought. One that fails or times out leaves the rest to the
      # REST reads. Here after Decided, in `checks` after the two checks (they wait for each blob they read).
      - &pushed-blobs
        name: Pushed blobs
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          list=$RUNNER_TEMP/blobs
          [ -s "$list" ] || exit 0
          until [ -s "$list.done" ]; do sleep 0.2; done
          cat "$list.log"
          have=$(GIT_NO_LAZY_FETCH=1 git cat-file --batch-check < "$list" | grep -vc ' missing$' || true)
          echo "$have of $(wc -l < "$list") pushed blobs in the clone"
          [ "$have" -eq "$(wc -l < "$list")" ] || echo "::warning::$have of $(wc -l < "$list") pushed blobs fetched: the rest by REST"
          exit "$(cat "$list.done")"

      # With fixes to land, in the background beside Normalise: Land's history clone (git_commit's), reading the checkout's
      # objects too (Pushed blobs' two sides of each PSD and PNG). With those land pushes by git at any size, delta search
      # sending only what changed (e58b8cfd's landing: 70.0 -> 6.05 MB). Failed: land clones it as before.
      - name: History clone start
        if: ${{ !cancelled() && steps.plan.outputs.fixes == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          h=$RUNNER_TEMP/TTSCardMaker-history.git
          ( timeout 30 git clone -q --bare --filter=blob:none "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$h.part" \
              && echo "$GITHUB_WORKSPACE/.git/objects" >> "$h.part/objects/info/alternates" && mv "$h.part" "$h" \
              || { echo "::warning::the history clone failed: land makes its own"; rm -rf "$h.part"; }
            touch "$h.done" ) < /dev/null > "$h.log" 2>&1 &
          echo $! > "$h.pid"

      # The conversion's Types/ pixels (92 files, one fetch). The cached fonts sit outside the patterns: kept.
      - name: Types for the conversion
        id: types
        if: ${{ !cancelled() && steps.plan.outputs.normalise > 0 }}
        continue-on-error: true   # no conversion this push: the PSDs stay as pushed
        timeout-minutes: 5
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: "0"
        run: |
          git config sparse.expectFilesOutsideOfPatterns true
          git sparse-checkout add /Types/

      # The conversions into plan.json and summary.json (writes, files), silent. No card starts past minute 28 of the job;
      # one not started, or a broken step, stays as pushed: its next push converts it.
      - name: Normalise
        id: normalise
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 30
        working-directory: bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STARTED: ${{ steps.start.outputs.started }}
        run: |
          left=$((STARTED + 36 * 60 - $(date +%s)))   # killed by minute 36: Land, the comment and the artifact fit the job's 60
          [ "$left" -ge 60 ] || { echo "Minute 35 of the job passed: the pushed PSDs stay as pushed."; exit 0; }
          if ! timeout "$left" python -m commands.card_guards normalise --out "$OUT" --clone "$GITHUB_WORKSPACE" --repo "$GITHUB_REPOSITORY" \
              --deadline "$((STARTED + 28 * 60))" | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "::warning::the conversion broke: the pushed PSDs stay as pushed"
            exit 1
          fi

      # At once (CARD_GUARDS=on): leave out every write whose blobs moved and commit the rest once (git_commit: the API
      # with GITHUB_TOKEN, retried on a moved head), and settle the guards' lines of the post (landed.json's told; the
      # tell job's) and the comment's new body (report-landed.md). Report mode: --dry-run (its writes are told as lines,
      # never made). Exit 1: the commit failed (both files are written first: land never raises). A dispatch with
      # dry_run off lands the same way (No push run in its window refused it while a push run of its commit was
      # unfinished). --rerun (a re-run, a dispatch): an earlier run may have landed the writes, so a branch that cannot
      # be read tells none of them as not made. Only with something to land or tell (Plan's land, report or on), as the
      # post job.
      - name: Land
        id: land
        if: ${{ !cancelled() && steps.plan.outputs.land == 'true' && (env.MODE == 'report' || env.MODE == 'on') }}
        timeout-minutes: 20
        working-directory: bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          AUTOCROISSANT_HISTORY_CLONE: ${{ runner.temp }}/TTSCardMaker-history.git   # git_commit's (History clone start)
        run: |
          echo "ran=true" >> "$GITHUB_OUTPUT"
          h=$AUTOCROISSANT_HISTORY_CLONE
          [ ! -s "$h.pid" ] || while [ ! -e "$h.done" ] && kill -0 "$(cat "$h.pid")" 2> /dev/null; do sleep 0.05; done
          cat "$h.log" 2> /dev/null || true
          args=(--plan "$OUT/plan.json" --repo "$GITHUB_REPOSITORY")
          [ "$MODE" = report ] && args+=(--dry-run)
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ] || [ "$EVENT" != push ]; then args+=(--rerun); fi
          status=0
          python -m commands.card_guards land "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          {
            echo "sha=$(jq -r '.sha // ""' "$OUT/landed.json" 2> /dev/null)"
            echo "already=$(jq -r '.already // [] | length' "$OUT/landed.json" 2> /dev/null)"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      # The landed commit's changelog events (guard-events.json: re-made or recompressed PNGs and the fixes, never the
      # Single-line Composer) for the card sync's data job, which finds this run by the push and reads them (the Changes
      # page shows them, Discord never: AutoCroissant docs/Finished/session-2026-10-26/CARD_SYNC_VERDICTS.md). Before Landed.
      - uses: actions/upload-artifact@v7
        if: always() && steps.land.outputs.sha != ''
        with:
          name: guard-events
          path: ${{ runner.temp }}/guards/guard-events.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      # What the landed PSD writes read before the strip (records.json: look facts, icons' earlier cores) for the data's
      # render and spot records: Card sync's data jobs merge every guard-records artifact once (db/bake-records.json).
      - uses: actions/upload-artifact@v7
        if: always() && steps.land.outputs.sha != ''
        with:
          name: guard-records
          path: ${{ runner.temp }}/guards/records.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90  # unmerged records wait for a data job

      # Land and its uploads are done (or never ran): a follow-up Card sync's wait ends here (by this name), not at the
      # job's end. Keep it after the uploads.
      - name: Landed
        if: always()
        shell: bash
        run: "true"

      # The report as a comment on the pushed commit, when it says more than "nothing to do" (summary.json's "comment":
      # told, written, a card's error, or comment-only lines such as R10). A re-run edits the oldest guards comment, and
      # once any of them carries the TOLD mark it does not post again. The lookup is tried 3 times; a re-run or a dispatch
      # that still cannot read it counts as told (an earlier run may have posted). After Land, whatever it did (the post
      # job rewrites this comment with what Land settled); a failed call fails the run.
      - name: Comment on the commit
        id: comment
        if: ${{ !cancelled() && steps.check.outcome == 'success' && (env.MODE == 'report' || env.MODE == 'on') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -e '.comment > 0' "$OUT/summary.json" > /dev/null || exit 0
          after=$(jq -r .after "$OUT/plan.json")
          # the guards' comments on commit $1, oldest first: "<id> <told>" a line (the same lookup as the failure alert's)
          guards_comments() {
            local wait raw
            for wait in 0 10 30; do
              sleep "$wait"
              raw=$(gh api "repos/$GITHUB_REPOSITORY/commits/$1/comments" --paginate) || continue
              jq -r --arg told "$TOLD" '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## Card guards")))
                | "\(.id) \(.body | contains($told))"' <<< "$raw"
              return
            done
            return 1
          }
          if ! found=$(guards_comments "$after"); then
            if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ] || [ "$GITHUB_EVENT_NAME" != push ]; then
              echo "told=true" >> "$GITHUB_OUTPUT"
              echo "::error::the commit's comments could not be read: no comment and no post, as an earlier run may have told Discord; re-run once GitHub answers, or this push may stay untold"
              exit 1
            fi
            found=""                            # a push run's first attempt: no earlier comment of its own
          fi
          old=${found%% *}
          body="$OUT/report.md"
          if [[ "$found" == *" true"* ]]; then
            echo "told=true" >> "$GITHUB_OUTPUT"
            { cat "$OUT/report.md"; printf '\n%s\n' "$TOLD"; } > "$OUT/report-told.md"
            body="$OUT/report-told.md"
          fi
          if [ -n "$old" ]; then
            echo "id=$old" >> "$GITHUB_OUTPUT"  # before the edit: a failed edit keeps the id
            jq -n --rawfile body "$body" '{body: $body}' \
              | gh api --method PATCH "repos/$GITHUB_REPOSITORY/comments/$old" --input - > /dev/null
          else
            id=$(jq -n --rawfile body "$body" '{body: $body}' \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/commits/$after/comments" --input - --jq .id)
            echo "id=$id" >> "$GITHUB_OUTPUT"
          fi

      # overwrite: a re-run replaces its earlier attempt's (one name per run); with what Land settled (landed.json,
      # report-landed.md) for the post and tell jobs. Never files/ (Land read it from disk; the root stays guards/).
      - uses: actions/upload-artifact@v7
        if: always() && env.MODE != 'off'
        with:
          name: card-guards
          path: |
            ${{ runner.temp }}/guards
            !${{ runner.temp }}/guards/files
          if-no-files-found: ignore
          overwrite: true

      # The written files, kept only when they did not reach main (report, dry, Land skipped or failed).
      - uses: actions/upload-artifact@v7
        if: always() && env.MODE != 'off' && (env.MODE != 'on' || steps.land.outcome != 'success')
        with:
          name: card-guards-files
          path: ${{ runner.temp }}/guards/files
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  # A push's card check and font check, beside `check`: Card sync's guards wait and the post job wait for that one alone.
  # Never a gate, whatever CARD_GUARDS says. `check` saves the font cache; the tell job posts their reports, finish's
  # alert reads this job's result too.
  checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40    # finish's alert reads 40
    permissions:
      contents: read      # the tell job comments
    env:
      BOT_FILES: *bot-files
    steps:
      - *bot-start
      - *card-repo
      - *blobs-start
      - *bot
      - *bot-repo
      - *setup
      - *fonts

      - id: font-cache
        uses: actions/cache/restore@v6
        with:
          path: MDW/Fonts
          key: card-fonts-${{ steps.fonts.outputs.sha }}

      - *fonts-miss

      # The card check and the font check side by side (the font check in the background), each reading a pushed PSD as
      # the fetch brings it: the PSDs changed between the push's two heads, each card's notes its PSD before the push
      # lacked as its new ones. Findings exit 0; one that breaks is a warning. Each writes its report.md and report.json
      # in $RUNNER_TEMP/<check>; the reports go to the summary in that order once both have ended.
      - name: Card and font checks
        continue-on-error: true
        timeout-minutes: 15
        working-directory: bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AUTHOR: ${{ github.actor }}
          FONTS: ${{ steps.fonts-miss.outputs.ok != 'false' }}
          CARD_BLOBS_PENDING: ${{ runner.temp }}/blobs
        run: |
          list=$RUNNER_TEMP/blobs     # the push's first head (a big push's files come from the clone) and the list in
          [ ! -s "$list.pid" ] || while [ ! -e "$list.ready" ] && kill -0 "$(cat "$list.pid")" 2> /dev/null; do sleep 0.05; done
          check() {
            local out=$RUNNER_TEMP/$1 args
            mkdir -p "$out"
            args=(--repo "$GITHUB_REPOSITORY" --clone "$GITHUB_WORKSPACE" --after "$GITHUB_SHA" --before "$BEFORE"
                  --author "$AUTHOR" --json "$out/report.json")
            [ "$1" != font-check ] || args+=(--fonts "$GITHUB_WORKSPACE/MDW/Fonts")
            python -m "commands.${1/-/_}" "${args[@]}" > "$out/report.md"
          }
          names=(card-check) fonts='' failed=''
          if [ "$FONTS" = true ]; then names+=(font-check); check font-check & fonts=$!; fi
          check card-check || failed+=" card-check"
          [ -z "$fonts" ] || wait "$fonts" || failed+=" font-check"
          for name in "${names[@]}"; do cat "$RUNNER_TEMP/$name/report.md" >> "$GITHUB_STEP_SUMMARY" || true; done
          [ -z "$failed" ] || { echo "::warning::these checks broke:$failed"; exit 1; }

      - *pushed-blobs

      # The two checks' reports (report.md, report.json; card-check/ and font-check/) for the tell job: their comments and
      # their part of the post
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: card-checks
          path: |
            ${{ runner.temp }}/card-check
            ${{ runner.temp }}/font-check
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  # Right after the check (owner, 2026-11-03: the 30-minute quiet window and its environment card-guards-quiet are gone):
  # Follow up (the comment with what Land settled; Card sync when Start Card sync did not). Only when the check found
  # something to land or tell (report or on). Land is the check job's; the post is the tell job's.
  post:
    needs: check
    if: >-
      !cancelled() && needs.check.outputs.checked == 'success' && needs.check.outputs.land == 'true' &&
      (needs.check.outputs.mode == 'report' || needs.check.outputs.mode == 'on')
    runs-on: ubuntu-latest
    timeout-minutes: 10     # the comment and a start
    env:
      TOLD: "<!-- card-guards: told on Discord -->"
      MODE: ${{ needs.check.outputs.mode }}
      GH_REPO: ${{ github.repository }}     # gh workflow run with no checkout
    steps:
      - name: Work dir
        shell: bash
        run: echo "OUT=$RUNNER_TEMP/guards" >> "$GITHUB_ENV"

      # The check job's plan.json, report.md, summary.json and what Land settled (never files/).
      - uses: actions/download-artifact@v8
        with:
          name: card-guards
          path: ${{ runner.temp }}/guards

      # Whether this push was told already (Follow up keeps the mark): the Comment step's answer, and when this job is
      # re-run alone (the check job's outputs are then its first attempt's) the commit comment's TOLD mark looked up again
      # (the Comment step's lookup; unreadable counts as told).
      - name: Told before
        id: told
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_TOLD: ${{ needs.check.outputs.told }}
        run: |
          if [ "$CHECK_TOLD" = true ]; then echo "told=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ] || exit 0
          after=$(jq -r .after "$OUT/plan.json")
          for wait in 0 10 30; do
            sleep "$wait"
            raw=$(gh api "repos/$GITHUB_REPOSITORY/commits/$after/comments" --paginate) || continue
            jq -s -e --arg told "$TOLD" 'add // [] | any(.[]; .user.login == "github-actions[bot]"
              and (.body | startswith("## Card guards")) and (.body | contains($told)))' <<< "$raw" > /dev/null \
              && echo "told=true" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "::warning::the commit's comments could not be read: no post, as an earlier attempt may have told Discord"
          echo "told=true" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN push triggers no workflow: the card sync is run here, its bake only for pending edits (its data
      # commit dispatches the site build; when it does not start, the comment says so and the run fails: the alert),
      # and again by a re-run that finds the writes already landed (its earlier attempt's may not have started; both
      # queue, so a second start is harmless). With fixes it always starts one, landed or not, Land broken or not: this
      # push's own Card sync run skipped its main lane for it (Card sync's "Guards' fixes"); none when the check job's
      # Start Card sync did (that run waits for Landed), unless its jobs are not read or a lane of it was cancelled: a
      # newer run took its place in the queue, maybe before Landed, and synced main without the fixes. The comment is
      # rewritten with what landed, what did not and why (a broken Land still says so).
      - name: Follow up
        id: follow
        if: always() && (needs.check.outputs.land_ran == 'true' || needs.check.outputs.fixes == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.check.outputs.land_sha }}
          ALREADY: ${{ needs.check.outputs.land_already }}
          COMMENT: ${{ needs.check.outputs.comment }}
          TOLD_BEFORE: ${{ steps.told.outputs.told }}
          FIXES: ${{ needs.check.outputs.fixes }}
          LAND_RAN: ${{ needs.check.outputs.land_ran }}
          EARLY: ${{ needs.check.outputs.early }}
          EARLY_RUN: ${{ needs.check.outputs.early_run }}
        run: |
          refresh=ok start=""
          [ -n "$SHA" ] && start=true
          [ "$FIXES" = true ] && start=true
          if [ "$MODE" = on ] && [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ] && [ "${ALREADY:-0}" -gt 0 ]; then start=true; fi
          if [ "$EARLY" = true ]; then
            lost=1
            [ -z "$EARLY_RUN" ] || lost=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EARLY_RUN/jobs" \
              --jq '[.jobs[] | select((.name == "Card data" or .name == "Bake and save") and .conclusion == "cancelled")] | length') || lost=1
            if [ "${lost:-1}" = 0 ]; then start=""; else echo "Card sync run ${EARLY_RUN:-?}: a lane cancelled or not read: one more."; fi
          fi
          started=""
          if [ -n "$start" ]; then
            for wait in 0 10 30; do               # tried 3 times: with fixes no other run bakes this push
              sleep "$wait"
              if gh workflow run card-sync.yml -f dry_run=false -f bake=pending; then started=true; break; fi
            done
          fi
          if [ -n "$start" ] && [ -z "$started" ]; then
            refresh=failed
            echo "refresh=failed" >> "$GITHUB_OUTPUT"
            printf '\n**The card sync did not start after this commit: its next run catches up.**\n' \
              >> "$OUT/report-landed.md"
          fi
          if [ -n "$COMMENT" ] && [ "$LAND_RAN" = true ]; then
            body="$OUT/report-landed.md"
            if [ ! -f "$body" ]; then
              { cat "$OUT/report.md"; printf '\n**The bot could not finish this push (see the run): nothing above was committed.**\n'; } \
                > "$OUT/report-broken.md"
              body="$OUT/report-broken.md"
            fi
            [ "$TOLD_BEFORE" = true ] && printf '\n%s\n' "$TOLD" >> "$body"
            jq -n --rawfile body "$body" '{body: $body}' \
              | gh api --method PATCH "repos/$GITHUB_REPOSITORY/comments/$COMMENT" --input - > /dev/null \
              || echo "::warning::the commit comment could not be edited"
          fi
          if [ "$refresh" = failed ]; then echo "::error::the card sync did not start: run it by hand"; exit 1; fi

  # The standards channel's one post per push (owner 2026-11-11), whatever CARD_GUARDS says, once check, checks and post
  # are done (post's Follow up rewrites the guards' comment first): AutoCroissant commands/standards_post.py, on the
  # runner's own python3, merges the guards' lines as Land settled them with the two checks' notes. Once per push: the
  # TOLD mark on a commit comment covers the whole post (a re-run looks it up; unreadable counts as told). The two checks'
  # commit comments come from here too.
  tell:
    needs: [check, checks, post]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10     # the post and the comments; finish's alert reads 10
    permissions:
      contents: write     # the commit comments
      actions: read       # the run's artifacts
    env:
      TOLD: "<!-- card-guards: told on Discord -->"
      BOT_FILES: *bot-files
    outputs:
      told: ${{ steps.tell.outputs.told || steps.told.outputs.told }}
    steps:
      - *bot-start

      - name: Work dir
        shell: bash
        run: echo "OUT=$RUNNER_TEMP/guards" >> "$GITHUB_ENV"

      # The guards' plan.json, report.md and what Land settled (none with CARD_GUARDS off, or a check that broke first)
      - uses: actions/download-artifact@v8
        if: needs.check.outputs.mode == 'report' || needs.check.outputs.mode == 'on'
        continue-on-error: true
        with:
          name: card-guards
          path: ${{ runner.temp }}/guards

      # The two checks' report.md and report.json (none when the checks job broke first)
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: card-checks
          path: ${{ runner.temp }}/checks

      - *bot
      - *bot-repo

      # A re-run: the TOLD mark on any of the bot's comments on the pushed commit (the Comment step's answer first);
      # unreadable counts as told, as an earlier attempt may have posted. A first attempt cannot have told.
      - name: Told already
        id: told
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_TOLD: ${{ needs.check.outputs.told }}
        run: |
          if [ "$CHECK_TOLD" = true ]; then echo "told=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ] || exit 0
          for wait in 0 10 30; do
            sleep "$wait"
            raw=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --paginate) || continue
            if jq -s -e --arg told "$TOLD" 'add // [] | any(.[]; .user.login == "github-actions[bot]" and (.body | contains($told)))' \
                <<< "$raw" > /dev/null; then echo "told=true" >> "$GITHUB_OUTPUT"; fi
            exit 0
          done
          echo "::warning::the commit's comments could not be read: no post, as an earlier attempt may have told Discord"
          echo "told=true" >> "$GITHUB_OUTPUT"

      # The post (standards.json): the guards' part when they had lines to settle (plan.json and landed.json; a Land that
      # settled nothing leaves it out), the checks' reports. told=true (no failure alert for it) only when it went out
      # whole: the guards' part settled or not needed and the card check's report in. The URL is never printed; a failed
      # call warns. Then the comments: the TOLD mark on the guards' comment, the two checks' (each with notes; the mark on
      # the first when the guards' could not take it), else a comment of its own carries it.
      - name: Tell Discord
        id: tell
        if: steps.told.outputs.told != 'true'
        working-directory: bot
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_STANDARDS_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.check.outputs.mode }}
          CHECKED: ${{ needs.check.outputs.checked }}
          LAND: ${{ needs.check.outputs.land }}
          CHECKS: ${{ needs.checks.result }}
          COMMENT: ${{ needs.check.outputs.comment }}
        run: |
          checks=$RUNNER_TEMP/checks whole=true args=()
          if [ "$MODE" = report ] || [ "$MODE" = on ]; then
            if [ "$CHECKED" != success ]; then
              whole=""
            elif [ "$LAND" = true ]; then
              if [ -f "$OUT/landed.json" ]; then args+=(--plan "$OUT/plan.json" --landed "$OUT/landed.json"); else whole=""; fi
            fi
          fi
          for name in card-check font-check; do
            if [ -f "$checks/$name/report.json" ]; then args+=("--$name" "$checks/$name/report.json"); fi
          done
          if [ "$CHECKS" != success ] || [ ! -f "$checks/card-check/report.json" ]; then whole=""; fi
          mkdir -p "$OUT"
          python3 -m commands.standards_post --repo "$GITHUB_REPOSITORY" --after "$GITHUB_SHA" "${args[@]}" --out "$OUT/standards.json"
          mark=""
          if ! jq -e '.content // "" | length > 0' "$OUT/standards.json" > /dev/null; then
            echo "Nothing to tell."
          elif [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_STANDARDS_WEBHOOK is not set; no Discord message"
          elif curl -sS -o /dev/null -f -H "Content-Type: application/json" --data @"$OUT/standards.json" "$WEBHOOK"; then
            mark=$TOLD
            if [ -n "$whole" ]; then echo "told=true" >> "$GITHUB_OUTPUT"; fi
          else
            echo "::warning::the Discord webhook call failed; the commit comments stand"
          fi
          comment() {   # $1: the body file, $2: the mark or ""; a comment on the pushed commit
            { cat "$1"; if [ -n "$2" ]; then printf '\n%s\n' "$2"; fi; } > "$1.sent"
            jq -n --rawfile body "$1.sent" '{body: $body}' \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input - > /dev/null
          }
          if [ -n "$mark" ] && [ -n "$COMMENT" ]; then
            if { gh api "repos/$GITHUB_REPOSITORY/comments/$COMMENT" --jq .body && printf '\n%s\n' "$TOLD"; } > "$OUT/comment-told.md" \
                && jq -n --rawfile body "$OUT/comment-told.md" '{body: $body}' \
                  | gh api --method PATCH "repos/$GITHUB_REPOSITORY/comments/$COMMENT" --input - > /dev/null; then
              mark=""
            else
              echo "::warning::the guards' comment could not take the told mark"
            fi
          fi
          for name in card-check font-check; do
            if [ ! -f "$checks/$name/report.json" ] || ! jq -e '.cards | length > 0' "$checks/$name/report.json" > /dev/null; then
              echo "$name: nothing to report."
              continue
            fi
            if comment "$checks/$name/report.md" "$mark"; then mark=""; else echo "::warning::$name: the commit comment failed"; fi
          done
          if [ -n "$mark" ]; then
            body="$OUT/report-landed.md"
            [ -f "$body" ] || body="$OUT/report.md"
            [ -f "$body" ] || { echo "Told in the standards channel." > "$OUT/told.md"; body="$OUT/told.md"; }
            comment "$body" "$mark" || echo "::warning::no commit comment carries the told mark: a re-run would post again"
          fi

  # A red run where it should be one, and a broken push told in the standards channel: once per push (owner
  # 2026-11-11), across this workflow and Card sync by the failure marker.
  finish:
    needs: [check, checks, post, tell]
    if: always() && (github.event_name == 'push' || needs.check.outputs.mode != 'off')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # the commit comments: read, and the failure marker
      actions: read       # the run's jobs
    env:
      # a commit comment holding this line: the push's failure was told (Card sync's alert reads it too)
      FAILURE_TOLD: "<!-- discord-failure-told -->"
    steps:
      # A card the guards could not finish (its error is in the post and the comment) turns the run red.
      - name: Fail on card errors
        id: errors
        if: needs.check.outputs.checked == 'success'
        shell: bash
        env:
          ERRORS: ${{ needs.check.outputs.card_errors }}
        run: |
          if [ "${ERRORS:-0}" -gt 0 ]; then echo "::error::$ERRORS card(s) could not be checked: see the report"; exit 1; fi

      # A failed push run: one message, "Card guards failed on <login>'s push <sha8>: <failed steps> <run>", no ping, no
      # preview, unless the push's post went out whole and told it (a card error, a write that did not land) with the
      # checks job, post's Follow up and the tell job sound; or the failure marker is on the pushed commit already (an
      # earlier attempt, or Card sync, told it; unreadable comments: it posts anyway). Quiet too for a cancel by hand (no
      # cancelled job ran to its timeout, check 60 minutes, checks 40, post and tell 10, by the attempt's job list;
      # whoever cancelled it knows). The failed steps from that list (a timed-out one so marked; cards-venv named
      # Python environment, as in Card sync), else the jobs. Any job's failure counts: a step's failure() and
      # cancelled() see only this job, so the needed jobs' results are read too.
      # Then the marker: a commit comment ending in FAILURE_TOLD.
      - name: Tell Discord the run failed
        id: alert
        if: >-
          (failure() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) &&
          github.event_name == 'push' &&
          (needs.checks.result != 'success' || needs.post.result == 'failure' || needs.post.result == 'cancelled' ||
          needs.tell.outputs.told != 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK: ${{ secrets.DISCORD_STANDARDS_WEBHOOK }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: check=${{ needs.check.result }} checks=${{ needs.checks.result }} post=${{ needs.post.result }} tell=${{ needs.tell.result }}
          STARTED: ${{ needs.check.outputs.started }}
          OWN: ${{ steps.errors.outcome == 'failure' && 'Fail on card errors' || '' }}
        run: |
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/${GITHUB_RUN_ATTEMPT:-1}/jobs") || jobs=""
          if [[ " $RESULTS " == *"=cancelled "* ]]; then    # a job's timeout reads as cancelled too: it ran its whole time
            if [ -n "$jobs" ]; then
              timed_out=$(jq -r --argjson limit '{"check": 60, "checks": 40, "post": 10, "tell": 10}' \
                '[.jobs[] | select(.conclusion == "cancelled" and .started_at and .completed_at)
                  | select((.completed_at | fromdate) - (.started_at | fromdate) >= ($limit[.name] // 0) * 60 - 120)] | length' <<< "$jobs")
            else                                # no job list: the old rule, from the check's Start
              timed_out=$(( $(date +%s) - ${STARTED:-$(date +%s)} >= 3480 ))
            fi
            if [ "$timed_out" = 0 ]; then echo "Cancelled by hand: no message." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          fi
          if [ -z "$WEBHOOK" ]; then echo "::warning::DISCORD_STANDARDS_WEBHOOK is not set; no Discord message"; exit 0; fi
          read=""
          for wait in 0 10 30; do
            sleep "$wait"
            raw=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --paginate) || continue
            read=true
            if jq -s -e --arg mark "$FAILURE_TOLD" 'add // [] | any(.[]; .body // "" | contains($mark))' <<< "$raw" > /dev/null; then
              echo "This push's failure was told already: no message." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            break
          done
          [ -n "$read" ] || echo "::warning::the commit's comments could not be read: told, maybe twice"
          steps=""
          if [ -n "$jobs" ]; then
            steps=$(jq -r '[.jobs[] | select(.name != "finish" and (.conclusion == "failure" or .conclusion == "cancelled"))
                | (.steps // [])[] | select(.conclusion == "failure" or .conclusion == "cancelled")
                | (.name | sub("^Run \\./\\.github/actions/cards-(venv|python)$"; "Python environment"))
                  + (if .conclusion == "cancelled" then " (timed out)" else "" end)]
                | reduce .[] as $s ([]; if index([$s]) then . else . + [$s] end) | join(", ")' <<< "$jobs")
          fi
          if [ -n "$OWN" ]; then steps=${steps:+$steps, }$OWN; fi
          if [ -z "$steps" ]; then                # no job list: the jobs
            for pair in $RESULTS; do
              case ${pair#*=} in failure|cancelled) steps=${steps:+$steps, }"the ${pair%%=*} job";; esac
            done
          fi
          text="Card guards failed on ${GITHUB_ACTOR}'s push ${GITHUB_SHA:0:8}: ${steps:-a job} $RUN"
          if ! jq -n --arg text "$text" '{content: $text, allowed_mentions: {parse: []}, flags: 4}' \
              | curl -sS -o /dev/null -f -H "Content-Type: application/json" --data @- "$WEBHOOK"; then
            echo "::warning::the Discord webhook call failed"
            exit 0
          fi
          printf 'Failure told in Discord: %s\n%s\n' "$RUN" "$FAILURE_TOLD" > "$RUNNER_TEMP/failure-told.md"
          jq -n --rawfile body "$RUNNER_TEMP/failure-told.md" '{body: $body}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input - > /dev/null \
            || echo "::warning::the failure marker could not be left: Card sync may tell this push again"

  # A new wheel or font cache (its key changes with requirements-cards.txt, Python, MDW/Fonts): the older ones go (caches.yml)
  caches:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.saved == 'true' }}
    permissions:
      actions: write
    uses: ./.github/workflows/caches.yml
    with:
      prefixes: card-wheels- card-venv- card-fonts-
