# Bakes the website's PSD-kind card edits (site/Card Edits.json: stats, name, ability text) into the card PSDs and
# PNGs with the bot's edit pipeline (AutoCroissant commands/card_bake.py): one commit per run with every baked card's
# PSD and PNG and the rewritten edits file (at most 40 cards baked a run; the rest wait for the next), the report as the
# job summary. Every 30 minutes, live, when the gate finds a PSD-kind edit without a final verdict, baking only those
# (docs/EDIT_PIPELINE_DESIGN.md section 8); a dispatch always runs and re-checks every card. The first failed scheduled
# run of a streak tells Discord.
name: Card edits

on:
  schedule:
    - cron: "*/30 * * * *"   # live; a run with nothing pending ends at the gate
  workflow_dispatch:
    inputs:
      card:
        description: "Only this card (matched like Card Authors.txt); empty = every card with a PSD-kind edit"
        type: string
        default: ""
      dry_run:
        description: "Write the artifacts and the report, commit nothing"
        type: boolean
        default: true

permissions:
  contents: write     # the bake commits
  actions: write      # gh workflow run site.yml / tts-save.yml after a commit (a GITHUB_TOKEN push triggers no workflow)

# The schedule's own group: GitHub keeps one pending run per group, so sharing tts-save's would let the next tick replace
# a pending TTS save, and sharing it with dispatches would let a tick replace a pending dispatch (a --card or a dry run)
# unseen. A dispatch gets a group of its own and may overlap a scheduled bake: the commit holds only blobs still as baked
# from (a card baked by both is left out of the later commit as head-moved), and the edits file is re-read at the head.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'card-edits' || format('card-edits-{0}', github.run_id) }}
  cancel-in-progress: false   # a running bake is never cancelled; a newer pending tick replaces an older one

jobs:
  bake:
    if: github.actor != 'AutoCroissant'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The card folders (16 GB) are never checked out: PSDs, PNGs and the status chart come by blob sha through
      # the API. The checkout brings the edits file and TTS/ (small) and every tree, so the fonts' tree sha is known.
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site/Card Edits.json
            /TTS/

      # The pipeline and its import closure (no config.py: github_api reads it in a try/except, the token comes
      # from the environment). Never psd_analyzer (discord, pandas). tests/test_card_bake.py runs --help on exactly this list.
      - uses: actions/checkout@v7
        with:
          repository: bobberlington/AutoCroissant
          path: bot
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /commands/card_bake.py
            /commands/psd_edit.py
            /commands/psd_regions.py
            /commands/psd_parser.py
            /commands/card_models.py
            /commands/card_edits.py
            /commands/github_api.py
            /commands/git_commit.py
            /commands/repo_history.py
            /global_config.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"     # no `cache: pip`: it needs a requirements file, and neither sparse checkout has one

      # The fork pin: cards + feat/text-engine merged, save(update_preview=), tagged by step S0 of the design.
      # The tag exists since S0 (2026-10-21, cards a6363a04). Plan step 7 drops the pin once upstream has the changes.
      - timeout-minutes: 10     # a step's timeout fails the run (Discord is told); the job's cancels it
        run: pip install -q requests "psd-tools[composite,text] @ git+https://github.com/MichaelJSr/psd-tools@cards-20261023d"

      # Schedule only: go when a PSD-kind edit has no refused verdict for its values on the current PSD
      # (card_bake.pending). A dispatch always goes.
      - name: Gate
        id: gate
        timeout-minutes: 10
        working-directory: bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python -c 'import sys; from commands.card_bake import pending; print(*pending(*sys.argv[1:]), sep="\n")' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/pending.txt"
          n=$(grep -c . "$RUNNER_TEMP/pending.txt" || true)
          names=$(grep . "$RUNNER_TEMP/pending.txt" | paste -sd, - | sed 's/,/, /g' || true)
          echo "Pending PSD edits at \`${GITHUB_SHA:0:8}\`: $n${names:+ ($names)}." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "go=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Fonts: MDW/Fonts' top level (272 files, 215 MB on 2026-10-20; stoogedings-src/ is another 200 MB and stays
      # out), cached by the folder's tree sha; the sparse checkout fetches them only on a miss.
      - id: fonts
        if: steps.gate.outputs.go == 'true'
        run: echo "sha=$(git rev-parse HEAD:MDW/Fonts)" >> "$GITHUB_OUTPUT"

      - id: font-cache
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache@v6
        with:
          path: MDW/Fonts
          key: card-fonts-${{ steps.fonts.outputs.sha }}

      - if: steps.gate.outputs.go == 'true' && steps.font-cache.outputs.cache-hit != 'true'
        run: git sparse-checkout add '/MDW/Fonts/*' '!/MDW/Fonts/stoogedings-src/'

      # The work dir is $RUNNER_TEMP/card-bake (edited PSD, merged PNG, before/after/diff crops, the rewritten file).
      # The schedule bakes live and only the gate's cards (--pending: a refused card stays refused, no time spent);
      # a dispatch follows dry_run and re-checks every card. BUDGET (40 min) is the script's; the timeout is the backstop.
      - name: Bake
        if: steps.gate.outputs.go == 'true'
        timeout-minutes: 50
        working-directory: bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSD_TOOLS_FONT_DIRS: ${{ github.workspace }}/MDW/Fonts
          CARD: ${{ inputs.card }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --head "$GITHUB_SHA")
          [ "$EVENT" = schedule ] && args+=(--pending)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$CARD" ] && args+=(--card "$CARD")
          python -m commands.card_bake "${args[@]}" | tee "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.go == 'true'     # the report and crops, even when the Bake step failed
        with:
          name: card-bake
          path: ${{ runner.temp }}/card-bake
          if-no-files-found: ignore

      # Only after the run's commit (its cards' "committed `sha`" lines), even when the Bake step failed on a card's error:
      # a GITHUB_TOKEN push triggers no workflow, so the site build and the TTS save are run here.
      - if: ${{ !cancelled() && steps.gate.outputs.go == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -q 'committed `' "$RUNNER_TEMP/report.md" || exit 0
          gh workflow run site.yml && gh workflow run tts-save.yml

      # A failed scheduled run (the commit failed, a card errored, a step broke or timed out, the job was cancelled at its
      # 60 minutes) would otherwise repeat unseen every 30 minutes: one Discord message with the run's link, for the
      # first failure of a streak only (the last finished scheduled run, not counting cancelled or skipped ones, failed:
      # it was told then). Concurrency cancels only pending runs, which start no step. The URL is never printed; a
      # failed call only warns.
      - name: Tell Discord
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::DISCORD_CHANGELOG_WEBHOOK is not set; no Discord message"; exit 0; fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow card-edits.yml --event schedule --status completed \
            --limit 20 --json databaseId,conclusion \
            --jq "map(select(.databaseId != $GITHUB_RUN_ID and .conclusion != \"cancelled\" and .conclusion != \"skipped\"))[0].conclusion // \"\"") \
            || last=""
          if [ "$last" = failure ] || [ "$last" = timed_out ]; then
            echo "The last scheduled run failed too: Discord was told then." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          jq -n --arg run "$RUN" '{content: ("Card edits: the scheduled bake failed (the next failures stay quiet until a run succeeds). " + $run), allowed_mentions: {parse: []}}' \
            | curl -sS -o /dev/null -f -H "Content-Type: application/json" --data @- "$WEBHOOK" \
            || echo "::warning::the Discord webhook call failed"
