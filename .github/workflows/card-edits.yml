# Bakes the website's PSD-kind card edits (site/Card Edits.json: stats, name, ability text) into the card PSDs and
# PNGs with the bot's edit pipeline (AutoCroissant commands/card_bake.py), one commit per card, the report as the job
# summary. Dispatch only for now: Thunderfury's entry is aligned to the print (1c13eaa; docs/EDIT_PIPELINE_DESIGN.md
# section 14, question 7), so the push trigger on site/Card Edits.json waits only for the PSD-edits hold to lift.
name: Card edits

on:
  workflow_dispatch:
    inputs:
      card:
        description: "Only this card (matched like Card Authors.txt); empty = every card with a PSD-kind edit"
        type: string
        default: ""
      dry_run:
        description: "Write the artifacts and the report, commit nothing"
        type: boolean
        default: true

permissions:
  contents: write     # the bake commits
  actions: write      # gh workflow run site.yml / tts-save.yml after a commit (a GITHUB_TOKEN push triggers no workflow)

concurrency:
  group: tts-save     # shared with tts-save.yml: both commit to main, never two at once
  cancel-in-progress: false

jobs:
  bake:
    if: github.actor != 'AutoCroissant'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The card folders (16 GB) are never checked out: PSDs, PNGs and the status chart come by blob sha through
      # the API. The checkout brings the edits file and TTS/ (small) and every tree, so the fonts' tree sha is known.
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site/Card Edits.json
            /TTS/

      # The pipeline and its import closure (no config.py: github_api reads it in a try/except, the token comes
      # from the environment). Never psd_analyzer (discord, pandas). tests/test_card_bake.py runs --help on exactly this list.
      - uses: actions/checkout@v7
        with:
          repository: bobberlington/AutoCroissant
          path: bot
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /commands/card_bake.py
            /commands/psd_edit.py
            /commands/psd_regions.py
            /commands/psd_parser.py
            /commands/card_models.py
            /commands/card_edits.py
            /commands/github_api.py
            /commands/git_commit.py
            /commands/repo_history.py
            /global_config.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"     # no `cache: pip`: it needs a requirements file, and neither sparse checkout has one

      # The fork pin: cards + feat/text-engine merged, save(update_preview=), tagged by step S0 of the design.
      # The tag exists since S0 (2026-10-21, cards a6363a04). Plan step 7 drops the pin once upstream has the changes.
      - run: pip install -q requests "psd-tools[composite,text] @ git+https://github.com/MichaelJSr/psd-tools@cards-20261021"

      # Fonts: MDW/Fonts' top level (272 files, 215 MB on 2026-10-20; stoogedings-src/ is another 200 MB and stays
      # out), cached by the folder's tree sha; the sparse checkout fetches them only on a miss.
      - id: fonts
        run: echo "sha=$(git rev-parse HEAD:MDW/Fonts)" >> "$GITHUB_OUTPUT"

      - id: font-cache
        uses: actions/cache@v6
        with:
          path: MDW/Fonts
          key: card-fonts-${{ steps.fonts.outputs.sha }}

      - if: steps.font-cache.outputs.cache-hit != 'true'
        run: git sparse-checkout add '/MDW/Fonts/*' '!/MDW/Fonts/stoogedings-src/'

      # The work dir is $RUNNER_TEMP/card-bake (edited PSD, merged PNG, before/after/diff crops, the rewritten file).
      - name: Bake
        working-directory: bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSD_TOOLS_FONT_DIRS: ${{ github.workspace }}/MDW/Fonts
          CARD: ${{ inputs.card }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --head "$GITHUB_SHA")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$CARD" ] && args+=(--card "$CARD")
          python -m commands.card_bake "${args[@]}" | tee "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()        # the report and crops of the cards that did land, even when the Bake step failed
        with:
          name: card-bake
          path: ${{ runner.temp }}/card-bake
          if-no-files-found: ignore

      # Only after a commit (a card's "committed `sha`" line or "Refused verdicts committed `sha`"): a GITHUB_TOKEN push
      # triggers no workflow, so the site build and the TTS save are run here.
      - if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -q 'committed `' "$RUNNER_TEMP/report.md" || exit 0
          gh workflow run site.yml && gh workflow run tts-save.yml
