# Builds the card browser (site/) and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Card browser

on:
  push:
    branches: [main]
    paths-ignore:
      - "TTS/**"             # the bot's TTS save commits don't rebuild the site
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours: picks up the bot's latest /update_stats data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cut a deployment off halfway; the newest queued run follows it

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45       # the first run downloads every card PNG (~1.6 GB); later runs reuse cached images
    steps:
      # The repo history is ~25 GB of PSDs, so check out only what the build reads (site/ also holds the hand-kept
      # Card Authors.txt, Card Edits.json, Website Admins.txt and Constructed Ban List.txt); card PNGs are
      # downloaded on demand and their resized images cached between runs. fetch-depth 0 + blob:none brings every
      # commit and tree (about 25 MB, no file contents) for the image-version history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site/
            /Types/
            /MDW/Fonts/stoogedings-src/stoogedings.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/build/requirements.txt

      - run: pip install -r site/build/requirements.txt

      - id: pages
        uses: actions/configure-pages@v6

      # Cache key = the card PNG blobs + the build script (image sizes live there): the cache is only re-saved when
      # a card image or the image settings change, and the newest older cache is restored as a starting point.
      - id: images
        run: echo "key=$(git ls-tree -r HEAD | grep -i '\.png$' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Keep `path` exactly site/.cache: actions/cache only restores (restore-keys too) caches saved with the same path list.
      - uses: actions/cache@v6
        with:
          path: site/.cache
          key: card-images-v2-${{ hashFiles('site/build/build_site.py') }}-${{ steps.images.outputs.key }}
          restore-keys: card-images-v2-

      # Deck preview montages: their own cache in site/.og-cache. The newest one is restored, and it is saved after the build
      # under the names of the montages in use (each a hash of its pictured images), so a montage that changes for any reason
      # (a deck, a card's stars or name in the bot's data or Card Edits.json, an image) is saved once, not redrawn each run.
      - id: og-restore
        uses: actions/cache/restore@v6
        with:
          path: site/.og-cache
          key: deck-previews-v2-${{ github.sha }}
          restore-keys: deck-previews-v2-

      - run: python site/build/build_site.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - id: og
        run: |
          if [ -n "$(ls -A site/.og-cache 2>/dev/null)" ]; then
            echo "key=deck-previews-v2-$(ls site/.og-cache | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.og.outputs.key != '' && steps.og.outputs.key != steps.og-restore.outputs.cache-matched-key
        uses: actions/cache/save@v6
        continue-on-error: true    # a failed save never stops the deploy
        with:
          path: site/.og-cache
          key: ${{ steps.og.outputs.key }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
