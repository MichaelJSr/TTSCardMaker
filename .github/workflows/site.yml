# Builds the card browser (site/) and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Card browser

on:
  push:
    branches: [main]
    paths:                   # only what the build reads (checked out below, or read through git: tree, log)
      - "site/**"
      - "Types/**"
      - ".mailmap"
      - "MDW/Fonts/*"
      - "MDW/Fonts/stoogedings-src/stoogedings.json"
      - "MDW/Fonts/stoogedings-src/build_stoogedings.py"
      - "MDW/Fonts/stoogedings-src/requirements.txt"
      - "MDW/Card Edits.json"
      - "MDW/Card Authors.txt"
      - "**.png"
      - "**.PNG"
      - "**.psd"
      - "**.PSD"
      - ".github/workflows/site.yml"
      - "!TTS/**"            # the bot's TTS save commits don't rebuild the site
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, a fallback: the bot dispatches a build after its pickle push
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cut a deployment off halfway; the newest queued run follows it

env:
  CARD_DATA: "off"   # the cutover (AutoCroissant DATA_BUILD_ACTION.md step 8) turns it on: the card data from the card sync's
                     # branch data (db/) instead of AutoCroissant's pickles; off, or no data branch: the pickles (the rollback)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45       # the first run downloads every card PNG (~1.6 GB); later runs reuse cached images
    outputs:
      deploy: ${{ steps.changed.outputs.deploy }}
    steps:
      # The repo history is ~25 GB of PSDs, so check out only what the build reads (site/ also holds the hand-kept
      # Card Authors.txt, Card Edits.json, Website Admins.txt and Constructed Ban List.txt); card PNGs are
      # downloaded on demand and their resized images cached between runs. fetch-depth 0 + blob:none brings every
      # commit and tree (about 25 MB, no file contents) for the image-version history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.mailmap
            /site/
            /Types/
            /MDW/Fonts/stoogedings-src/stoogedings.json
            /MDW/Fonts/stoogedings-src/build_stoogedings.py
            /MDW/Fonts/stoogedings-src/requirements.txt

      # build_stoogedings.py and its packages (site/build/requirements.txt includes them) draw the token variants' pictures
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            site/build/requirements.txt
            MDW/Fonts/stoogedings-src/requirements.txt

      - run: pip install -r site/build/requirements.txt

      - id: pages
        uses: actions/configure-pages@v6

      # Cache key = the card PNG blobs + the build scripts (image settings live there; the font build's draws the token
      # variants' pictures): the cache is only re-saved when a card image or the build changes, and the newest older cache
      # is restored as a starting point. The thumbs' names carry their settings (build_site.py thumb_tag), so a restored
      # cache made with other settings re-encodes those widths.
      - id: images
        run: echo "key=$(git ls-tree -r HEAD | grep -i '\.png$' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Keep `path` exactly site/.cache: actions/cache only restores (restore-keys too) caches saved with the same path list.
      - uses: actions/cache@v6
        with:
          path: site/.cache
          key: card-images-v2-${{ hashFiles('site/build/build_site.py', 'MDW/Fonts/stoogedings-src/build_stoogedings.py') }}-${{ steps.images.outputs.key }}
          restore-keys: card-images-v2-

      # The restored cache's file names, for the failure save at the end: a build that failed before making any image saves nothing.
      - id: cache-before
        run: echo "names=$(ls -R site/.cache 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Deck preview montages: their own cache in site/.og-cache. The newest one is restored, and it is saved after the build
      # whenever the montages in use (each named by a hash of its pictured images) differ from the restored ones, so a montage
      # that changes for any reason (a deck, a card's stars or name in the bot's data or Card Edits.json, an image) is saved
      # once, not redrawn each run. The run id in the key makes each save the newest entry, even when the set of montages
      # returns to one saved before (an existing key can't be saved over, and restore would keep taking a newer, wrong one).
      - id: og-restore
        uses: actions/cache/restore@v6
        with:
          path: site/.og-cache
          key: deck-previews-v2-${{ github.sha }}
          restore-keys: deck-previews-v2-

      - id: og-before
        run: echo "names=$(ls site/.og-cache 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Data branch
        id: data
        if: env.CARD_DATA == 'on'
        run: |
          if git ls-remote --exit-code origin refs/heads/data > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No data branch: the card data comes from AutoCroissant's pickles"
          fi

      - uses: actions/checkout@v7
        if: steps.data.outputs.exists == 'true'
        with:
          ref: data
          path: carddata
          fetch-depth: 1

      # IMAGE_BUDGET: images not made in 30 minutes (a full AVIF re-encode is ~11 CPU-minutes on a Mac, an estimated 20-25
      # on the runner) are left for the next run; the build then fails (nothing deployed) and the job's last step keeps what
      # it made. The step's timeout leaves that save time to run before the job's.
      - id: build
        timeout-minutes: 38
        run: python site/build/build_site.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          CARD_DATA_DIR: ${{ steps.data.outputs.exists == 'true' && 'carddata/db' || '' }}
          IMAGE_BUDGET: "1800"

      - id: og
        run: |
          if [ -n "$(ls -A site/.og-cache 2>/dev/null)" ]; then
            echo "names=$(ls site/.og-cache | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.og.outputs.names != '' && steps.og.outputs.names != steps.og-before.outputs.names
        uses: actions/cache/save@v6
        continue-on-error: true    # a failed save never stops the deploy
        with:
          path: site/.og-cache
          key: deck-previews-v2-${{ steps.og.outputs.names }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Pages dates every file by its deploy (the ETag too), so each deploy makes returning browsers download the whole
      # site again: deploy only a site that differs from the live one. build.txt is a digest of the whole site without the
      # build's clock; a schedule tick or a dispatch that rebuilt the same site stops here. No live digest: deploy.
      - id: changed
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          live=$(curl -fsSL --max-time 30 "$SITE_URL/build.txt?run=$GITHUB_RUN_ID" || true)
          if [ -n "$live" ] && [ "$live" = "$(cat site/dist/build.txt)" ]; then
            echo "The live site is this build ($live): nothing to deploy" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.changed.outputs.deploy == 'true'
        with:
          path: site/dist

      # actions/cache saves only after a job that passed: a job that failed once the build ran (out of image time, failed
      # downloads, an error, the step's timeout, or a step after it) saves its images here, under a key of its own that
      # restore-keys finds, so the next run (the 6-hourly one, or run it by hand) carries on from them. Only when the cache
      # changed: a build that stopped before the images (no bot data, a truncated site) adds no copy. Keep these last.
      - id: cache-after
        if: failure() && (steps.build.outcome == 'failure' || steps.build.outcome == 'success')
        run: echo "names=$(ls -R site/.cache 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - if: failure() && steps.cache-after.outputs.names != '' && steps.cache-after.outputs.names != steps.cache-before.outputs.names
        uses: actions/cache/save@v6
        with:
          path: site/.cache
          key: card-images-v2-${{ hashFiles('site/build/build_site.py', 'MDW/Fonts/stoogedings-src/build_stoogedings.py') }}-${{ steps.images.outputs.key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
