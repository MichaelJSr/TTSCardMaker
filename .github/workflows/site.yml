# Builds the card browser (site/) and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Card browser
# A Card sync data job's early build (inputs after, job) carries its run id, for Card sync's Site build to find it
run-name: ${{ inputs.after && format('Card browser (after {0} {1})', inputs.after, inputs.job) || '' }}

on:
  push:
    branches: [main]
    # Site code and site-only files. Card inputs (PSDs, PNGs, Types/, the fonts, stoogedings.json and the card files in
    # site/) start Card sync, whose data job dispatches this build (it waits for the data commit): none on the old data.
    paths:
      - "site/**"
      - "!site/Card Edits.json"
      - "!site/Card Authors.txt"
      - "!site/Card Creation Dates.json"
      - "!site/**.md"
      - "site/rulebook/**"           # the rulebook's chapters are .md too (after the exclusion: it wins)
      - ".mailmap"
      - "MDW/Fonts/stoogedings-src/build_stoogedings.py"
      - "MDW/Fonts/stoogedings-src/requirements.txt"
      - ".github/workflows/site.yml"
  schedule:
    - cron: "0 12 * * *"     # daily fallback: Card sync dispatches a build after each data commit
  workflow_dispatch:
    inputs:
      after:
        description: "Set by Card sync at a data job's start: its run id (the build sets up, then waits for that job's Commit data)"
        type: string
        default: ""
      job:
        description: "Set by Card sync: that job, data or after"
        type: string
        default: ""

permissions:         # each job its own (below)
  contents: read

env:
  SITE_URL: https://michaeljsr.github.io/TTSCardMaker   # Pages' base_url, as card-sync.yml's

jobs:
  # The deploy's versions (deploy.sh below): two commits on no branch, the run's commit their parent and its tree theirs,
  # one a try. The one job that writes the repo, beside the build (which runs uv's and npm's packages: read-only); its
  # hand-over an artifact the build fetches in the background (empty when the calls failed). Never fails the run.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write     # git/commits
    steps:
      - name: Versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |   # 3 tries a call (a brief API error); a failed one's output (gh prints the error body) dropped
          api=repos/$GITHUB_REPOSITORY/git/commits
          call() { for wait in 0 2 5; do sleep "$wait"; out=$(timeout 20 gh api "$@") && { printf '%s\n' "$out"; return; }; done; return 1; }
          : > "$RUNNER_TEMP/versions.txt"
          tree=$(call "$api/$GITHUB_SHA" --jq .tree.sha)
          for try in 1 2; do
            call -X POST "$api" -f message="Pages deploy: run $GITHUB_RUN_ID, try $try" -f tree="$tree" -f "parents[]=$GITHUB_SHA" --jq .sha
          done > "$RUNNER_TEMP/versions.txt"
          cat "$RUNNER_TEMP/versions.txt"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-versions-${{ github.run_attempt }}
          path: ${{ runner.temp }}/versions.txt
          retention-days: 1
          if-no-files-found: error

  # A running build is never cut off: it finishes and deploys (in this job, as GitHub's static.yml). One run waits, the
  # newest (a newer one replaces it), and reads the data branch when it starts (an early build: after its Data wait).
  # Deploys go one at a time, in order.
  build:
    concurrency:
      group: pages-build
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read       # Data wait: Card sync's jobs; the version job's hand-over; a waiting build (deployment)
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url || steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    # the first run downloads every card PNG (~1.6 GB); three stuck deploys add ~19 min; an early build's Data wait 25
    timeout-minutes: ${{ inputs.after && 92 || 67 }}
    outputs:
      saved: ${{ steps.cache.outputs.cache-hit != 'true' || steps.og-save.outcome == 'success' || steps.partial.outcome == 'success' }}
    steps:
      # The repo history is ~25 GB of PSDs, so check out only what the build reads (site/ also holds the hand-kept
      # Card Authors.txt, Card Edits.json, Website Admins.txt and Constructed Ban List.txt); card PNGs and uncached
      # icons (Types/) are downloaded on demand and their resized images cached between runs. Depth 1, blob:none; main's every
      # commit and tree (no file contents) for the image-version history come in the background (History start).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.mailmap
            /site/
            /MDW/Fonts/stoogedings-src/stoogedings.json
            /MDW/Fonts/stoogedings-src/build_stoogedings.py
            /MDW/Fonts/stoogedings-src/requirements.txt

      # Exit code in history.code; no git fetch here before History wait
      - name: History start
        run: |
          ( code=0; git -c protocol.version=2 fetch -q --unshallow --no-tags --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main \
            || code=$?; echo "$code" > "$RUNNER_TEMP/history.code" ) > "$RUNNER_TEMP/history.log" 2>&1 < /dev/null &

      # build_stoogedings.py and its packages (site/build/requirements.txt includes them) draw the token variants' pictures.
      # Python: the image's newest 3.14.x (setup-python's pick from the tool cache, as card-preview's venv); setup-python
      # only when the cache has none.
      - id: py
        run: |
          py=$(printf '%s\n' "$RUNNER_TOOL_CACHE"/Python/3.14.*/x64 | grep -E '/3\.14\.[0-9]+/x64$' | sort -V | tail -1) || true
          if [ -n "$py" ] && [ -x "$py/bin/python" ]; then
            echo "$py/bin" >> "$GITHUB_PATH"
            echo "LD_LIBRARY_PATH=$py/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"   # as setup-python sets it
            echo "python=$py/bin/python" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.py.outputs.python == ''
        uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14"

      # The packages (uv), esbuild, the PSD sizes and the data branch, in the background while the steps up to Setup wait
      # run (each one's output and exit code in $RUNNER_TEMP/setup).
      # uv, no cache: ~2 s from PyPI where pip took 5-7 s after a 155 MB pip cache restore. uv itself: setup-uv's download,
      # its sha256 pinned, else the GitHub release; neither: pip.
      # esbuild bundles the JS (app.js and the chunks loaded on first use) with source maps and minifies the CSS
      # (build_site.py bundle, minify); node checks index.html's first screen against grid.js (first_screen). Exact
      # version: same source, same bytes.
      # The PSDs' sizes (the PSD size sort): one trees API call, since the blobless clone has no blob sizes.
      # The deploy's versions: the version job's hand-over, 3 minutes at most (the deploy waits for it, Setup wait not);
      # none when that job did not run in this attempt.
      # The data branch (Card sync's, db/) in carddata, after the checkout above (it empties the workspace): the token in a
      # header, and in carddata's config as actions/checkout keeps it (Data wait fetches there), as Card sync's clone.
      - name: Setup start
        env:
          UV_PYTHON: ${{ steps.py.outputs.python || steps.python.outputs.python-path }}
          UV_COMPILE_BYTECODE: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          bg=$RUNNER_TEMP/setup
          mkdir -p "$bg"
          start() {
            n=$1; shift
            ( code=0; "$@" || code=$?; echo "$code" > "$bg/$n.code" ) > "$bg/$n.log" 2>&1 < /dev/null &
          }
          packages() {
            v=0.13.5 sha=f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f name=uv-x86_64-unknown-linux-gnu
            for url in "https://releases.astral.sh/github/uv/releases/download/$v/$name.tar.gz" \
                "https://github.com/astral-sh/uv/releases/download/$v/$name.tar.gz"; do
              if curl -fsSL --retry 2 --retry-all-errors --retry-delay 1 --connect-timeout 5 --max-time 20 -o "$RUNNER_TEMP/uv.tar.gz" "$url" \
                  && echo "$sha  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c --quiet \
                  && mkdir -p "$RUNNER_TEMP/uv" && tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP/uv" --strip-components 1 "$name/uv"; then
                "$RUNNER_TEMP/uv/uv" pip install -q -r site/build/requirements.txt
                return
              fi
            done
            echo "::warning::uv not fetched: pip installs the packages"
            "$UV_PYTHON" -m pip install -q -r site/build/requirements.txt
          }
          sizes() {
            for _ in 1 2 3; do
              gh api "repos/$GITHUB_REPOSITORY/git/trees/$1?recursive=1" > "$RUNNER_TEMP/tree.json" && return 0
              sleep 10
            done
            return 1
          }
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          creds=$RUNNER_TEMP/carddata-credentials.config
          git config --file "$creds" "http.$GITHUB_SERVER_URL/.extraheader" "AUTHORIZATION: basic $auth"
          versions() {
            end=$(( SECONDS + 180 ))
            at=$(timeout 20 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest" \
              --jq '.jobs[] | select(.name == "version") | .run_attempt') || at=
            if [ -n "$at" ] && [ "$at" != "$GITHUB_RUN_ATTEMPT" ]; then     # Re-run failed jobs: the build alone
              echo "the version job did not run in attempt $GITHUB_RUN_ATTEMPT"
              return 1
            fi
            for _ in $(seq 60); do
              [ "$SECONDS" -lt "$end" ] || break
              sleep 3
              id=$(timeout 20 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=pages-versions-$GITHUB_RUN_ATTEMPT" \
                --jq '.artifacts[0].id // empty') || id=
              [ -n "$id" ] && timeout 20 gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/versions.zip" \
                && unzip -p "$RUNNER_TEMP/versions.zip" versions.txt > "$RUNNER_TEMP/versions.txt" && return
            done
            return 1
          }
          data() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              timeout 30 git clone -q --depth 1 --no-tags --single-branch --branch data "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" carddata \
              && git -C carddata config include.path "$creds"
          }
          start uv packages
          start npm npm install --prefix "$RUNNER_TEMP/esbuild" --no-save --no-audit --no-fund esbuild@0.28.2
          start sizes sizes "$(git rev-parse HEAD)"
          start data data
          start versions versions

      # Cache key = the card PNG and MDW/Fonts blobs + the build scripts (image settings live there; the font build's draws
      # the token variants' pictures) + the build's pins (the WOFF2 fonts' names carry fontTools' and brotli's versions): the
      # cache is only re-saved when a card image, a font or the build changes, and the newest older cache is restored as a
      # starting point. The thumbs' names carry their settings (build_site.py thumb_tag), so a restored
      # cache made with other settings re-encodes those widths.
      - id: images
        run: echo "key=$(git ls-tree -r HEAD | grep -iE '\.png$|[[:space:]]MDW/Fonts/[^/]+\.(ttf|otf)$' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Keep `path` exactly site/.cache: actions/cache only restores (restore-keys too) caches saved with the same path list.
      - id: cache
        uses: actions/cache@v6
        with:
          path: site/.cache
          key: card-images-v2-${{ hashFiles('site/build/build_site.py', 'site/build/requirements.txt', 'MDW/Fonts/stoogedings-src/build_stoogedings.py') }}-${{ steps.images.outputs.key }}
          restore-keys: card-images-v2-

      # The restored cache's file names, for the failure save at the end: a build that failed before making any image saves nothing.
      - id: cache-before
        run: echo "names=$(find site/.cache 2>/dev/null | LC_ALL=C sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # An early build's images: the card PNGs the restored cache lacks (the push's pictures), made in the background once
      # Setup start's packages are in, while Data wait runs (build_site.py early_images). Setup wait stops it (none started
      # after) and prints its log; the build makes the rest, and those of a newer main.
      - name: Images start
        if: inputs.after
        run: |
          bg=$RUNNER_TEMP/setup
          at=$(git rev-parse HEAD)
          : > "$bg/images.log"
          (
            code=0
            until [ -s "$bg/uv.code" ]; do sleep 0.1; done
            if [ "$(cat "$bg/uv.code")" != 0 ]; then code=uv
            elif [ ! -e "$bg/images.stop" ]; then python site/build/build_site.py --images "$at" "$bg/images.stop" || code=$?
            fi
            echo "$code" > "$bg/images.code"
          ) >> "$bg/images.log" 2>&1 < /dev/null &

      # Deck preview montages: their own cache in site/.og-cache. The newest one is restored, and it is saved after the build
      # whenever the montages in use (each named by a hash of its pictured images) differ from the restored ones, so a montage
      # that changes for any reason (a deck, a card's stars or name in the bot's data or Card Edits.json, an image) is saved
      # once, not redrawn each run. The run id in the key makes each save the newest entry, even when the set of montages
      # returns to one saved before (an existing key can't be saved over, and restore would keep taking a newer, wrong one).
      - id: og-restore
        uses: actions/cache/restore@v6
        with:
          path: site/.og-cache
          key: deck-previews-v2-${{ github.sha }}
          restore-keys: deck-previews-v2-

      # History start's fetch done (before Data wait's fetch and the build's history); failed or still shallow: once more,
      # else the job fails (never a shallow build)
      - name: History wait
        timeout-minutes: 5
        run: |
          until [ -s "$RUNNER_TEMP/history.code" ]; do sleep 0.1; done
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "::group::History start (exit $(cat "$RUNNER_TEMP/history.code"))"; cat "$RUNNER_TEMP/history.log"; echo "::endgroup::"
            echo "::warning::main's history not fetched in the background: once more"
            git -c protocol.version=2 fetch -q --unshallow --no-tags --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main
            [ "$(git rev-parse --is-shallow-repository)" = false ] || { echo "::error::main's history is still shallow"; exit 1; }
          fi

      - id: og-before
        run: echo "names=$(ls site/.og-cache 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # A Card sync data job's early build (dispatched at its start): set up above while that job builds, it waits here
      # until the job's Commit data is done or the job ended: 3 s looks for 2 minutes, then 15 s; 20 minutes at most (past
      # that, Card sync's Site build dispatches another). Then main's head again, as Card sync's Newest; when that moved
      # a PSD, the PSD sizes again (Setup wait waits for them). The data's head beside main's (Card checks' lines; 3 tries,
      # ~3.5 min at most: 25 minutes for the step; the clone or those failed: checked out after Setup wait).
      - name: Data wait
        if: inputs.after
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.after }}
          JOB: ${{ inputs.job == 'after' && 'Card data after the bake' || 'Card data' }}   # card-sync.yml's job names
          COMMIT: Commit data                                                               # and its step
        run: |
          while [ "$SECONDS" -lt 1200 ]; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs" --jq "[.jobs[] | select(.name == \"$JOB\" and (.status == \"completed\"
              or any(.steps[]?; .name == \"$COMMIT\" and .status == \"completed\")))] | length") || n=0
            [ "${n:-0}" -gt 0 ] && break
            sleep "$([ "$SECONDS" -lt 120 ] && echo 3 || echo 15)"
          done
          if [ "$SECONDS" -ge 1200 ]; then echo "::warning::$JOB of run $RUN not past $COMMIT in 20 minutes: this build goes on"; fi
          echo "$JOB of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN past $COMMIT (or ended) after $SECONDS s." | tee -a "$GITHUB_STEP_SUMMARY"
          bg=$RUNNER_TEMP/setup
          until [ -s "$bg/data.code" ]; do sleep 0.1; done
          refetch() {   # 3 tries, 10 and 15 s apart (actions/checkout's)
            for try in 1 2 3; do
              timeout 60 git -C carddata fetch -q --depth 1 origin data && return
              [ "$try" = 3 ] || sleep $(( try * 5 + 5 ))
            done
            return 1
          }
          data=
          [ "$(cat "$bg/data.code")" != 0 ] || { refetch & data=$!; }
          was=$(git rev-parse HEAD)
          if git fetch -q --filter=blob:none origin main; then git reset -q --hard FETCH_HEAD; else echo "::warning::main not fetched again"; fi
          if [ -n "$data" ] && ! { wait "$data" && git -C carddata reset -q --hard FETCH_HEAD; }; then
            echo "::warning::data not fetched again (3 tries): checked out"
            rm -rf carddata
            echo 1 > "$bg/data.code"
          fi
          head=$(git rev-parse HEAD)
          if [ "$head" != "$was" ] && [ -n "$(GIT_NO_LAZY_FETCH=1 git diff --no-renames --name-only "$was" "$head" -- ':(icase)*.psd')" ]; then
            until [ -s "$bg/sizes.code" ]; do sleep 0.1; done
            old=$(cat "$bg/sizes.code")
            rm "$bg/sizes.code"
            (                                   # Setup start's: on failure, the older sizes and code stay
              code=$old
              if gh api "repos/$GITHUB_REPOSITORY/git/trees/$head?recursive=1" > "$RUNNER_TEMP/tree.new"; then
                mv "$RUNNER_TEMP/tree.new" "$RUNNER_TEMP/tree.json" && code=0
              else
                echo "::warning::PSD sizes at ${head:0:8} not read: those at ${was:0:8}"
              fi
              echo "$code" > "$bg/sizes.code"
            ) >> "$bg/sizes.log" 2>&1 < /dev/null &
          fi

      # Setup start's four: uv or npm failing fails the job; the PSD sizes failing only leaves them out (a warning); the
      # data clone failing: checked out below. Images start's: stopped first, a failure only warns.
      - name: Setup wait
        id: setup
        timeout-minutes: 10
        run: |
          bg=$RUNNER_TEMP/setup
          [ ! -e "$bg/images.log" ] || touch "$bg/images.stop"
          failed=
          for n in uv npm sizes data; do
            until [ -s "$bg/$n.code" ]; do sleep 0.1; done
            code=$(cat "$bg/$n.code")
            echo "::group::$n (exit $code)"; cat "$bg/$n.log"; echo "::endgroup::"
            [ "$code" = 0 ] || [ "$n" = sizes ] || [ "$n" = data ] || failed="$failed $n"
          done
          [ "$(cat "$bg/sizes.code")" = 0 ] || echo "::warning::PSD sizes failed: the site leaves them out"
          if [ "$(cat "$bg/data.code")" = 0 ]; then echo "data=true" >> "$GITHUB_OUTPUT"; else echo "::warning::the data clone failed: checked out"; fi
          if [ -e "$bg/images.log" ]; then
            until [ -s "$bg/images.code" ]; do sleep 0.1; done
            code=$(cat "$bg/images.code")
            echo "::group::images (exit $code)"; cat "$bg/images.log"; echo "::endgroup::"
            [ "$code" = 0 ] || echo "::warning::early images failed: the build makes them"
          fi
          [ -z "$failed" ] || { echo "::error::failed:$failed"; exit 1; }

      # The card data (Card sync's branch data, db/) when Setup start's clone failed
      - if: steps.setup.outputs.data != 'true'
        uses: actions/checkout@v7
        with:
          ref: data
          path: carddata
          fetch-depth: 1

      # IMAGE_BUDGET: images not made in 30 minutes (a full AVIF re-encode is ~11 CPU-minutes on a Mac, an estimated 20-25
      # on the runner) are left for the next run; the build then fails (nothing deployed) and the job's last step keeps what
      # it made. The step's timeout leaves that save time to run before the job's.
      - id: build
        timeout-minutes: 38
        run: python site/build/build_site.py
        env:
          CARD_DATA_DIR: carddata/db
          PSD_TREE: ${{ runner.temp }}/tree.json
          IMAGE_BUDGET: "1800"
          ESBUILD: ${{ runner.temp }}/esbuild/node_modules/.bin/esbuild

      - id: og
        run: |
          if [ -n "$(ls -A site/.og-cache 2>/dev/null)" ]; then
            echo "names=$(ls site/.og-cache | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi

      - id: og-save
        if: steps.og.outputs.names != '' && steps.og.outputs.names != steps.og-before.outputs.names
        uses: actions/cache/save@v6
        continue-on-error: true    # a failed save never stops the deploy
        with:
          path: site/.og-cache
          key: deck-previews-v2-${{ steps.og.outputs.names }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Pages dates every file by its deploy (the ETag too), so each deploy makes returning browsers download the whole
      # site again: deploy only a site that differs from the live one. build.txt is a digest of the whole site without the
      # build's clock; a schedule tick or a dispatch that rebuilt the same site stops here. No live digest: deploy.
      - id: changed
        run: |
          live=$(curl -fsSL --max-time 30 "$SITE_URL/build.txt?run=$GITHUB_RUN_ID" || true)
          if [ -n "$live" ] && [ "$live" = "$(cat site/dist/build.txt)" ]; then
            echo "The live site is this build ($live): nothing to deploy" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # upload-pages-artifact@v5's two steps (its tar minus -v), the zip stored: the images barely deflate, and deflate
      # paced the upload (~6 s; ~3 s stored).
      - if: steps.changed.outputs.deploy == 'true'
        run: tar --dereference --hard-dereference --directory site/dist -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github --exclude='.[^/]*' .

      - if: steps.changed.outputs.deploy == 'true'
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      # deploy-pages' calls (OIDC token, pages/deployments, its status), each try under a version of its own: Pages answers
      # a version it has deployed with that old deployment (deploy-pages sends GITHUB_SHA: a second build at a commit went
      # nowhere, run 42790226151 "success" in 1 s) and refuses one that is not a commit it holds (404). So each try deploys
      # under a commit of its own, the version job's (none handed over: GITHUB_SHA, as deploy-pages). Status every 2 s, 5 s
      # after 1 min, 10 s after 2 (good deploys take ~30 s); 6 minutes, then cancelled. A deploy 2 min in syncing_files
      # (where stuck ones hang; slow good ones wait in deployment_queued) while a newer main build waits in pages-build:
      # cancelled, and that build deploys (all this).
      # Not to an early build (its Data wait may be long), nor under GITHUB_SHA to one at it. stuck: a version commit's
      # deploy still syncing files at the end (Pages took it; a retry under the same version hung again, run 42753587574).
      - id: deployment
        if: steps.changed.outputs.deploy == 'true'
        continue-on-error: true       # a failed deploy gets one more try, below
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact-id }}
          TRY: "1"
        run: |
          cat > "$RUNNER_TEMP/deploy.sh" << 'EOF'
          api=repos/$GITHUB_REPOSITORY/pages/deployments
          n=0
          until [ -s "$RUNNER_TEMP/setup/versions.code" ] || [ $(( n += 1 )) -gt 1500 ]; do sleep 0.2; done   # 5 min at most
          version=$(sed -n "${TRY}p" "$RUNNER_TEMP/versions.txt" 2> /dev/null | grep -xE '[0-9a-f]{40}') \
            || { version=$GITHUB_SHA; echo "::warning::no version commit handed over: $version, as deploy-pages"; }
          token=$(curl -fsS --connect-timeout 5 --max-time 20 --retry 3 --retry-all-errors \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value // empty')   # a 42 s stall seen
          [ -n "$token" ] || { echo "::error::no OIDC token"; exit 1; }
          echo "::add-mask::$token"
          made=$(TOKEN=$token jq -n --arg v "$version" --argjson a "$ARTIFACT" '{artifact_id: $a, pages_build_version: $v, oidc_token: env.TOKEN}' \
            | timeout 30 gh api -X POST "$api" --input -) || { echo "::error::deployment not created"; exit 1; }
          id=$(jq -r '.id // (.status_url // "" | split("/") | last) // empty' <<< "$made")
          id=${id:-$version}
          echo "page_url=$(jq -r '.page_url // empty' <<< "$made")" >> "$GITHUB_OUTPUT"
          echo "Deployment $id: version $version"
          cancel() { timeout 20 gh api -X POST "$api/$id/cancel" > /dev/null && echo "Deployment cancelled"; }
          trap 'cancel; exit 1' INT TERM          # the job cancelled (as deploy-pages)
          start=$SECONDS last=- since='' next=0 fails=0 same=''
          [ "$version" != "$GITHUB_SHA" ] || same=" and .head_sha != \"$GITHUB_SHA\""
          stuck() { [ "$last" != syncing_files ] || [ "$version" = "$GITHUB_SHA" ] || echo "stuck=true" >> "$GITHUB_OUTPUT"; }
          while :; do
            sleep $(( SECONDS - start < 60 ? 2 : SECONDS - start < 120 ? 5 : 10 ))
            [ $(( SECONDS - start )) -lt 360 ] || { echo "::error::not deployed in 6 minutes"; stuck; cancel; exit 1; }
            if ! st=$(timeout 20 gh api "$api/$id" --jq '.status // ""'); then
              [ $(( fails += 1 )) -lt 15 ] || { echo "::error::15 status reads failed"; stuck; cancel; exit 1; }
              continue
            fi
            [ "$st" = "$last" ] || echo "$(( SECONDS - start )) s: ${st:-no status}"
            last=$st
            case $st in
              succeed) echo "Deployed in $(( SECONDS - start )) s"; exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost) echo "::error::$st"; exit 1 ;;
              syncing_files) since=${since:-$SECONDS} ;;
              *) since= ;;
            esac
            [ -n "$since" ] && [ $(( SECONDS - since )) -ge 120 ] && [ "$SECONDS" -ge "$next" ] || continue
            next=$(( SECONDS + 15 ))
            run=$(timeout 20 gh api "repos/$GITHUB_REPOSITORY/actions/workflows/site.yml/runs?branch=main&per_page=10" \
              --jq "[.workflow_runs[] | select(.id > $GITHUB_RUN_ID and .status != \"completed\"$same
                and (.display_title | startswith(\"Card browser (after\") | not)) | .id] | max // empty") || run=
            [ -n "$run" ] || continue
            if cancel; then
              echo "Run $run waits: deploy handed to it after $(( SECONDS - since )) s syncing files" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Run $run waits: cancel failed"
          done
          EOF
          exec bash "$RUNNER_TEMP/deploy.sh"

      - if: steps.deployment.outcome == 'failure'
        run: sleep 10                 # lets the cancel settle

      # The retry deploys a fresh, deflated copy of the same artifact.tar (upload-pages-artifact's zip)
      - if: steps.deployment.outcome == 'failure'
        id: artifact-z
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-z
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      # Try 1 stuck: the same script under the second version. Else, or that failing too, deploy-pages under GITHUB_SHA,
      # as before 11-10 (a version commit Pages refused, failed or left stuck, or the script failing, never fails a deploy).
      - id: retry
        if: steps.deployment.outcome == 'failure' && steps.deployment.outputs.stuck == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.artifact-z.outputs.artifact-id }}
          TRY: "2"
        run: exec bash "$RUNNER_TEMP/deploy.sh"

      - if: steps.retry.outcome == 'failure'
        run: sleep 10

      - id: pages
        if: steps.deployment.outcome == 'failure' && (steps.deployment.outputs.stuck != 'true' || steps.retry.outcome == 'failure')
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-z
          timeout: 360000             # ms (600000): good deploys take under 5 min, stuck ones never end
          reporting_interval: 1000    # ms between status checks (5000)
          error_count: 15             # HTTP errors before it gives up (10)

      # actions/cache saves only after a job that passed: a job that failed or was cancelled once the build ran (out of image
      # time, failed downloads, an error, the step's timeout, a cancel by hand, or a step after it) saves its images here, under a key of its own that
      # restore-keys finds, so the next run (the daily one, or run it by hand) carries on from them. Only when the cache
      # changed: a build that stopped before the images (no bot data, a truncated site) adds no copy. Keep these last.
      - id: cache-after
        if: (failure() || cancelled()) && contains(fromJSON('["failure", "success", "cancelled"]'), steps.build.outcome)
        run: echo "names=$(find site/.cache 2>/dev/null | LC_ALL=C sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - id: partial
        if: (failure() || cancelled()) && steps.cache-after.outputs.names != '' && steps.cache-after.outputs.names != steps.cache-before.outputs.names
        uses: actions/cache/save@v6
        with:
          path: site/.cache
          key: card-images-v2-${{ hashFiles('site/build/build_site.py', 'site/build/requirements.txt', 'MDW/Fonts/stoogedings-src/build_stoogedings.py') }}-${{ steps.images.outputs.key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

  # Each save above is a new entry (card images ~150 MB): the older ones go. After the deploy.
  caches:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.saved == 'true' }}
    permissions:
      actions: write
    uses: ./.github/workflows/caches.yml
    with:
      prefixes: card-images-v2- deck-previews-v2-
