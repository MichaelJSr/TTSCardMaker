# Card checks (AutoCroissant commands/card_checks.py, owner 2026-11-07): the automatic card flags, off Card sync's path.
# hand: the picture says other than the data, old-style bars, a website edit that cannot bake. bars: special bars. The
# results stay on the data branch by PSD blob (db/card_checks.json); the website shows them. No Discord, no commit
# comment, no block. Card sync starts it after a data commit: only PSDs (or PNGs) without a result are read, so a fixed
# card clears on its next push. A dispatch with `all` reads the whole tree in six shards, each its share of the blobs.
# One writer beside Card sync's data lane: its commits touch db/card_checks.json alone, gate G6 lets them by, and each lane
# goes on top of the other when a push is rejected (card-sync.yml's Commit data). Land the bot's G6 first.
name: Card checks
run-name: ${{ inputs.all && 'Card checks (whole tree)' || 'Card checks' }}

on:
  workflow_dispatch:
    inputs:
      all:
        description: "Check every card, not only the PSDs without a result"
        type: boolean
        default: false
      cards:
        description: "Check these cards again (comma separated, matched like Card Authors.txt)"
        type: string
        default: ""
      builder_ref:
        description: "AutoCroissant ref of the checks (default: the variable CARD_DATA_BUILDER_REF, else main)"
        type: string
        default: ""
  schedule:
    - cron: "41 6 * * *"     # a dispatch lost: PSDs without a result are found the next day

permissions:
  contents: read      # the save job alone writes

concurrency:
  group: card-checks
  cancel-in-progress: false   # a newer pending run replaces an older one: it finds the same PSDs

env:
  BUILDER_REF: ${{ inputs.builder_ref || vars.CARD_DATA_BUILDER_REF || 'main' }}
  BOT_REPO: bobberlington/AutoCroissant

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.all && '[0,1,2,3,4,5]' || '[0]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      SHARD: ${{ matrix.shard }}/${{ inputs.all && '6' || '1' }}
      GIT_NO_LAZY_FETCH: "1"
    steps:
      # main's head: its tree, no file contents but the small files the checks read
      - &checkout-main
        uses: actions/checkout@v7
        env:
          GIT_NO_LAZY_FETCH: "0"
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /site/Card Edits.json
            /MDW/Fonts/stoogedings-src/stoogedings.json

      # card_checks.SPARSE_FILES
      - &builder
        uses: actions/checkout@v7
        env:
          GIT_NO_LAZY_FETCH: "0"
        with:
          repository: ${{ env.BOT_REPO }}
          ref: ${{ env.BUILDER_REF }}
          path: bot
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /commands/card_checks.py
            /commands/card_bake.py
            /commands/card_db.py
            /commands/card_edits.py
            /commands/card_models.py
            /commands/card_preview.py
            /commands/card_preview_branch.py
            /commands/card_standards.py
            /commands/font_check.py
            /commands/git_commit.py
            /commands/github_api.py
            /commands/png_export.py
            /commands/psd_edit.py
            /commands/psd_parser.py
            /commands/psd_parts.py
            /commands/psd_regions.py
            /commands/repo_history.py
            /commands/rulebook.py
            /commands/text_align.py
            /commands/txt2_repair.py
            /commands/ability_place.py
            /commands/ability_index.json
            /global_config.py
            /requirements-cards.txt
            /commands/psd_links.py
            /commands/render_record.json

      - &data-checkout
        uses: actions/checkout@v7
        env:
          GIT_NO_LAZY_FETCH: "0"
        with:
          ref: data
          path: carddata
          fetch-depth: 1

      - &venv
        name: Python environment
        id: venv
        timeout-minutes: 15
        uses: ./.github/actions/cards-python
        with:
          venv: ${{ runner.temp }}/venv
          oxipng: "false"
          help: card_checks

      # The blobs of the PSDs to check and their PNGs, in one fetch per shard (the guards' way): none, and the job is done
      - name: To check
        id: list
        working-directory: bot
        env:
          ALL: ${{ inputs.all }}
          CARDS: ${{ inputs.cards }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --clone "$GITHUB_WORKSPACE" --db "$GITHUB_WORKSPACE/carddata/db" --shard "$SHARD")
          if [ "$ALL" = true ]; then args+=(--all); fi
          if [ -n "$CARDS" ]; then args+=(--cards "$CARDS"); fi
          printf '%s\0' "${args[@]}" > "$RUNNER_TEMP/args"
          "$RUNNER_TEMP/venv/bin/python" -m commands.card_checks list "${args[@]}" > "$RUNNER_TEMP/blobs.txt"
          n=$(grep -c . "$RUNNER_TEMP/blobs.txt" || true)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "$n blobs to read." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fetch them
        if: steps.list.outputs.n != '0'
        timeout-minutes: 20
        continue-on-error: true   # what is missing comes by REST
        run: |
          git -c fetch.negotiationAlgorithm=noop fetch -q --no-tags --no-write-fetch-head --recurse-submodules=no \
            --filter=blob:none --stdin origin < "$RUNNER_TEMP/blobs.txt"

      # The bake's fonts for the real bakes: the card workflows' cache by MDW/Fonts' tree sha; a miss checks them out
      - name: Fonts tree
        id: fonts
        if: steps.list.outputs.n != '0'
        run: |
          git config sparse.expectFilesOutsideOfPatterns true
          echo "sha=$(git rev-parse HEAD:MDW/Fonts)" >> "$GITHUB_OUTPUT"

      - id: font-cache
        if: steps.list.outputs.n != '0'
        uses: actions/cache@v6
        with:
          path: MDW/Fonts
          key: card-fonts-${{ steps.fonts.outputs.sha }}

      - name: Fonts (cache miss)
        if: steps.list.outputs.n != '0' && steps.font-cache.outputs.cache-hit != 'true'
        env:
          GIT_NO_LAZY_FETCH: "0"
        run: git sparse-checkout add '/MDW/Fonts/*' '!/MDW/Fonts/stoogedings-src/'

      - name: Check
        if: steps.list.outputs.n != '0'
        timeout-minutes: 75
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PSD_TOOLS_FONT_DIRS: ${{ github.workspace }}/MDW/Fonts
          OMP_NUM_THREADS: "1"
        run: |
          mapfile -d '' args < "$RUNNER_TEMP/args"
          "$RUNNER_TEMP/venv/bin/python" -m commands.card_checks run "${args[@]}" --workers 3 --minutes 70 \
            --out "$RUNNER_TEMP/checks.json"

      - uses: actions/upload-artifact@v7      # what a run that broke off has checked counts too
        if: ${{ !cancelled() && steps.list.outputs.n != '0' }}
        with:
          name: card-checks-${{ matrix.shard }}
          path: ${{ runner.temp }}/checks.json
          if-no-files-found: ignore
          retention-days: 3

  # The results into db/, every record's notes against the data (a website-only fix clears without a push), one commit
  # on data, then the site. A run with no new result still words the notes.
  save:
    needs: check
    if: ${{ !cancelled() }}
    permissions:
      contents: write   # the data commit
      actions: write    # gh workflow run site.yml
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GIT_NO_LAZY_FETCH: "1"
    steps:
      - *checkout-main
      - *builder
      - *data-checkout
      - *venv

      - uses: actions/download-artifact@v8
        with:
          pattern: card-checks-*
          path: ${{ runner.temp }}/results

      - name: Save
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mapfile -t results < <(find "$RUNNER_TEMP/results" -name checks.json 2> /dev/null)
          "$RUNNER_TEMP/venv/bin/python" -m commands.card_checks save --repo "$GITHUB_REPOSITORY" --clone "$GITHUB_WORKSPACE" \
            --db "$GITHUB_WORKSPACE/carddata/db" "${results[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Never forced: on a rejected push this commit goes on top of the lane's (it touches no other file)
      - name: Commit
        id: commit
        working-directory: carddata
        run: |
          git add db/card_checks.json
          if git diff --cached --quiet; then echo "No flag changed."; exit 0; fi
          me=(-c user.name=AutoCroissant -c user.email=autocroissant@gmail.com)
          git "${me[@]}" commit -q -m "Card checks"
          for i in 1 2 3 4 5; do
            git push origin HEAD:refs/heads/data && { echo "committed=true" >> "$GITHUB_OUTPUT"; exit 0; }
            sleep $((i * 20))
            git fetch -q origin data && git "${me[@]}" rebase -q FETCH_HEAD
          done
          echo "::warning::the card checks' data commit was not pushed: the next run saves them"
          exit 1

      - name: Site build
        if: steps.commit.outputs.committed == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main -R "$GITHUB_REPOSITORY"
