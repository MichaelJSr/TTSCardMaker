# Card checks (AutoCroissant commands/card_checks.py, owner 2026-11-07): the automatic card flags, off Card sync's path.
# hand: the picture says other than the data, old-style bars, a stat edit that cannot bake. bars: special bars. name:
# the website's name, the printed title and the file name disagree (worded at each save). The results stay on the data
# branch by PSD blob (db/card_checks.json); the website shows them. No Discord, no commit
# comment, no block. Card sync starts it at a data job's start (inputs after, job): it sets up, then waits for that job's
# Commit data. Only PSDs (or PNGs) without a result are read, so a fixed card clears on its next push. A dispatch with
# `all` reads the whole tree in eight shards, each its share of the blobs.
# One writer beside Card sync's data lane: its commits touch db/card_checks.json alone, gate G6 lets them by, and each lane
# goes on top of the other when a push is rejected (card-sync.yml's Commit data).
name: Card checks
run-name: ${{ inputs.after && format('Card checks (after {0} {1})', inputs.after, inputs.job) || inputs.all && 'Card checks (whole tree)' || 'Card checks' }}

on:
  workflow_dispatch:
    inputs:
      all:
        description: "Check every card, not only the PSDs without a result"
        type: boolean
        default: false
      cards:
        description: "Check these cards again (comma separated, matched like Card Authors.txt)"
        type: string
        default: ""
      builder_ref:
        description: "AutoCroissant ref of the checks (default: the variable CARD_DATA_BUILDER_REF, else main)"
        type: string
        default: ""
      after:
        description: "Set by Card sync: a data job's run id (the checks set up, then wait for that job's Commit data)"
        type: string
        default: ""
      job:
        description: "Set by Card sync: that job, data or after"
        type: string
        default: ""
  schedule:
    - cron: "41 6 * * *"     # a dispatch lost: PSDs without a result are found the next day

permissions:
  contents: read      # the saves alone write

concurrency:
  group: card-checks
  cancel-in-progress: false   # a newer pending run replaces an older one: it finds the same PSDs

env:
  BUILDER_REF: ${{ inputs.builder_ref || vars.CARD_DATA_BUILDER_REF || 'main' }}
  BOT_REPO: bobberlington/AutoCroissant
  BOT_FILES: |         # card_checks.SPARSE_FILES
    /commands/card_checks.py
    /commands/card_bake.py
    /commands/card_db.py
    /commands/card_edits.py
    /commands/card_models.py
    /commands/card_preview.py
    /commands/card_preview_branch.py
    /commands/card_standards.py
    /commands/font_check.py
    /commands/git_commit.py
    /commands/github_api.py
    /commands/png_export.py
    /commands/psd_edit.py
    /commands/psd_parser.py
    /commands/psd_parts.py
    /commands/psd_regions.py
    /commands/repo_history.py
    /commands/rulebook.py
    /commands/text_align.py
    /commands/txt2_repair.py
    /commands/ability_place.py
    /commands/ability_index.json
    /global_config.py
    /requirements-cards.txt
    /commands/psd_links.py
    /commands/card_plates.py
    /commands/psd_details.py

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.all && '[0,1,2,3,4,5,6,7]' || '[0]') }}
    permissions:
      contents: write   # one shard saves here
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.after && 115 || 90 }}   # Data wait: 25
    defaults:
      run:
        shell: bash
    env:
      SHARD: ${{ matrix.shard }}/${{ inputs.all && '8' || '1' }}
      GIT_NO_LAZY_FETCH: "1"
      CARD_RECORDS_DIR: ${{ github.workspace }}/carddata/db   # the bakes' renders: the data's records
    steps:
      # card-sync.yml's data job's set-up (its Clones start, Cards start, Venv key, Cards and Bot and data): the bot's
      # files and the data branch cloned in the background, main's head beside them, the venv's entry restored meanwhile.
      # A failed or late one: checked out as before.
      - &clones-start
        name: Clones start
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          creds=$RUNNER_TEMP/carddata-credentials.config
          git config --file "$creds" "http.$GITHUB_SERVER_URL/.extraheader" "AUTHORIZATION: basic $auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          b=$RUNNER_TEMP/bot d=$RUNNER_TEMP/carddata
          ( code=0
            { git init -q "$b" && git -C "$b" remote add origin "$GITHUB_SERVER_URL/$BOT_REPO" \
                && git -C "$b" sparse-checkout set --no-cone --stdin <<< "$BOT_FILES" \
                && timeout 30 git -C "$b" fetch -q --depth 1 --no-tags origin "$BUILDER_REF" \
                && timeout 30 git -C "$b" checkout -q --detach FETCH_HEAD; } || code=$?
            echo "$code" > "$RUNNER_TEMP/bot.code" ) < /dev/null > "$RUNNER_TEMP/bot.log" 2>&1 &
          ( code=0
            { timeout 30 git clone -q --depth 1 --no-tags --single-branch --branch data "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$d" \
                && git -C "$d" config "includeIf.gitdir:$GITHUB_WORKSPACE/carddata/.git.path" "$creds"; } || code=$?
            echo "$code" > "$RUNNER_TEMP/carddata.code" ) < /dev/null > "$RUNNER_TEMP/carddata.log" 2>&1 &

      # main's head as the checkout below makes it: its tree, no file contents but the small files the checks read
      - &cards-start
        name: Cards start
        env:
          TOKEN: ${{ github.token }}
          GIT_NO_LAZY_FETCH: "0"
          CARD_FILES: &card-files |
            /.github/actions/
            /site/Card Edits.json
            /MDW/Fonts/stoogedings-src/stoogedings.json
        run: |
          ( for _ in 1 2; do
              printf 'Authorization: Bearer %s\n' "$TOKEN" | curl -sSf --max-time 5 -H @- -H "Accept: application/vnd.github.raw" \
                -o "$RUNNER_TEMP/bot.reqs.part" "$GITHUB_API_URL/repos/$BOT_REPO/contents/requirements-cards.txt?ref=$BUILDER_REF" \
                && mv "$RUNNER_TEMP/bot.reqs.part" "$RUNNER_TEMP/bot.reqs" && break
            done
            touch "$RUNNER_TEMP/reqs.done" ) < /dev/null > "$RUNNER_TEMP/reqs.log" 2>&1 &
          ( code=0
            { git init -q && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" && git config gc.auto 0 \
                && git config include.path "$RUNNER_TEMP/carddata-credentials.config" \
                && git sparse-checkout set --no-cone --stdin <<< "$CARD_FILES" \
                && timeout 15 git -c protocol.version=2 fetch -q --depth 1 --filter=blob:none --no-tags origin +refs/heads/main:refs/remotes/origin/main \
                && timeout 8 git checkout -q -B main origin/main; } || code=$?
            echo "$code" > "$RUNNER_TEMP/cards.code" ) < /dev/null > "$RUNNER_TEMP/cards.log" 2>&1 &

      - &venv-key
        name: Venv key
        id: venv-key
        run: |
          py=$(printf '%s\n' "$RUNNER_TOOL_CACHE"/Python/3.14.*/x64 | grep -E '/3\.14\.[0-9]+/x64$' | sort -V | tail -1) || true
          until [ -e "$RUNNER_TEMP/reqs.done" ] || [ $SECONDS -ge 15 ]; do sleep 0.02; done
          reqs=$RUNNER_TEMP/bot.reqs
          if [ ! -s "$reqs" ]; then
            while [ ! -s "$RUNNER_TEMP/bot.code" ] && [ $SECONDS -lt 15 ]; do sleep 0.02; done
            reqs=$RUNNER_TEMP/bot/requirements-cards.txt
            [ "$(cat "$RUNNER_TEMP/bot.code" 2> /dev/null)" = 0 ] || reqs=""
          fi
          if [ -n "$py" ] && [ -s "$reqs" ]; then
            sha=$(sed -E 's/(^|[[:space:]]+)#.*//; s/[[:space:]]+$//; /^$/d' "$reqs" | sha256sum | cut -d' ' -f1)
            echo "key=card-venv-$sha-$RUNNER_OS-$RUNNER_ARCH-py$(basename "$(dirname "$py")")-ox10.2.1" >> "$GITHUB_OUTPUT"
          fi

      - &venv-cache
        id: venv-cache
        if: steps.venv-key.outputs.key != ''
        timeout-minutes: 5
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/venv
          key: ${{ steps.venv-key.outputs.key }}

      - &cards
        name: Cards
        id: cards
        env:
          HIT: ${{ steps.venv-cache.outputs.cache-hit }}
          KEY: ${{ steps.venv-key.outputs.key }}
        run: |
          if [ "$HIT" = true ]; then echo "VENV_RESTORED=$KEY" >> "$GITHUB_ENV"; fi
          while [ ! -s "$RUNNER_TEMP/cards.code" ] && [ $SECONDS -lt 25 ]; do sleep 0.02; done
          if [ "$(cat "$RUNNER_TEMP/cards.code" 2> /dev/null)" = 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the card repo's fetch failed or took 25 s: checked out instead"; cat "$RUNNER_TEMP/cards.log" 2> /dev/null || true
            rm -rf .git
          fi

      - &checkout-main
        if: steps.cards.outputs.ok != 'true'
        uses: actions/checkout@v7
        env:
          GIT_NO_LAZY_FETCH: "0"
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *card-files

      # blobs_of's shared file (the status chart) the clone lacks, one a fetch, 4 at a time, in
      # the background while the job sets up and waits (its exit code in shared.txt.done); Fetch them leaves them out
      - name: Shared blobs
        continue-on-error: true
        run: |
          list=$RUNNER_TEMP/shared.txt
          git ls-tree --object-only HEAD -- "MDW/Croissant's Special Folder/Satus Effect Colors.psd" | git cat-file --batch-check \
            | awk '$2 == "missing" {print $1}' > "$list"
          nohup bash -c 'timeout -k 10 600 xargs -r -P 4 -n 1 git -c fetch.negotiationAlgorithm=noop fetch -q --no-tags \
            --no-write-fetch-head --recurse-submodules=no --filter=blob:none origin < "$1" & echo $! > "$1.pid"
            wait $! || code=$?; echo "${code:-0}" > "$1.done"' _ "$list" > "$list.log" 2>&1 < /dev/null &
          echo "fetching $(grep -c . "$list") shared blobs"

      - &clones
        name: Bot and data
        id: clones
        run: |
          for c in bot carddata; do
            while [ ! -s "$RUNNER_TEMP/$c.code" ] && [ "$SECONDS" -lt 15 ]; do sleep 0.02; done
            if [ "$(cat "$RUNNER_TEMP/$c.code" 2> /dev/null)" = 0 ] && mv "$RUNNER_TEMP/$c" "$c"; then
              echo "$c=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::the $c clone failed or took 15 s: checked out instead"; cat "$RUNNER_TEMP/$c.log" 2> /dev/null || true
            fi
          done

      - &builder
        if: steps.clones.outputs.bot != 'true'
        uses: actions/checkout@v7
        env:
          GIT_NO_LAZY_FETCH: "0"
        with:
          repository: ${{ env.BOT_REPO }}
          ref: ${{ env.BUILDER_REF }}
          path: bot
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ env.BOT_FILES }}

      - &data-checkout
        if: steps.clones.outputs.carddata != 'true'
        uses: actions/checkout@v7
        env:
          GIT_NO_LAZY_FETCH: "0"
        with:
          ref: data
          path: carddata
          fetch-depth: 1

      # The check job's entry is in place already (Venv key): only checked; its --help in Help start
      - &venv
        name: Python environment
        id: venv
        timeout-minutes: 15
        uses: ./.github/actions/cards-venv
        with:
          venv: ${{ runner.temp }}/venv
          oxipng: "false"
          help: ${{ github.job == 'save' && 'card_checks' || '' }}
          restored: ${{ env.VENV_RESTORED }}

      # card_checks --help (its import closure) in the background beside the fonts restore; Help join waits for it
      - name: Help start
        working-directory: bot
        run: |
          ( code=0; timeout 120 "$RUNNER_TEMP/venv/bin/python" -m commands.card_checks --help > /dev/null || code=$?
            echo "$code" > "$RUNNER_TEMP/help.code" ) < /dev/null > "$RUNNER_TEMP/help.log" 2>&1 &

      # An early run (inputs after) restores its fonts before its Data wait, restore only (the guards' check job saves
      # the entry): Data wait may move main, and Fonts (cache miss) below then fetches them again
      - name: Fonts first
        id: fonts-first
        if: inputs.after
        run: |
          git config sparse.expectFilesOutsideOfPatterns true
          echo "sha=$(git rev-parse HEAD:MDW/Fonts)" >> "$GITHUB_OUTPUT"
      - id: fonts-first-cache
        if: steps.fonts-first.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: MDW/Fonts
          key: card-fonts-${{ steps.fonts-first.outputs.sha }}
      - name: Fonts first (cache miss)
        if: steps.fonts-first.outcome == 'success' && steps.fonts-first-cache.outputs.cache-hit != 'true'
        env:
          GIT_NO_LAZY_FETCH: "0"
        run: git sparse-checkout add '/MDW/Fonts/*' '!/MDW/Fonts/stoogedings-src/'

      - name: Help join
        timeout-minutes: 3
        run: |
          until [ -s "$RUNNER_TEMP/help.code" ]; do sleep 0.02; done
          code=$(cat "$RUNNER_TEMP/help.code")
          [ "$code" = 0 ] || { cat "$RUNNER_TEMP/help.log"; echo "::error::commands.card_checks --help failed (exit $code)"; exit 1; }

      # An early run, set up above while Card sync's data job builds: until that job's data commit is in or the job ended
      # (site.yml's Data wait: git looks every 0.5 s, the jobs API every 4th; 20 minutes at most), then main's head and the
      # data's as they are now, side by side (3 tries, as site.yml's; a look that saw the data commit fetched both).
      # Nothing is listed before the data commit.
      - name: Data wait
        if: inputs.after
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_NO_LAZY_FETCH: "0"                                                            # the sparse files at the new head
          RUN: ${{ inputs.after }}
          JOB: ${{ inputs.job == 'after' && 'Card data after the bake' || 'Card data' }}   # card-sync.yml's job names
          COMMIT: Commit data                                                               # and its step
        run: |
          look() {                              # site.yml's, by the data's head alone (cloned already)
            new=$(timeout 5 git ls-remote origin refs/heads/data) || return 1
            new=${new%%[[:space:]]*}
            [ -n "$seen" ] || seen=$(git -C carddata rev-parse HEAD) || return 1
            [ -n "$new" ] && [ "$new" != "$seen" ] || return 1
            timeout 60 git fetch -q --depth 1 --filter=blob:none origin main & m=$!
            timeout 60 git -C carddata fetch -q --depth 1 origin data || { wait "$m"; return 1; }
            seen=$(git -C carddata rev-parse FETCH_HEAD)
            wait "$m" && [[ $(git -C carddata log -1 --format=%s FETCH_HEAD) == "Card data"* ]]
          }
          i=0 got='' seen=''
          while [ "$SECONDS" -lt 1200 ]; do
            look && { got=1; break; }
            if [ $(( i++ % 4 )) = 0 ]; then
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs" --jq "[.jobs[] | select(.name == \"$JOB\" and (.status == \"completed\"
                or any(.steps[]?; .name == \"$COMMIT\" and .status == \"completed\")))] | length") || n=0
              [ "${n:-0}" -gt 0 ] && break
            fi
            sleep "$([ "$SECONDS" -lt 120 ] && echo 0.5 || echo 3.5)"
          done
          if [ "$SECONDS" -ge 1200 ]; then echo "::warning::$JOB of run $RUN not past $COMMIT in 20 minutes: these checks go on"; fi
          how="past $COMMIT (or ended)"
          [ -z "$got" ] || how="committed $(git -C carddata rev-parse --short FETCH_HEAD) to data"
          echo "$JOB of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN $how after $SECONDS s." | tee -a "$GITHUB_STEP_SUMMARY"
          refetch() {                           # 10 and 15 s apart
            for try in 1 2 3; do
              timeout 60 git -C carddata fetch -q --depth 1 origin data && return
              [ "$try" = 3 ] || sleep $(( try * 5 + 5 ))
            done
            return 1
          }
          data=
          [ -n "$got" ] || { refetch & data=$!; }
          if [ -n "$got" ] || git fetch -q --depth 1 --filter=blob:none origin main; then git reset -q --hard FETCH_HEAD; else echo "::warning::main not fetched again"; fi
          [ -z "$data" ] || wait "$data" || { echo "::error::data not fetched again (3 tries)"; exit 1; }
          git -C carddata reset -q --hard FETCH_HEAD

      # The blobs of the PSDs to check and their PNGs, fetched per shard (the guards' way): none, and the job is done
      - name: To check
        id: list
        working-directory: bot
        env:
          ALL: ${{ inputs.all }}
          CARDS: ${{ inputs.cards }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --clone "$GITHUB_WORKSPACE" --db "$GITHUB_WORKSPACE/carddata/db" --shard "$SHARD")
          if [ "$ALL" = true ]; then args+=(--all); fi
          if [ -n "$CARDS" ]; then args+=(--cards "$CARDS"); fi
          printf '%s\0' "${args[@]}" > "$RUNNER_TEMP/args"
          "$RUNNER_TEMP/venv/bin/python" -m commands.card_checks list "${args[@]}" > "$RUNNER_TEMP/blobs.txt"
          n=$(grep -c . "$RUNNER_TEMP/blobs.txt" || true)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "$n blobs to read." | tee -a "$GITHUB_STEP_SUMMARY"

      # Those not in the clone (Shared blobs' landed), 8 to a fetch, 4 at a time, as the guards' Pushed blobs: small packs
      # barely need GitHub's delta search. In the background (20 minutes at most, its exit code in blobs.txt.done): the
      # fonts restore and Check start meanwhile.
      - name: Fetch them
        if: steps.list.outputs.n != '0'
        run: |
          list=$RUNNER_TEMP/blobs.txt
          git cat-file --batch-check < "$list" | awk '$2 == "missing" {print $1}' > "$list.fetch"
          nohup bash -c 'timeout -k 10 1200 xargs -r -P 4 -n 8 git -c fetch.negotiationAlgorithm=noop fetch -q --no-tags \
            --no-write-fetch-head --recurse-submodules=no --filter=blob:none origin < "$1.fetch" & echo $! > "$1.pid"
            wait $! || code=$?; echo "${code:-0}" > "$1.done"' _ "$list" > "$list.log" 2>&1 < /dev/null &
          echo "fetching $(grep -c . "$list.fetch") of $(grep -c . "$list") blobs"

      # The bake's fonts for the real bakes: the card workflows' cache by MDW/Fonts' tree sha; a miss checks them out. An
      # early run's (Fonts first): again only when Data wait moved MDW/Fonts (a restore it outdated removed first).
      - name: Fonts tree
        id: fonts
        if: steps.list.outputs.n != '0'
        run: |
          git config sparse.expectFilesOutsideOfPatterns true
          echo "sha=$(git rev-parse HEAD:MDW/Fonts)" >> "$GITHUB_OUTPUT"

      - id: font-cache
        if: steps.list.outputs.n != '0' && !inputs.after
        uses: actions/cache@v6
        with:
          path: MDW/Fonts
          key: card-fonts-${{ steps.fonts.outputs.sha }}

      - name: Fonts (cache miss)
        if: steps.list.outputs.n != '0' && steps.font-cache.outputs.cache-hit != 'true' && steps.fonts.outputs.sha != steps.fonts-first.outputs.sha
        env:
          GIT_NO_LAZY_FETCH: "0"
        run: |
          git ls-files -v -z -- ':(glob)MDW/Fonts/*' | while IFS= read -r -d '' f; do [ "${f:0:2}" != "S " ] || rm -f -- "${f:2}"; done
          git sparse-checkout add '/MDW/Fonts/*' '!/MDW/Fonts/stoogedings-src/'

      # Each shard reads each blob as it lands (CARD_BLOBS_PENDING: card_bake waits for a listed one, 300 s at most from
      # the list's write; an `all` shard lists ~195); only lists over 1000 blobs (~7 a second: their fetch can pass the
      # cap) wait for it all
      - name: Check
        if: steps.list.outputs.n != '0'
        timeout-minutes: 75
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PSD_TOOLS_FONT_DIRS: ${{ github.workspace }}/MDW/Fonts
          OMP_NUM_THREADS: "1"
          N: ${{ steps.list.outputs.n }}
        run: |
          list=$RUNNER_TEMP/blobs.txt
          if [ "$N" -gt 1000 ]; then until [ -s "$list.done" ]; do sleep 0.2; done
          else export CARD_BLOBS_PENDING=$list; fi
          mapfile -d '' args < "$RUNNER_TEMP/args"
          "$RUNNER_TEMP/venv/bin/python" -m commands.card_checks run "${args[@]}" --workers 4 --minutes 70 \
            --out "$RUNNER_TEMP/checks.json"

      # What the fetches brought (a blob they never brought went by REST); one still going is stopped: Check is done
      - name: Fetched
        if: ${{ !cancelled() && steps.list.outputs.n != '0' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          list=$RUNNER_TEMP/blobs.txt shared=$RUNNER_TEMP/shared.txt stopped=
          for f in "$shared" "$list"; do
            [ ! -s "$f.pid" ] || [ -s "$f.done" ] || { kill "$(cat "$f.pid")" 2> /dev/null; stopped=" (Check ended first: the fetch stopped)"; }
          done
          for f in "$shared" "$list"; do [ ! -s "$f.pid" ] || until [ -s "$f.done" ]; do sleep 0.2; done; done
          cat "$shared.log" "$list.log" 2> /dev/null || true
          have=$(git cat-file --batch-check < "$list" | grep -vc ' missing$' || true)
          echo "$have of $(grep -c . "$list") blobs in the clone$stopped"
          code=$(cat "$list.done")
          [ "$code" != 0 ] || [ ! -s "$shared.done" ] || code=$(cat "$shared.done")
          [ -n "$stopped" ] || exit "$code"

      - uses: actions/upload-artifact@v7      # for the `all` save job: what a shard that broke off has checked counts too
        if: ${{ !cancelled() && steps.list.outputs.n != '0' && inputs.all }}
        with:
          name: card-checks-${{ matrix.shard }}
          path: ${{ runner.temp }}/checks.json
          if-no-files-found: ignore
          retention-days: 3

      # One shard saves here (the save job's set-up cost more than its work): main and data as they are now
      - name: Newest
        id: newest
        if: ${{ !cancelled() && !inputs.all }}
        run: |
          git fetch -q --depth 1 --filter=blob:none origin main && echo "head=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          git -C carddata fetch -q --depth 1 origin data && git -C carddata reset -q --hard FETCH_HEAD

      # The results into db/, every record's notes against the data (a website-only fix clears without a push), one commit
      # on data, then the site if a flag it shows changed. A run with no new result still words the notes.
      - name: Save
        id: save
        if: ${{ !cancelled() && !inputs.all }}
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.newest.outputs.head }}
        run: |
          mapfile -t results < <(find "$RUNNER_TEMP" -maxdepth 1 -name checks.json)
          "$RUNNER_TEMP/venv/bin/python" -m commands.card_checks save --repo "$GITHUB_REPOSITORY" --clone "$GITHUB_WORKSPACE" \
            --db "$GITHUB_WORKSPACE/carddata/db" --head "$HEAD_SHA" "${results[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Never forced: on a rejected push this commit goes on top of the lane's (it touches no other file). shown: what
      # build_site.py reads (load_checks, check_of, merge_flags, room), by card: a pushed card shows its last flags till
      # checked; a field it starts showing goes in too. jq failing: a site build.
      - &commit
        name: Commit
        id: commit
        if: ${{ !cancelled() && steps.save.outcome == 'success' }}
        working-directory: carddata
        run: |
          git add db/card_checks.json
          if git diff --cached --quiet; then echo "No flag changed."; exit 0; fi
          shown() { jq -cS '{c: ([.cards // {} | .[] | select(.hand or .bars or .name or has("room"))]
            | group_by(.card) | map({key: "\(.[0].card)", value: map([.hand, .bars, .name, .room]) | sort}) | from_entries),
            x: (.cleared // {})}'; }
          old=$(git show HEAD:db/card_checks.json | shown) || old=none
          new=$(shown < db/card_checks.json) || new=
          me=(-c user.name=AutoCroissant -c user.email=autocroissant@gmail.com)
          git "${me[@]}" commit -q -m "Card checks"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/data; then
              [ "$old" != "$new" ] && echo "site=true" >> "$GITHUB_OUTPUT" || echo "No flag the site shows changed."
              exit 0
            fi
            sleep $((i * 20))
            git fetch -q origin data && git "${me[@]}" rebase -q FETCH_HEAD
          done
          echo "::warning::the card checks' data commit was not pushed: the next run saves them"
          exit 1

      - &site-build
        name: Site build
        if: ${{ !cancelled() && steps.commit.outputs.site == 'true' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main -R "$GITHUB_REPOSITORY"

      # The mock-up's plates (card_plates: each checked PSD drawn without its text layers) on the plates branch by PSD
      # blob, those of PSDs gone from main dropped; never a failed run (the mock-up keeps its old way)
      - name: Plates
        if: ${{ !cancelled() && steps.save.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        working-directory: bot
        env:
          HEAD_SHA: ${{ steps.newest.outputs.head }}
        run: |
          mapfile -t results < <(find "$RUNNER_TEMP" -maxdepth 1 -name checks.json)
          "$RUNNER_TEMP/venv/bin/python" -m commands.card_plates publish --git "$GITHUB_WORKSPACE" --head "${HEAD_SHA:-HEAD}" \
            "${results[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  # `all`: the eight shards' results saved together
  save:
    needs: check
    if: ${{ !cancelled() && inputs.all }}
    permissions:
      contents: write   # the data commit
      actions: write    # gh workflow run site.yml
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GIT_NO_LAZY_FETCH: "1"
    steps:
      - *clones-start
      - *cards-start
      - *venv-key
      - *venv-cache
      - *cards
      - *checkout-main
      - *clones
      - *builder
      - *data-checkout
      - *venv

      - uses: actions/download-artifact@v8
        with:
          pattern: card-checks-*
          path: ${{ runner.temp }}/results

      - name: Save
        id: save
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mapfile -t results < <(find "$RUNNER_TEMP/results" -name checks.json 2> /dev/null)
          "$RUNNER_TEMP/venv/bin/python" -m commands.card_checks save --repo "$GITHUB_REPOSITORY" --clone "$GITHUB_WORKSPACE" \
            --db "$GITHUB_WORKSPACE/carddata/db" "${results[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - *commit
      - *site-build

      - name: Plates
        if: ${{ !cancelled() && steps.save.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        working-directory: bot
        run: |
          mapfile -t results < <(find "$RUNNER_TEMP/results" -name checks.json 2> /dev/null)
          "$RUNNER_TEMP/venv/bin/python" -m commands.card_plates publish --git "$GITHUB_WORKSPACE" "${results[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
