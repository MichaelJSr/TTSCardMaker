# Card previews for the website (AutoCroissant commands/card_preview.py; design section 16): one card's PSD-kind edit
# baked as Card sync would, nothing committed to main. The result goes to the orphan branch `previews`
# (previews/<request>/, index.json), one commit per run, rewritten past 200 previews or 7 days; contract: site/NOTES.md
# section 19. No Discord. The preview job's token is read-only; only the publish job writes (stdlib, no install; it starts
# beside the preview and waits for its hand-over).
# Inputs reach the shell only through env and a file. The card packages (AutoCroissant requirements-cards.txt, the
# psd-tools fork's one pin) come in a venv cached per that file (.github/actions/cards-python).
name: Card preview
run-name: Card preview ${{ inputs.request }}

on:
  workflow_dispatch:
    inputs:
      card:
        description: "The card: its key in Card Edits.json (the PSD's file name, the website's card key) or its PSD path"
        type: string
        required: true
      edit:
        description: "Its PSD-kind fields as JSON, as Card Edits.json holds them (at most 16 KB)"
        type: string
        required: true
      request:
        description: "The client's id, 8-64 of A-Z a-z 0-9 -: the result goes to previews/<request>/ on the previews branch"
        type: string
        required: true

permissions:
  contents: read      # the publish job alone writes (the previews branch)

# One run per request (a second dispatch of the same id waits; GitHub keeps one waiting); requests run side by side.
concurrency:
  group: card-preview-${{ inputs.request }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    outputs:
      ok: ${{ steps.validate.outputs.ok }}
      saved: ${{ steps.setup.outputs.wheels == 'built' || steps.font-cache.outputs.cache-hit != 'true' }}
    env:
      BOT_REPO: bobberlington/AutoCroissant
      # The preview and its import closure (no config.py; never psd_analyzer), and the packages it installs. AutoCroissant
      # tests/test_card_preview.py runs --help on exactly this list (card_preview.SPARSE_FILES).
      BOT_FILES: |
        /commands/card_preview.py
        /commands/card_preview_branch.py
        /commands/card_bake.py
        /commands/psd_edit.py
        /commands/psd_regions.py
        /commands/psd_parser.py
        /commands/psd_parts.py
        /commands/text_align.py
        /commands/card_models.py
        /commands/card_edits.py
        /commands/png_export.py
        /commands/github_api.py
        /commands/git_commit.py
        /commands/repo_history.py
        /global_config.py
        /requirements-cards.txt
        /commands/psd_links.py
        /commands/card_preview_reads.py
    steps:
      # In the background: BOT_FILES at the bot's main (cloned in RUNNER_TEMP, moved into bot/ once in, then compiled by
      # the image's Python 3.14, setup-python's: Start imports them compiled), its requirements-cards.txt once through the
      # API (bot.reqs: the venv's key without the clone), and the card repo at this commit in the workspace (14 s at most),
      # every tree (cards.trees) and no file contents (the 16 GB of card folders are never checked out): the card's PSD
      # and PNG, the status chart, the icon manifest and the Types/ PNGs it needs come by blob sha through the API,
      # verified, as Card sync's bake does; the fonts below. The token in a header, never saved.
      - name: Clone
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          cd "$RUNNER_TEMP"
          ( for try in 1 2; do
              printf 'Authorization: Bearer %s\n' "$TOKEN" | curl -sSf --max-time 5 -H @- -H "Accept: application/vnd.github.raw" \
                -o bot.reqs.part "$GITHUB_API_URL/repos/$BOT_REPO/contents/requirements-cards.txt?ref=main" \
                && mv bot.reqs.part bot.reqs && break
            done
            touch reqs.done ) < /dev/null > reqs.log 2>&1 &
          ( code=0
            { timeout 15 git clone -q --depth 1 --no-tags --single-branch --branch main --no-checkout \
                "$GITHUB_SERVER_URL/$BOT_REPO" "$RUNNER_TEMP/bot" \
              && git -C "$RUNNER_TEMP/bot" sparse-checkout set --no-cone --stdin <<< "$BOT_FILES" \
              && git -C "$RUNNER_TEMP/bot" checkout -q main \
              && mkdir bot.claim && mv "$RUNNER_TEMP/bot" "$GITHUB_WORKSPACE/bot"; } || code=$?
            echo "$code" > bot.code
            py=$(ls -d "$RUNNER_TOOL_CACHE"/Python/3.14*/x64/bin/python3 2> /dev/null | sort -V | tail -1) || true
            if [ "$code" = 0 ] && [ -n "$py" ]; then
              "$py" -m compileall -q "$GITHUB_WORKSPACE/bot/commands" "$GITHUB_WORKSPACE/bot/global_config.py" > /dev/null
            fi ) < /dev/null > bot.log 2>&1 &
          ( cd "$GITHUB_WORKSPACE"; code=0
            { git init -q && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              && git sparse-checkout set --no-cone /.github/ \
              && timeout 10 git fetch -q --depth 1 --filter=blob:none --no-tags origin "$GITHUB_SHA" \
              && touch "$RUNNER_TEMP/cards.trees" \
              && timeout 4 git checkout -q --detach FETCH_HEAD; } || code=$?
            echo "$code" > "$RUNNER_TEMP/cards.code" ) < /dev/null > "$RUNNER_TEMP/cards.log" 2>&1 &

      # The request names a folder on the branch: a bad one fails the run and publishes nothing. The card and the edit
      # are card_preview's to check (env and a file here): a bad one is published as an input error for the website.
      - name: Validate
        id: validate
        shell: bash
        env:
          EDIT: ${{ inputs.edit }}
          REQUEST: ${{ inputs.request }}
        run: |
          if ! [[ "$REQUEST" =~ ^[A-Za-z0-9-]{8,64}$ ]]; then
            echo "::error::the request must be 8-64 of A-Z a-z 0-9 -"; exit 1
          fi
          printf '%s' "$EDIT" > "$RUNNER_TEMP/edit.json"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # The preview's first reads, in the background once the bot (bot.code 0, else bot.in: its checkout) and the card
      # repo's trees are in, while the venv restores (the runner's python3, stdlib only): the data's render and spot
      # records (db/ on the data branch; AutoCroissant psd_edit.RECORDS_DIR) to records/, and the card's blobs into this
      # checkout's object store, where the bake reads first. Go waits for reads.done.
      - name: Reads
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARD: ${{ inputs.card }}
        run: |
          { until { [ "$(cat "$RUNNER_TEMP/bot.code" 2> /dev/null)" = 0 ] || [ -e "$RUNNER_TEMP/bot.in" ]; } \
                && { [ -e "$RUNNER_TEMP/cards.trees" ] || [ "$(cat "$RUNNER_TEMP/cards.code" 2> /dev/null)" = 0 ]; } \
                || [ $SECONDS -ge 60 ]; do sleep 0.02; done
            cd bot && python3 -S -m commands.card_preview_reads --card="$CARD" --edit "$RUNNER_TEMP/edit.json" --clone "$GITHUB_WORKSPACE" \
              --repo "$GITHUB_REPOSITORY" --head "$GITHUB_SHA" --records "$RUNNER_TEMP/records" || true
            touch "$RUNNER_TEMP/reads.done"; } < /dev/null > "$RUNNER_TEMP/reads.log" 2>&1 &

      # The venv as cards-python restores it on a hit, without its setup-python and setup-uv downloads (about 1 s): the
      # image's newest 3.14.x (setup-python's pick from the tool cache), the same key (its oxipng tag too), path and check.
      # The key from Clone's read of requirements-cards.txt, so the restore runs beside the clone (a failed clone waits
      # for it); else the clone's.
      - id: venv
        shell: bash
        run: |
          py=$(printf '%s\n' "$RUNNER_TOOL_CACHE"/Python/3.14.*/x64 | grep -E '/3\.14\.[0-9]+/x64$' | sort -V | tail -1) || true
          until [ -e "$RUNNER_TEMP/reqs.done" ] || [ "$(cat "$RUNNER_TEMP/bot.code" 2> /dev/null)" = 0 ] || [ $SECONDS -ge 15 ]; do sleep 0.02; done
          reqs=$RUNNER_TEMP/bot.reqs
          if [ ! -s "$reqs" ]; then
            while [ ! -s "$RUNNER_TEMP/bot.code" ] && [ $SECONDS -lt 15 ]; do sleep 0.02; done
            reqs=bot/requirements-cards.txt
          fi
          if [ -n "$py" ] && [ -s "$reqs" ]; then
            sha=$(sed -E 's/(^|[[:space:]]+)#.*//; s/[[:space:]]+$//; /^$/d' "$reqs" | sha256sum | cut -d' ' -f1)
            echo "key=card-venv-$sha-$RUNNER_OS-$RUNNER_ARCH-py$(basename "$(dirname "$py")")-ox10.2.1" >> "$GITHUB_OUTPUT"
            echo "lib=$py/lib" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      - id: venv-hit
        if: steps.venv.outputs.key != ''
        timeout-minutes: 5
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/venv
          key: ${{ steps.venv.outputs.key }}

      # The clone in bot/ (Clone moves it in); 15 s at most, then bot.claim keeps it out and it is checked out as ever.
      - name: Bot
        id: bot
        shell: bash
        run: |
          while [ ! -s "$RUNNER_TEMP/bot.code" ] && [ $SECONDS -lt 15 ]; do sleep 0.02; done
          mkdir "$RUNNER_TEMP/bot.claim" 2> /dev/null || while [ ! -s "$RUNNER_TEMP/bot.code" ] && [ $SECONDS -lt 30 ]; do sleep 0.02; done
          if [ "$(cat "$RUNNER_TEMP/bot.code" 2> /dev/null)" = 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the bot's clone failed or took 15 s: checked out instead"; cat "$RUNNER_TEMP/bot.log" 2> /dev/null || true
          fi

      - if: steps.bot.outputs.ok != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BOT_REPO }}
          path: bot
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ env.BOT_FILES }}

      - if: steps.bot.outputs.ok != 'true'     # its bot/ in: Reads go
        shell: bash
        run: touch "$RUNNER_TEMP/bot.in"

      # LD_LIBRARY_PATH as setup-python sets it. The bot's requirements-cards.txt must give the key's sha (AC main moved
      # after Clone's read: removed, as on a miss).
      - id: venv-ok
        if: steps.venv-hit.outputs.cache-hit == 'true'
        shell: bash
        env:
          LIB: ${{ steps.venv.outputs.lib }}
          SHA: ${{ steps.venv.outputs.sha }}
        run: |
          export LD_LIBRARY_PATH=$LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          sha=$(sed -E 's/(^|[[:space:]]+)#.*//; s/[[:space:]]+$//; /^$/d' bot/requirements-cards.txt | sha256sum | cut -d' ' -f1)
          if [ "$sha" != "$SHA" ]; then
            echo "the bot's requirements-cards.txt moved after the venv's key: set up as on a miss"
            rm -rf "$RUNNER_TEMP/venv"
          elif "$RUNNER_TEMP/venv/bin/python" -c 'import importlib.metadata as m; [m.version(p) for p in ("psd-tools", "fonttools", "requests")]'; then
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
            echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf "$RUNNER_TEMP/venv"
          fi

      # The card repo from Clone (15 s at most), else fetched here, its git made again (not actions/checkout: it empties
      # the workspace, bot/ with it; not under Reads, once they started on its trees). cards-python and Start read it.
      - name: Cards
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while [ ! -s "$RUNNER_TEMP/cards.code" ] && [ $SECONDS -lt 15 ]; do sleep 0.02; done
          if [ "$(cat "$RUNNER_TEMP/cards.code" 2> /dev/null)" != 0 ]; then
            echo "::warning::the card repo's fetch failed or took 15 s: fetched again"; cat "$RUNNER_TEMP/cards.log" 2> /dev/null || true
            while [ -e "$RUNNER_TEMP/cards.trees" ] && [ ! -e "$RUNNER_TEMP/reads.done" ] && [ $SECONDS -lt 80 ]; do sleep 0.05; done
            auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::$auth"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
            rm -rf .git .github
            git init -q
            git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            git sparse-checkout set --no-cone /.github/
            git fetch -q --depth 1 --filter=blob:none --no-tags origin "$GITHUB_SHA"
            git checkout -q --detach FETCH_HEAD
            echo 0 > "$RUNNER_TEMP/cards.code"
          fi

      # Else the shared setup (.github/actions/cards-python), as ever. Without the oxipng CLI: the bake would recompress
      # preview.png (~4 s), which is never published.
      - if: steps.venv-ok.outputs.ok != 'true'
        timeout-minutes: 5
        uses: ./.github/actions/cards-python
        id: setup
        with:
          oxipng: "false"

      # The preview, in the background from here (8 minutes at most): its imports and the card's tree run while the
      # fonts restore; it waits in ready() for reads.done (or the go file), then bakes up to its first font, which waits
      # for the go file (Go). Output and exit code to RUNNER_TEMP.
      - name: Start
        working-directory: bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSD_TOOLS_FONT_DIRS: ${{ github.workspace }}/MDW/Fonts
          CARD: ${{ inputs.card }}
          REQUEST: ${{ inputs.request }}
        run: |
          export CARD_RECORDS_DIR=$RUNNER_TEMP/records CARD_PREVIEW_WAIT=$RUNNER_TEMP/go CARD_PREVIEW_READS=$RUNNER_TEMP/reads.done
          ( code=0
            timeout 480 python -m commands.card_preview --card="$CARD" --edit "$RUNNER_TEMP/edit.json" \
              --out "$RUNNER_TEMP/preview" --clone "$GITHUB_WORKSPACE" --repo "$GITHUB_REPOSITORY" --head "$GITHUB_SHA" \
              --request="$REQUEST" || code=$?
            echo "$code" > "$RUNNER_TEMP/preview.code" ) < /dev/null > "$RUNNER_TEMP/preview.md" 2> "$RUNNER_TEMP/preview.err" &

      # Fonts as card-sync.yml's: MDW/Fonts' top level, cached by the folder's tree sha (the same cache key), fetched
      # only on a miss.
      - id: fonts
        run: echo "sha=$(git rev-parse HEAD:MDW/Fonts)" >> "$GITHUB_OUTPUT"

      - id: font-cache
        uses: actions/cache@v6
        with:
          path: MDW/Fonts
          key: card-fonts-${{ steps.fonts.outputs.sha }}

      - if: steps.font-cache.outputs.cache-hit != 'true'     # the token in a header, as Clone's
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git sparse-checkout add '/MDW/Fonts/*' '!/MDW/Fonts/stoogedings-src/'

      # The fonts are in; the reads too, or 20 s on: the preview's fonts go. A failed font step skips this (the job's end
      # stops the preview).
      - name: Go
        shell: bash
        run: |
          while [ ! -e "$RUNNER_TEMP/reads.done" ] && [ $SECONDS -lt 20 ]; do sleep 0.05; done
          [ -e "$RUNNER_TEMP/reads.done" ] || echo "reads: not done in 20 s: the preview reads what they lack itself"
          for f in render_record.json spot_record.json; do
            [ -s "$RUNNER_TEMP/records/$f" ] || echo "::warning::db/$f not read from the data branch: renders go without it"
          done
          touch "$RUNNER_TEMP/go"

      # result.json always (a refusal and an input error too); the images when the bake rendered one. Exit 2: a bad card
      # or edit; 1: any other error (the result's `transient` says whether to try again). The summary is this step's.
      - name: Preview
        id: preview
        timeout-minutes: 8
        shell: bash
        run: |
          until [ -s "$RUNNER_TEMP/preview.code" ]; do sleep 0.05; done
          sed 's/^/reads: /' "$RUNNER_TEMP/reads.log" 2> /dev/null || true
          cat "$RUNNER_TEMP/preview.err" >&2
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/preview.md"
          exit "$(cat "$RUNNER_TEMP/preview.code")"

      # The files to publish (none if the preview never ran); not preview.png. AVIF, or WebP from a Pillow without it.
      - name: Hand over
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: card-preview
          path: |
            ${{ runner.temp }}/preview/result.json
            ${{ runner.temp }}/preview/preview.avif
            ${{ runner.temp }}/preview/before.avif
            ${{ runner.temp }}/preview/preview.webp
            ${{ runner.temp }}/preview/before.webp
          if-no-files-found: ignore
          retention-days: 1

  # The only job that writes: one commit on previews. It starts beside the preview (its checkouts and Python ready
  # while the bake runs; the bake still on its own read-only runner) and publishes once the preview hands over, or ends
  # (a failed preview: published as try again; one that never validated: nothing).
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 14       # the preview's 11, then the publish
    permissions:
      contents: write
      actions: read           # the preview job and its hand-over
    steps:
      # A git dir to push from (no file contents).
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/

      # The publisher: stdlib only (card_preview_branch.SPARSE_FILES).
      - uses: actions/checkout@v7
        with:
          repository: bobberlington/AutoCroissant
          path: bot
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /commands/card_preview_branch.py
            /commands/repo_history.py
            /global_config.py

      - uses: actions/setup-python@v7     # the Actions' one Python; stdlib only (-S), no install
        with:
          python-version: "3.14"

      - name: Wait for the preview
        id: wait
        working-directory: bot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Publish's reads, done now (none: Publish fetches as ever)
          timeout 10 python -S -m commands.card_preview_branch --warm --git "$GITHUB_WORKSPACE" || true
          if [ $SECONDS -lt 5 ]; then sleep $((5 - SECONDS)); fi    # a hand-over takes 7 s or more
          job_at=15
          while [ $SECONDS -lt 720 ]; do            # 12 minutes at most; about 9 API calls a preview (the token's 1000/h)
            if gh api "$runs/artifacts" --jq '.artifacts[].name' 2> /dev/null | grep -qx card-preview; then
              echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ $SECONDS -ge $job_at ]; then       # the job, every 15 s: ended without a hand-over?
              job_at=$((SECONDS + 15))
              job=$(gh api "$runs/jobs" --jq '.jobs[] | select(.name == "preview") | "\(.status) \([.steps[] | select(.name == "Validate") | .conclusion][0])"' 2> /dev/null) || job=""
              case $job in
                "completed success") echo "go=true" >> "$GITHUB_OUTPUT"; exit 0 ;;   # validated: published as try again
                completed*) echo "The request never validated: nothing to publish."; exit 0 ;;
              esac
            fi
            if [ $SECONDS -lt 60 ]; then sleep 1; else sleep 3; fi
          done
          echo "::warning::the preview did not end in 12 minutes: nothing published"

      - name: Take over
        if: steps.wait.outputs.go == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: card-preview
          path: ${{ runner.temp }}/preview

      - name: Publish
        if: steps.wait.outputs.go == 'true'
        working-directory: bot
        shell: bash
        env:
          REQUEST: ${{ inputs.request }}
        run: |
          python -S -m commands.card_preview_branch --out "$RUNNER_TEMP/preview" --request="$REQUEST" --git "$GITHUB_WORKSPACE" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # A new wheel or font cache (its key changes with requirements-cards.txt, Python, MDW/Fonts): the older ones go (caches.yml)
  caches:
    needs: preview
    if: ${{ !cancelled() && needs.preview.outputs.saved == 'true' }}
    permissions:
      actions: write
    uses: ./.github/workflows/caches.yml
    with:
      prefixes: card-wheels- card-venv- card-fonts-
