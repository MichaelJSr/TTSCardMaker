# Card previews for the website (AutoCroissant commands/card_preview.py, docs/EDIT_PIPELINE_DESIGN.md section 16): one
# card's PSD-kind edit baked exactly as card-edits.yml would bake it (card_bake.bake_card: the same gates, fonts, status
# chart, icon vocabulary and fork pin) on the runner. Nothing is committed to main and no PSD or PNG is written there: the
# result goes to the orphan branch `previews` (previews/<request>/: result.json, preview.webp, preview.png; index.json
# lists them), one commit per run on the branch head (again from a moved head), rewritten as one fresh commit when it
# holds more than 200 previews or one older than 7 days. The website dispatches it and polls the branch (site/NOTES.md
# section 19). No Discord. The inputs never reach a shell as code: they pass through env and a file, and card_preview
# checks them again. Every push trigger in this repo is `branches: [main]`, and a GITHUB_TOKEN push starts no workflow,
# so the previews commits start nothing.
name: Card preview
run-name: Card preview ${{ inputs.request }}

on:
  workflow_dispatch:
    inputs:
      card:
        description: "The card: its key in Card Edits.json (the PSD's file name, the website's card key) or its PSD path"
        type: string
        required: true
      edit:
        description: "Its PSD-kind fields as JSON, as Card Edits.json holds them (at most 16 KB)"
        type: string
        required: true
      request:
        description: "The client's id, 8-64 of A-Z a-z 0-9 -: the result goes to previews/<request>/ on the previews branch"
        type: string
        required: true

permissions:
  contents: write     # the previews branch; the card's blobs are read by sha

# One run per request (a second dispatch of the same id waits; GitHub keeps one waiting); requests run side by side.
concurrency:
  group: card-preview-${{ inputs.request }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The request names a folder on the branch: a bad one fails the run and publishes nothing. The card and the edit
      # are card_preview's to check (env and a file here): a bad one is published as an input error for the website.
      - name: Validate
        id: validate
        shell: bash
        env:
          EDIT: ${{ inputs.edit }}
          REQUEST: ${{ inputs.request }}
        run: |
          if ! [[ "$REQUEST" =~ ^[A-Za-z0-9-]{8,64}$ ]]; then
            echo "::error::the request must be 8-64 of A-Z a-z 0-9 -"; exit 1
          fi
          printf '%s' "$EDIT" > "$RUNNER_TEMP/edit.json"
          echo "OUT=$RUNNER_TEMP/preview" >> "$GITHUB_ENV"

      # The card repo at main, every tree and no file contents (the 16 GB of card folders are never checked out): the
      # card's PSD and PNG, the status chart, the icon manifest and the Types/ PNGs it needs come by blob sha through the
      # API, verified, as card-edits.yml's do; the fonts below. Publish pushes from this checkout (its credentials).
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/

      # The preview and its import closure (no config.py; never psd_analyzer). AutoCroissant tests/test_card_preview.py
      # runs --help on exactly this list (card_preview.SPARSE_FILES).
      - uses: actions/checkout@v7
        with:
          repository: bobberlington/AutoCroissant
          path: bot
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /commands/card_preview.py
            /commands/card_bake.py
            /commands/psd_edit.py
            /commands/psd_regions.py
            /commands/psd_parser.py
            /commands/card_models.py
            /commands/card_edits.py
            /commands/png_export.py
            /commands/github_api.py
            /commands/git_commit.py
            /commands/repo_history.py
            /global_config.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The fork pin, shared with card-edits.yml and card-guards.yml; pyoxipng: preview.png recompressed losslessly
      # (png_export.recompress), as card-guards.yml installs it.
      - timeout-minutes: 5
        run: pip install -q requests pyoxipng==9.1.1 "psd-tools[composite,text] @ git+https://github.com/MichaelJSr/psd-tools@cards-20261023c"

      # Fonts as card-edits.yml's: MDW/Fonts' top level, cached by the folder's tree sha (the same cache key), fetched
      # only on a miss.
      - id: fonts
        run: echo "sha=$(git rev-parse HEAD:MDW/Fonts)" >> "$GITHUB_OUTPUT"

      - id: font-cache
        uses: actions/cache@v6
        with:
          path: MDW/Fonts
          key: card-fonts-${{ steps.fonts.outputs.sha }}

      - if: steps.font-cache.outputs.cache-hit != 'true'
        run: git sparse-checkout add '/MDW/Fonts/*' '!/MDW/Fonts/stoogedings-src/'

      # result.json always (a refusal and an input error too); the images when the bake rendered one. Exit 2: a bad card
      # or edit; 1: any other error (the result's `transient` says whether to try again). The summary is the job's.
      - name: Preview
        id: preview
        timeout-minutes: 8
        working-directory: bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSD_TOOLS_FONT_DIRS: ${{ github.workspace }}/MDW/Fonts
          CARD: ${{ inputs.card }}
          REQUEST: ${{ inputs.request }}
        run: |
          python -m commands.card_preview --card="$CARD" --edit "$RUNNER_TEMP/edit.json" --out "$OUT" \
            --clone "$GITHUB_WORKSPACE" --repo "$GITHUB_REPOSITORY" --head "$GITHUB_SHA" --request="$REQUEST" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Even when Preview failed or timed out (a missing result is published as an error to try again); one commit on
      # previews, never on main.
      - name: Publish
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: bot
        shell: bash
        env:
          REQUEST: ${{ inputs.request }}
        run: |
          python -m commands.card_preview publish --out "$OUT" --request="$REQUEST" --git "$GITHUB_WORKSPACE" --png \
            | tee -a "$GITHUB_STEP_SUMMARY"
