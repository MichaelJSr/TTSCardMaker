# Tells people what the bot's parser and validator note about a card PSD pushed to main: the lines /update_stats prints
# (NO STARS FOUND, MISSPELT TYPE, SEVERAL CREATURES, HP/DEF/ATK/SPD NOT FOUND, STATS TOO HIGH ...; the parser's own notes
# among them are also the website's Parser notes, the validator's are printed only), after the card's site/Card Edits.json
# entry and the parser's exclusions. The bot's checker (AutoCroissant commands/card_check.py) reads the push's PSDs by
# blob sha and Types/ and the edits file from the pushed tree; the result goes to the job summary, a comment on the
# commit and, when the secret DISCORD_STANDARDS_WEBHOOK is set, a Discord message in the standards channel (no ping). It never
# reverts or rejects a push. The second standardization rule (AutoCroissant docs/Campaigns/CARD_STANDARDIZATION_CAMPAIGN.md
# section 5); font-check.yml is the first and the shape. The card packages (AutoCroissant requirements-cards.txt, the
# psd-tools fork's one pin) install from the card workflows' wheel cache.
name: Card check

on:
  push:
    branches: [main]
    paths:
      - "**/*.psd"
      - "site/Card Edits.json"
      - "Types/**"
  workflow_dispatch:
    inputs:
      all:
        description: "Every card PSD, not just the last commit's (about 813 blob downloads, 16 GB, 25-30 minutes)"
        type: boolean
        default: false

permissions:
  contents: write     # a commit comment is POST repos/{repo}/commits/{sha}/comments, which needs write on contents

concurrency:
  group: card-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      saved: ${{ steps.wheels.outputs.cache-hit != 'true' }}
    steps:
      # Nothing of the card repo is checked out: the PSDs, Types/ names, the icon manifest and site/Card Edits.json all come
      # by blob sha through the API from the tree at the pushed commit. The checker and its import closure (no config.py:
      # github_api reads it in a try/except; the token comes from the environment), and the packages it installs (fonttools:
      # card_check reuses font_check's helpers, which import fontTools). Never psd_analyzer or repo_traverser (discord,
      # pandas). This list is card_check.SPARSE_FILES; tests/test_card_check.py runs --help on exactly it.
      - uses: actions/checkout@v7
        with:
          repository: bobberlington/AutoCroissant
          path: bot
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /commands/card_check.py
            /commands/font_check.py
            /commands/github_api.py
            /commands/psd_parser.py
            /commands/card_models.py
            /commands/card_edits.py
            /global_config.py
            /requirements-cards.txt

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14"     # no `cache: pip`: the wheels below hold every package

      # card-sync.yml's install (the same cache entry): AutoCroissant requirements-cards.txt, the psd-tools fork's one pin,
      # as wheels cached per that file, runner and Python; a hit installs offline, a miss builds them and saves them.
      - id: wheels
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/card-wheels
          key: cards-${{ hashFiles('bot/requirements-cards.txt') }}-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      # uv installs the wheels (~1 s; pip took 5-7 s); a miss builds them with pip (uv has no `pip wheel`)
      - timeout-minutes: 10
        env:
          HIT: ${{ steps.wheels.outputs.cache-hit }}
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_COMPILE_BYTECODE: "1"
        run: |
          [ "$HIT" = true ] || pip wheel -q -w ~/.cache/card-wheels -r bot/requirements-cards.txt
          sed 's/ @ [^;]*//' bot/requirements-cards.txt > "$RUNNER_TEMP/cards.txt"   # by name: a URL line would clone and build the fork
          uv pip install -q --no-index -f ~/.cache/card-wheels -r "$RUNNER_TEMP/cards.txt"

      - if: steps.wheels.outputs.cache-hit != 'true'     # only once they installed
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/card-wheels
          key: ${{ steps.wheels.outputs.cache-primary-key }}

      # A push: the PSDs changed between its two heads. A dispatch: the head commit's PSDs, or with `all` every card PSD
      # of the tree. The markdown is the job summary; report.json and discord.json feed the two steps below. Exit 0 always:
      # an unreadable PSD or a failed API call is one error line in the summary, never a red push.
      - name: Check the PSDs
        working-directory: bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --after "$GITHUB_SHA" --author "$GITHUB_ACTOR"
                --json "$RUNNER_TEMP/report.json" --discord "$RUNNER_TEMP/discord.json")
          if [ "$ALL" = "true" ]; then args+=(--whole-tree); else args+=(--before "$BEFORE"); fi
          python -m commands.card_check "${args[@]}" | tee "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # A card has notes: the Discord message first (the point of the check), only when the webhook secret is set. The URL
      # is never printed; a failed webhook call warns and the job goes on to the commit comment.
      - name: Tell Discord
        if: github.event_name == 'push'    # the one-time whole-repo pass only reports in the job summary
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_STANDARDS_WEBHOOK }}
        run: |
          jq -e '.cards | length > 0' "$RUNNER_TEMP/report.json" > /dev/null || { echo "Nothing to report."; exit 0; }
          if [ -z "$WEBHOOK" ]; then echo "::warning::DISCORD_STANDARDS_WEBHOOK is not set; no Discord message"; exit 0; fi
          curl -sS -o /dev/null -f -H "Content-Type: application/json" --data @"$RUNNER_TEMP/discord.json" "$WEBHOOK" \
            || echo "::warning::the Discord webhook call failed; the commit comment below stands"

      # ... then the report as a comment on the pushed commit (GITHUB_TOKEN with the contents: write above).
      - name: Comment on the commit
        if: github.event_name == 'push'    # the one-time whole-repo pass only reports in the job summary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -e '.cards | length > 0' "$RUNNER_TEMP/report.json" > /dev/null || exit 0
          jq -n --rawfile body "$RUNNER_TEMP/report.md" '{body: $body}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input - > /dev/null

  # A new wheel cache (its key changes with requirements-cards.txt, Python): the older ones go (caches.yml)
  caches:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.saved == 'true' }}
    permissions:
      actions: write
    uses: ./.github/workflows/caches.yml
    with:
      prefixes: cards-
