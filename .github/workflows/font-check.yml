# Tells people when a card PSD pushed to main asks for a font MDW/Fonts does not supply. The bot's checker (AutoCroissant
# commands/font_check.py) reads the push's PSDs by blob sha; the result goes to the job summary, a comment on the commit
# and, when the secret DISCORD_STANDARDS_WEBHOOK is set, a Discord message in the standards channel pinging the card makers'
# role (owner, 2026-10-23: the only role ping of the checks' posts). It never reverts or
# rejects a push: the card stays as pushed, its author is asked to add the font. The first standardization rule
# (AutoCroissant docs/Campaigns/CARD_STANDARDIZATION_CAMPAIGN.md section 5); later rules take the same shape. The card
# packages (AutoCroissant requirements-cards.txt, the psd-tools fork's one pin) install from the card workflows' wheel cache.
name: Font check

on:
  push:
    branches: [main]
    paths:
      - "**/*.psd"
      - "MDW/Fonts/**"
  workflow_dispatch:
    inputs:
      all:
        description: "Every card PSD, not just the last commit's (about 813 blob downloads, 16 GB, 25-30 minutes)"
        type: boolean
        default: false

permissions:
  contents: write     # a commit comment is POST repos/{repo}/commits/{sha}/comments, which needs write on contents

concurrency:
  group: font-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The card folders (16 GB) are never checked out: the PSDs come by blob sha through the API. This checkout brings
      # every tree (so the fonts folder's tree sha is known) and nothing but this workflow's folder.
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/

      # The checker and its import closure (no config.py: github_api reads it in a try/except; the token comes from the
      # environment), and the packages it installs. tests/test_font_check.py runs --help on exactly this list.
      - uses: actions/checkout@v7
        with:
          repository: bobberlington/AutoCroissant
          path: bot
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /commands/font_check.py
            /commands/github_api.py
            /global_config.py
            /requirements-cards.txt

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14"     # no `cache: pip`: the wheels below hold every package

      # card-edits.yml's install (the same cache entry): AutoCroissant requirements-cards.txt, the psd-tools fork's one pin,
      # as wheels cached per that file, runner and Python; a hit installs offline, a miss builds them and saves them.
      - id: wheels
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/card-wheels
          key: cards-${{ hashFiles('bot/requirements-cards.txt') }}-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}

      - timeout-minutes: 10
        env:
          HIT: ${{ steps.wheels.outputs.cache-hit }}
        run: |
          [ "$HIT" = true ] || pip wheel -q -w ~/.cache/card-wheels -r bot/requirements-cards.txt
          sed 's/ @ [^;]*//' bot/requirements-cards.txt > "$RUNNER_TEMP/cards.txt"   # by name: a URL line would clone and build the fork
          pip install -q --no-index -f ~/.cache/card-wheels -r "$RUNNER_TEMP/cards.txt"

      - if: steps.wheels.outputs.cache-hit != 'true'     # only once they installed
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/card-wheels
          key: ${{ steps.wheels.outputs.cache-primary-key }}

      # Fonts: MDW/Fonts' top level (270 font files, 215 MB on 2026-10-21; stoogedings-src/ is the icon font's source and
      # stays out), cached by the folder's tree sha as card-edits.yml does; the sparse checkout fetches them only on a miss.
      - id: fonts
        run: echo "sha=$(git rev-parse HEAD:MDW/Fonts)" >> "$GITHUB_OUTPUT"

      - id: font-cache
        uses: actions/cache@v6
        with:
          path: MDW/Fonts
          key: card-fonts-${{ steps.fonts.outputs.sha }}

      - if: steps.font-cache.outputs.cache-hit != 'true'
        run: git sparse-checkout add '/MDW/Fonts/*' '!/MDW/Fonts/stoogedings-src/'

      # A push: the PSDs changed between its two heads. A dispatch: the head commit's PSDs, or with `all` every card PSD
      # of the tree. The markdown is the job summary; report.json and discord.json feed the two steps below.
      - name: Check the PSDs
        working-directory: bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          args=(--fonts "$GITHUB_WORKSPACE/MDW/Fonts" --repo "$GITHUB_REPOSITORY" --after "$GITHUB_SHA" --author "$GITHUB_ACTOR"
                --json "$RUNNER_TEMP/report.json" --discord "$RUNNER_TEMP/discord.json")
          if [ "$ALL" = "true" ]; then args+=(--whole-tree); else args+=(--before "$BEFORE"); fi
          python -m commands.font_check "${args[@]}" | tee "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Something is missing: the Discord message first (the point of the check), only when the webhook secret is set. The
      # URL is never printed; a failed webhook call warns and the job goes on to the commit comment.
      - name: Tell Discord
        if: github.event_name == 'push'    # the one-time whole-repo pass only reports in the job summary
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_STANDARDS_WEBHOOK }}
        run: |
          jq -e '.cards | length > 0' "$RUNNER_TEMP/report.json" > /dev/null || { echo "Nothing missing."; exit 0; }
          if [ -z "$WEBHOOK" ]; then echo "::warning::DISCORD_STANDARDS_WEBHOOK is not set; no Discord message"; exit 0; fi
          curl -sS -o /dev/null -f -H "Content-Type: application/json" --data @"$RUNNER_TEMP/discord.json" "$WEBHOOK" \
            || echo "::warning::the Discord webhook call failed; the commit comment below stands"

      # ... then the report as a comment on the pushed commit (GITHUB_TOKEN with the contents: write above).
      - name: Comment on the commit
        if: github.event_name == 'push'    # the one-time whole-repo pass only reports in the job summary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -e '.cards | length > 0' "$RUNNER_TEMP/report.json" > /dev/null || exit 0
          jq -n --rawfile body "$RUNNER_TEMP/report.md" '{body: $body}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input - > /dev/null
