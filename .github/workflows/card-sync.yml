# Card sync (AutoCroissant docs/Campaigns/DATA_BUILD_ACTION.md section 6): builds the card data (db/ JSON on the orphan
# branch `data`) and writes the changelog posts, bakes the website's pending PSD edits and updates the TTS save on main.
# Every stage is the bot's code, checked out from bobberlington/AutoCroissant at the builder ref: card_data, changelog
# post, card_bake --local, rulebook_pages, tts_save --names, psd_links redraw. Two lanes (owner, 2026-10-25: only
# main's writes wait):
# - data (Card data): at once on every run but a retry: re-reads main's head, one commit on `data`, the posts, the site.
# - main (Bake and save): the bake and the save as one commit M on main (fast-forward only), then the baked PNGs' save
#   links re-pinned (a second commit). A card push's goes at once (owner, 2026-11-03: no 30-minute window any more): it
#   syncs main's head, one lane at a time (card-main; a newer pending one replaces an older one), and a push made while
#   another push's lane is starting rides along. After M the after job re-reads the baked cards into `data` (no wait).
#   A linked file (Types/, MDW/Linked/) changed since its users' pictures were drawn: the Linked redraw redraws those
#   layers and their PNGs as commit R on M, in M's push (silent; capped, Leftover work chains the rest). So do icon
#   glyphs a stoogedings font commit changed, in the text layers that show them (the same R, one rewrite a card).
# The bake's verdicts and events live on `data` (AutoCroissant docs/Finished/session-2026-10-26/CARD_SYNC_VERDICTS.md): the main job records
# them (bake-records), the first data job after it (the after job, else the next) merges them in its data commit
# (verdicts.json; baked, bake-refused; the merged artifacts in bake-records.json), so a refusal makes no main commit of
# its own. M holds the bake's PSDs, PNGs and Card Edits.json changes (dropped edit fields; website-only fields moved to
# `_site`, a refused card's too since AutoCroissant 97b1e73) plus the TTS save. A guards commit's events (guard-png,
# guard-fix) come from its run's guard-events artifact and show on the Changes page only, never in a post.
# The render and spot records (db/render_record.json, spot_record.json; owner 11-07): what the guards, the bake and the
# link redraw read off a PSD before saving it stripped (AutoCroissant psd_edit.records_of), merged by the data jobs as the
# bake records are (guard-records artifacts too); every card workflow's renders read them (CARD_RECORDS_DIR).
# Runs are live (dry_run off by default). The bot dispatches only its admins' re-parses (/update_stats force_update or
# cards). Leftover work chains (owner, 2026-10-25): a live run that ends with work left dispatches the next run itself
# (job chain): at once for a re-parse in progress, unmerged bake records and edits over the bake's cap. The hourly
# safety cron (GitHub starts it late or not at all: every 4-10 h)
# catches what the chain leaves: unposted events, a lane that failed, a chain that stopped.
# One main lane per guarded push (owner, 2026-10-25, P-2): a push's main lane skips itself when that push's guards have
# fixes to land (card-guards.yml's "Fixes to land"); with 25 PSDs or fewer to convert their check job starts Card sync
# right after that mark (input guards: both lanes set up while the guards land, then wait for its Landed; a lane of it a
# newer run replaced is started again by Follow up), else their Follow up starts it once they land (or land nothing), so
# its one main lane bakes and saves the fixed PNGs. The schedule's and a chained run's skip
# theirs while any guards run with fixes is unfinished.
# Every stage runs in one environment on Python 3.14 with the card packages (AutoCroissant requirements-cards.txt, the
# psd-tools fork's one pin) from the card workflows' venv cache.
name: Card sync
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'Card sync (dry run)' || inputs.retry && 'Card sync (retry)' || 'Card sync' }}

on:
  # The gate's card inputs and the hand-edited TTS save. GITHUB_TOKEN pushes (Card sync's M, the guards' commits) start no
  # run: the guards dispatch one after their commit.
  push:
    branches: [main]
    paths:
      - "**.[pP][sS][dD]"
      - "**.[pP][nN][gG]"
      - "Types/**"
      - "MDW/Linked/**"      # linked pictures: the Linked redraw
      - "MDW/Fonts/*"
      - "MDW/Fonts/stoogedings-src/stoogedings.json"
      - "site/Card Edits.json"
      - "site/Card Authors.txt"
      - "site/Card Creation Dates.json"
      - "TTS/decks.json"
      - "TTS/Impossibility Simulator.json"
      - "site/rulebook/**"   # the rulebook's chapters: db/rulebook.json, and the TTS pages once the website shows them
      - "TTS/Global.lua"     # the save's global script and UI (tts_save writes them into the save)
      - "TTS/Global.xml"
  schedule:
    - cron: "17 * * * *"     # the hourly safety net (owner, 2026-10-25; GitHub starts it every 4-10 h): off the top of the hour, GitHub's busiest
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: every stage runs on the runner; nothing is pushed, posted or dispatched (the artifacts hold the would-be db/, save and posts)"
        type: boolean
        default: false
      full:
        description: "Re-parse every card (budgeted runs of 400 downloads; approves gates G4 and G5)"
        type: boolean
        default: false
      cards:
        description: "Re-parse these cards (comma separated, matched like Card Authors.txt)"
        type: string
        default: ""
      force:
        description: "Run every stage even when the gates find nothing to do"
        type: boolean
        default: false
      bake:
        description: "all, pending (only edits without a final verdict, as the schedule), one card's name, or none"
        type: string
        default: all
      allow_archive:
        description: "Lift gate G2 (more cards archived than usual) for this run"
        type: boolean
        default: false
      restore:
        description: "A data commit whose db/ is written back as a new commit"
        type: string
        default: ""
      builder_ref:
        description: "AutoCroissant ref of the builder (default: the variable CARD_DATA_BUILDER_REF, else main)"
        type: string
        default: ""
      retry:
        description: "Set by Card sync when main moved during its main lane: that run's event (a retry runs only the main lane)"
        type: string
        default: ""
      chain:
        description: "Set by Card sync for leftover work: 'now <runs> <idle>'"
        type: string
        default: ""
      guards:
        description: "Set by Card guards with fixes: its run id (both lanes wait for its Land after their setup)"
        type: string
        default: ""

permissions:
  contents: write     # push M to main and the data commits to data
  actions: write      # gh workflow run site.yml (a GITHUB_TOKEN push triggers no workflow); gh run list

env:
  # A dispatch runs dry only with dry_run on; a push and the schedule run live
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
  BUILDER_REF: ${{ inputs.builder_ref || vars.CARD_DATA_BUILDER_REF || 'main' }}
  BOT_REPO: bobberlington/AutoCroissant
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  SITE_URL: https://michaeljsr.github.io/TTSCardMaker

jobs:
  # The data lane, at once. One data writer at a time (this job and after share card-data; a newer pending one replaces
  # an older one), each from the data branch's head when it starts: the posted cursor rides in its commit, so no event
  # is posted twice.
  data:
    name: Card data
    if: ${{ !inputs.retry }}
    concurrency:
      group: ${{ inputs.dry_run && format('card-data-dry-{0}', github.run_id) || 'card-data' }}   # a dry run: a lock of its own
      cancel-in-progress: false   # a running build is never cut off
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.guards && 155 || 90 }}   # a follow-up's: 65 more for its setup and the guards' wait (as main's)
    outputs:
      saved: ${{ steps.venv.outputs.wheels == 'built' }}
      committed: ${{ steps.data-commit.outputs.committed }}
    defaults:
      run:
        shell: bash
    env:
      AFTER: ""               # the after job: the main lane's last commit (M, or R on it)
      RECORDS: ""             # the after job: its dispatch inputs are the data job's (the records come from any run)
      CARD_RECORDS_DIR: ${{ github.workspace }}/carddata/db   # the renders' records (psd_edit): the data's
      # The builder: exactly card_data.SPARSE_FILES (tests/test_card_data.py runs --help on the three CLIs with this list).
      # Never psd_analyzer, query_card or utils (discord, pandas); no config.py: the token comes from the environment.
      BOT_FILES: &bot-files |
        /commands/card_data.py
        /commands/card_history.py
        /commands/card_db.py
        /commands/changelog.py
        /commands/png_changes.py
        /commands/card_models.py
        /commands/card_edits.py
        /commands/psd_parser.py
        /commands/psd_details.py
        /commands/psd_parts.py
        /commands/text_align.py
        /commands/psd_regions.py
        /commands/font_check.py
        /commands/github_api.py
        /global_config.py
        /commands/psd_remote.py
        /requirements-cards.txt
        /commands/card_bake.py
        /commands/psd_edit.py
        /commands/png_export.py
        /commands/git_commit.py
        /commands/repo_history.py
        /commands/tts_save.py
        /commands/ability_place.py
        /commands/ability_index.json
        /commands/rulebook.py
        /commands/rulebook_pages.py
        /commands/psd_links.py
        /commands/psd_glyphs.py
        /commands/card_standards.py
    steps: &data-steps
      # The site build and the card checks at once (a push's data job, a guards' follow-up and the after job; not a dry
      # run): they set up beside this job, then wait for its Commit data (their Data wait). In the background; Site build
      # and Card checks below find them by their run-names.
      - name: Site build start
        if: env.DRY_RUN != 'true' && (github.event_name == 'push' || inputs.guards || github.job == 'after')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          at=$(date +%s)
          for w in site card-checks; do
            ( gh workflow run "$w.yml" --ref main -R "$GITHUB_REPOSITORY" -f "after=$GITHUB_RUN_ID" -f "job=$GITHUB_JOB" \
              && echo "$at" > "$RUNNER_TEMP/$w-start" ) > "$RUNNER_TEMP/$w-start.log" 2>&1 < /dev/null &
          done

      # BOT_FILES at BUILDER_REF (a branch or a sha) and the data branch, cloned in the background beside main's checkout
      # (in RUNNER_TEMP: that checkout empties the workspace); exit codes in bot.code and carddata.code. The token in a
      # header; carddata keeps it as actions/checkout does (Newest and Commit data fetch and push there).
      - &clones-start
        name: Clones start
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          creds=$RUNNER_TEMP/carddata-credentials.config
          git config --file "$creds" "http.$GITHUB_SERVER_URL/.extraheader" "AUTHORIZATION: basic $auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          b=$RUNNER_TEMP/bot d=$RUNNER_TEMP/carddata
          ( code=0
            { git init -q "$b" && git -C "$b" remote add origin "$GITHUB_SERVER_URL/$BOT_REPO" \
                && git -C "$b" sparse-checkout set --no-cone --stdin <<< "$BOT_FILES" \
                && timeout 30 git -C "$b" fetch -q --depth 1 --no-tags origin "$BUILDER_REF" \
                && timeout 30 git -C "$b" checkout -q --detach FETCH_HEAD; } || code=$?
            echo "$code" > "$RUNNER_TEMP/bot.code" ) < /dev/null > "$RUNNER_TEMP/bot.log" 2>&1 &
          ( code=0
            { timeout 30 git clone -q --depth 1 --no-tags --single-branch --branch data "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$d" \
                && git -C "$d" config "includeIf.gitdir:$GITHUB_WORKSPACE/carddata/.git.path" "$creds"; } || code=$?
            echo "$code" > "$RUNNER_TEMP/carddata.code" ) < /dev/null > "$RUNNER_TEMP/carddata.log" 2>&1 &

      # In the background too: the builder's requirements-cards.txt through the API (bot.reqs: the venv's key without the
      # clone; 5 s, 2 tries), and main's head in the workspace as the checkout below makes it (CARD_FILES, depth 1, no file
      # contents, carddata's header, gc.auto 0), exit code in cards.code. Card preview's Clone does the same.
      - name: Cards start
        env:
          TOKEN: ${{ github.token }}
          CARD_FILES: &card-files |
            /.github/actions/
            /.mailmap
            /site/Card Edits.json
            /site/Card Authors.txt
            /site/Card Creation Dates.json
            /MDW/Fonts/stoogedings-src/stoogedings.json
            /site/rulebook/*.md
        run: &cards-start |
          ( for _ in 1 2; do
              printf 'Authorization: Bearer %s\n' "$TOKEN" | curl -sSf --max-time 5 -H @- -H "Accept: application/vnd.github.raw" \
                -o "$RUNNER_TEMP/bot.reqs.part" "$GITHUB_API_URL/repos/$BOT_REPO/contents/requirements-cards.txt?ref=$BUILDER_REF" \
                && mv "$RUNNER_TEMP/bot.reqs.part" "$RUNNER_TEMP/bot.reqs" && break
            done
            touch "$RUNNER_TEMP/reqs.done" ) < /dev/null > "$RUNNER_TEMP/reqs.log" 2>&1 &
          ( code=0
            { git init -q && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" && git config gc.auto 0 \
                && git config include.path "$RUNNER_TEMP/carddata-credentials.config" \
                && git sparse-checkout set --no-cone --stdin <<< "$CARD_FILES" \
                && timeout 15 git -c protocol.version=2 fetch -q --depth 1 --filter=blob:none --no-tags origin +refs/heads/main:refs/remotes/origin/main \
                && timeout 8 git checkout -q -B main origin/main; } || code=$?
            echo "$code" > "$RUNNER_TEMP/cards.code" ) < /dev/null > "$RUNNER_TEMP/cards.log" 2>&1 &

      # Main's history (every commit and tree) fetched beside the card repo's into history.git with carddata's header, 60 s
      # at most; History join adds it to the checkout. Exit code in history-fetch.code.
      - &history-start
        name: History start
        run: |
          h=$RUNNER_TEMP/history.git
          ( code=0 t=$(date +%s.%N)
            { git init -q --bare "$h" && git -C "$h" config uploadpack.allowFilter true \
                && git -C "$h" config include.path "$RUNNER_TEMP/carddata-credentials.config" \
                && git -C "$h" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                && timeout 60 git -C "$h" -c protocol.version=2 fetch -q --no-tags --filter=blob:none origin +refs/heads/main:refs/heads/main; } || code=$?
            echo "History start: exit $code in $(awk -v a="$t" -v b="$(date +%s.%N)" 'BEGIN { printf "%.2f", b - a }') s"
            echo "$code" > "$RUNNER_TEMP/history-fetch.code" ) > "$RUNNER_TEMP/history-fetch.log" 2>&1 < /dev/null &

      # The venv's entry restored here, beside Cards start's fetch: cards-venv's key (the image's newest 3.14.x, the oxipng
      # tag) from bot.reqs, else the bot clone's file (15 s at most); cards-venv checks it (its input restored).
      - &venv-key
        name: Venv key
        id: venv-key
        run: |
          py=$(printf '%s\n' "$RUNNER_TOOL_CACHE"/Python/3.14.*/x64 | grep -E '/3\.14\.[0-9]+/x64$' | sort -V | tail -1) || true
          until [ -e "$RUNNER_TEMP/reqs.done" ] || [ $SECONDS -ge 15 ]; do sleep 0.02; done
          reqs=$RUNNER_TEMP/bot.reqs
          if [ ! -s "$reqs" ]; then
            while [ ! -s "$RUNNER_TEMP/bot.code" ] && [ $SECONDS -lt 15 ]; do sleep 0.02; done
            reqs=$RUNNER_TEMP/bot/requirements-cards.txt
            [ "$(cat "$RUNNER_TEMP/bot.code" 2> /dev/null)" = 0 ] || reqs=""
          fi
          if [ -n "$py" ] && [ -s "$reqs" ]; then
            sha=$(sed -E 's/(^|[[:space:]]+)#.*//; s/[[:space:]]+$//; /^$/d' "$reqs" | sha256sum | cut -d' ' -f1)
            echo "key=card-venv-$sha-$RUNNER_OS-$RUNNER_ARCH-py$(basename "$(dirname "$py")")-ox10.2.1" >> "$GITHUB_OUTPUT"
          fi

      - &venv-cache
        id: venv-cache
        if: steps.venv-key.outputs.key != ''
        timeout-minutes: 5
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/venv
          key: ${{ steps.venv-key.outputs.key }}

      # Cards start's fetch (25 s at most: its own caps end it sooner); failed: the checkout below, as ever. Before History
      # join and Bot and data (that checkout empties the workspace). The venv's hit goes to cards-venv (VENV_RESTORED).
      - &cards
        name: Cards
        id: cards
        env:
          HIT: ${{ steps.venv-cache.outputs.cache-hit }}
          KEY: ${{ steps.venv-key.outputs.key }}
        run: |
          if [ "$HIT" = true ]; then echo "VENV_RESTORED=$KEY" >> "$GITHUB_ENV"; fi
          while [ ! -s "$RUNNER_TEMP/cards.code" ] && [ $SECONDS -lt 25 ]; do sleep 0.02; done
          if [ "$(cat "$RUNNER_TEMP/cards.code" 2> /dev/null)" = 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the card repo's fetch failed or took 25 s: checked out instead"; cat "$RUNNER_TEMP/cards.log" 2> /dev/null || true
            rm -rf .git
          fi

      # Main's head (not github.sha), no file contents but the small files the stages read (no TTS/: the data reads only
      # decks.json's blob sha). The card folders are never checked out; the build reads PSDs by blob sha, local first,
      # else REST. Depth 1: main's history (every commit and tree) comes in the background (History start, History join).
      - if: steps.cards.outputs.ok != 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *card-files

      # In the background once History start's fetch is done: its history joins the checkout (no config or ref written);
      # it failed, or still shallow (main moved between the two): from GitHub. Exit code in history.code; no git runs in
      # the workspace before History wait but Bake and save's Fonts first (the head's tree; blob fetches never deepen).
      - &history-join
        name: History join
        run: |
          ( until [ -s "$RUNNER_TEMP/history-fetch.code" ]; do sleep 0.05; done
            cat "$RUNNER_TEMP/history-fetch.log"
            code=0
            if [ "$(cat "$RUNNER_TEMP/history-fetch.code")" = 0 ] \
                && git -c remote.history.url="file://$RUNNER_TEMP/history.git" -c remote.history.promisor=true -c remote.history.partialclonefilter=blob:none \
                  fetch -q --unshallow --no-tags --no-write-fetch-head history main \
                && [ "$(git rev-parse --is-shallow-repository)" = false ]; then
              echo "History join: joined"
            else
              echo "History join: from GitHub"
              git -c protocol.version=2 fetch -q --unshallow --no-tags --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main || code=$?
            fi
            echo "$code" > "$RUNNER_TEMP/history.code" ) > "$RUNNER_TEMP/history.log" 2>&1 < /dev/null &

      # The clones in bot/ and carddata/ once done (15 s at most); one failed or late: checked out below as ever
      - &clones
        name: Bot and data
        id: clones
        run: |
          for c in bot carddata; do
            while [ ! -s "$RUNNER_TEMP/$c.code" ] && [ "$SECONDS" -lt 15 ]; do sleep 0.02; done
            if [ "$(cat "$RUNNER_TEMP/$c.code" 2> /dev/null)" = 0 ] && mv "$RUNNER_TEMP/$c" "$c"; then
              echo "$c=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::the $c clone failed or took 15 s: checked out instead"; cat "$RUNNER_TEMP/$c.log" 2> /dev/null || true
            fi
          done

      - &builder
        if: steps.clones.outputs.bot != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BOT_REPO }}
          ref: ${{ env.BUILDER_REF }}
          path: bot
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ env.BOT_FILES }}

      # The data branch (restore rewrites a bad one; a lost branch is pushed back by hand from a clone)
      - &data-checkout
        if: steps.clones.outputs.carddata != 'true'
        uses: actions/checkout@v7
        with:
          ref: data
          path: carddata
          fetch-depth: 1

      # Earlier bake records (below) in the background from here, beside the venv's check: exit code in records-in.code,
      # output in records-in.log. Not in a follow-up's data job (its Newest moves carddata/ first).
      - name: Records start
        if: ${{ !inputs.guards || github.job != 'data' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE: ${{ inputs.restore }}
          RECORDS_SH: &records-sh |
            if [ -z "$RECORDS_BG" ] && [ -e "$RUNNER_TEMP/records-in.bg" ]; then     # Records start's: joined
              until [ -s "$RUNNER_TEMP/records-in.code" ]; do sleep 0.02; done
              cat "$RUNNER_TEMP/records-in.log"
              exit "$(cat "$RUNNER_TEMP/records-in.code")"
            fi
            out=$RUNNER_TEMP/records-in
            rm -rf "$out" && mkdir -p "$out"
            if [ -n "$RESTORE" ] && [ -z "$RECORDS" ]; then echo "A restore merges no bake records."; exit 0; fi
            for name in bake-records guard-records; do
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" \
                --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)
                  | {id: (.id | tostring), run: .workflow_run.id}]'
            done | jq -s 'add | sort_by(.id | tonumber)' > "$out/listed.json"
            seen=$(jq -c '.merged // {}' carddata/db/bake-records.json 2> /dev/null || echo '{}')
            jq -c --argjson seen "$seen" '.[] | select($seen[.id] == null)' "$out/listed.json" | head -20 > "$out/new.jsonl"
            cards='{}' events='[]' ids='{}' recs=()
            while read -r row; do
              id=$(jq -r .id <<< "$row") run=$(jq -r .run <<< "$row")
              rm -rf "$out/one" && mkdir -p "$out/one"
              if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$out/one.zip" && unzip -q -o "$out/one.zip" -d "$out/one"; then
                [ -f "$out/one/verdicts.json" ] || echo '{}' > "$out/one/verdicts.json"    # a guard-records artifact
                [ -f "$out/one/events.json" ] || echo '[]' > "$out/one/events.json"
                [ -f "$out/one/records.json" ] || echo '[]' > "$out/one/records.json"
              fi
              if ! v=$(jq -c '.cards // {}' "$out/one/verdicts.json") || ! e=$(jq -c '. // []' "$out/one/events.json") \
                  || ! jq -e 'type == "array"' "$out/one/records.json" > /dev/null; then
                echo "::warning::the records of run $run were not read: they and later ones wait for the next job"
                break
              fi
              cards=$(jq -c --argjson v "$v" '. + $v' <<< "$cards")
              events=$(jq -c --argjson e "$e" '. + $e' <<< "$events")
              ids=$(jq -c --arg id "$id" --argjson run "$run" '. + {($id): $run}' <<< "$ids")
              cp "$out/one/records.json" "$out/records-$id.json"
              recs+=("$out/records-$id.json")
            done < "$out/new.jsonl"
            echo "$ids" > "$out/ids.json"
            if [ "$ids" = '{}' ]; then echo "No bake records to merge."; exit 0; fi
            jq -n --argjson c "$cards" '{schema: 1, cards: $c}' > "$out/verdicts.json"
            echo "$events" > "$out/events.json"
            jq -s 'add // []' "${recs[@]}" > "$out/records.json"      # files, not arguments: records can be large
            echo "Records of runs $(jq -r '[.[]] | map(tostring) | join(", ")' "$out/ids.json"): $(jq length <<< "$cards") verdicts, $(jq length <<< "$events") events, $(jq length "$out/records.json") PSD records."
        run: |
          touch "$RUNNER_TEMP/records-in.bg"
          ( code=0; RECORDS_BG=1 timeout 300 bash --noprofile --norc -eo pipefail -c "$RECORDS_SH" || code=$?
            echo "$code" > "$RUNNER_TEMP/records-in.code" ) < /dev/null > "$RUNNER_TEMP/records-in.log" 2>&1 &

      # One environment from requirements-cards.txt for the bake, the build, the save and the posts, on the Actions' one
      # Python (3.14; the shared setup, .github/actions/cards-venv). --help proves the main lane's CLIs' import closure
      # before its stages; the data jobs check none (their Build is the first import of card_data).
      # Always, first: before a push's or a follow-up's wait (a data job with nothing to do sets it up too). The data
      # jobs' entry is in place already (Venv key): only checked.
      - &venv
        name: Python environment
        id: venv
        timeout-minutes: 15
        uses: ./.github/actions/cards-venv
        with:
          venv: ${{ runner.temp }}/venv
          oxipng: ${{ github.job == 'main' }}     # the data jobs write no PNG
          help: ${{ github.job == 'main' && 'tts_save card_bake' || '' }}
          restored: ${{ env.VENV_RESTORED }}

      # The guards' fixes (P-2): a guards push run with fixes to land (its check job's step "Fixes to land") starts Card
      # sync once they land, landed or not (its Follow up). A push's run looks for its own push's (in Bake and save, after
      # its setup): unfinished, or finished with Follow up done. The schedule's and a chained run's look here for any
      # unfinished one (two hours back). One found: this run's main lane is skipped (its data lane ran; a push's lane
      # skips its Gate and the rest). Runs that cannot be read count as none (the main lane goes on). A follow-up (guards:
      # the run whose check job started this one, before Land) waits in both lanes after their setup until that check
      # job reaches Landed (Land and its guard-events and guard-records uploads done) or ends: 3 s looks for 2 minutes,
      # then 15 s, 60 at most (the check job's own cap); it holds nothing.
      - &guards
        name: Guards' fixes
        id: guards
        if: github.event_name == 'push' && github.job == 'main' || github.event_name != 'push' && github.job == 'timer' || inputs.guards && (github.job == 'main' || github.job == 'data')
        continue-on-error: true     # failed or cut: the lane goes on
        timeout-minutes: 62         # the wait (12 min at most, a follow-up's 60), then its reads
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          FIXES: Fixes to land        # card-guards.yml's check-job step
          DECIDED: Decided            # its check-job step after Fixes to land
          FOLLOW: Follow up           # card-guards.yml's post-job step that dispatches Card sync
          LANDED: Landed              # its check-job step after Land and its uploads
          RUN: ${{ inputs.guards }}   # a follow-up's guards run
        run: |
          if [ -n "$RUN" ]; then
            k=0 at=0
            while [ "$SECONDS" -lt 3600 ]; do
              k=$((k + 1))
              at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs" --jq "[.jobs[] | select(.name == \"check\" and (.status == \"completed\"
                or any(.steps[]?; .name == \"$LANDED\" and (.status == \"in_progress\" or .status == \"completed\"))))] | length") || at=0
              [ "${at:-0}" -gt 0 ] && break
              if [ $((k % 5)) = 0 ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .status || true)" = completed ]; then break; fi
              sleep "$([ "$SECONDS" -lt 120 ] && echo 3 || echo 15)"
            done
            if [ "$SECONDS" -ge 3600 ]; then echo "::warning::guards run $RUN not past Land in 60 minutes: this run goes on"; fi
            echo "Guards run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN is past Land (or ended): this run goes on from main's head." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          q="repos/$GITHUB_REPOSITORY/actions/workflows/card-guards.yml/runs?event=push&per_page=30"
          if [ -n "$SHA" ]; then q="$q&head_sha=$SHA"; fi
          if ! runs=$(gh api "$q" --jq '.workflow_runs[] | select((.created_at | fromdate) > now - 120 * 60) | "\(.id) \(.status)"'); then
            echo "::warning::the guards' runs were not read: the main lane goes on"
            runs=""
          fi
          while read -r id status; do
            [ -n "$id" ] || continue
            if [ -z "$SHA" ] && [ "$status" = completed ]; then continue; fi     # another push's: unfinished only
            if [ -n "$SHA" ]; then      # this push's: its check job's Decided step (or its end) settles Fixes to land; 12 min at most
              for k in $(seq 200); do
                [ "$status" = completed ] && break
                done_=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq "[.jobs[] | select(.name == \"check\" and (.status == \"completed\"
                  or any(.steps[]?; .name == \"$DECIDED\" and .status == \"completed\")))] | length") || done_=0
                [ "${done_:-0}" -gt 0 ] && break
                sleep 3
                if [ $((k % 5)) = 0 ]; then       # the run, every 15 s: ended with no check job?
                  status=$(gh api "$q" --jq ".workflow_runs[] | select(.id == $id) | .status") || status=""
                fi
              done
            fi
            hold=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq "[.jobs[].steps // [] | .[]] as \$s
              | (\$s | any(.name == \"$FIXES\" and .conclusion == \"success\"))
                and (\"$status\" != \"completed\" or (\$s | any(.name == \"$FOLLOW\" and .conclusion == \"success\")))") || hold=false
            if [ "$hold" = true ]; then
              echo "run=$id" >> "$GITHUB_OUTPUT"
              echo "Guards run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id lands fixes: the Card sync run it starts bakes and saves (this run's main lane is skipped)." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done <<< "$runs"
          echo "No guards run with fixes to land: the main lane goes on." | tee -a "$GITHUB_STEP_SUMMARY"

      # History join done (before any git here: Newest, the Gate, the build's dates); failed or still shallow: once more,
      # else the job fails (never a shallow build)
      - &history-wait
        name: History wait
        timeout-minutes: 5
        run: |
          until [ -s "$RUNNER_TEMP/history.code" ]; do sleep 0.1; done
          cat "$RUNNER_TEMP/history.log"
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "::warning::main's history not fetched in the background (exit $(cat "$RUNNER_TEMP/history.code")): once more"
            git -c protocol.version=2 fetch -q --unshallow --no-tags --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main
            [ "$(git rev-parse --is-shallow-repository)" = false ] || { echo "::error::main's history is still shallow"; exit 1; }
          fi

      # After a wait that held nothing (a push's main lane, a follow-up's two): main's head and the data's as they are
      # now (one not fetched stays as checked out)
      - &newest
        name: Newest
        if: steps.guards.outcome != 'skipped' && !steps.guards.outputs.run
        timeout-minutes: 5
        run: |
          if git fetch -q --filter=blob:none origin main; then git reset -q --hard FETCH_HEAD; else echo "::warning::main not fetched again"; fi
          if git -C carddata fetch -q --depth 1 origin data; then git -C carddata reset -q --hard FETCH_HEAD; else echo "::warning::data not fetched again"; fi

      # The records not merged yet: every live main job's bake-records artifact (verdicts.json, events.json; only what
      # holds: M's part when M landed; records.json) and every guards landing's guard-records (records.json alone) not
      # in db/bake-records.json, oldest first, at most 20, folded into one verdicts.json (a later verdict wins),
      # events.json and records.json (what the bake, the link redraw and the guards read off PSDs before rewriting them:
      # db/'s render and spot records). Any data job merges them, so an after job lost (replaced while pending in
      # card-data, cancelled, failed, a gate) loses nothing: the next data job takes its records. The main job reads
      # them too (its Unmerged verdicts step). A failed download stops there: the rest wait, in order. Only this repo's
      # runs' artifacts (a fork's pull request run's are never read). Records start's run joined here; else (a follow-up's
      # data job, the main job) read here.
      - &records-in
        name: Earlier bake records
        id: records-in
        continue-on-error: true   # not read: the next job looks again
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE: ${{ inputs.restore }}
        run: *records-sh

      # Go when (a) a card input changed since the last build's main commit, (b) a budgeted re-parse is pending, (c) the
      # builder's PARSER_VERSION or psd_details VERSION differs from the data's, (e) events are unposted, (f) a dispatch
      # asks, there is no data yet, or the bake's M is to be re-read (the after job). GO in the env.
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_NO_LAZY_FETCH: "1"
          FORCE: ${{ inputs.force }}
          FULL: ${{ inputs.full }}
          CARDS: ${{ inputs.cards }}
          RESTORE: ${{ inputs.restore }}
        run: |
          if [ -n "$RECORDS" ]; then FULL=false; CARDS=; RESTORE=; fi   # the dispatch's inputs were the data job's
          main=$(git rev-parse HEAD)
          echo "main=$main" >> "$GITHUB_OUTPUT"
          builder=$(git -C bot rev-parse HEAD)
          if [ ! -f bot/commands/card_data.py ]; then
            echo "::error::The builder $BOT_REPO@$BUILDER_REF (${builder:0:8}) has no commands/card_data.py: dispatch with a builder_ref that has it"
            exit 1
          fi
          db=carddata/db
          manifest=$db/manifest.json
          inputs=(':(icase)*.psd' ':(icase)*.png' 'Types/' 'MDW/Linked/' ':(glob)MDW/Fonts/*' 'MDW/Fonts/stoogedings-src/stoogedings.json'
                  'site/Card Edits.json' 'site/Card Authors.txt' 'site/Card Creation Dates.json' 'TTS/decks.json'
                  ':(glob)site/rulebook/*.md')    # the builder's lower-cased extensions
          why=()
          if [ -n "$AFTER" ]; then why+=("the main lane's commit ${AFTER:0:8} to re-read"); fi
          rec=$RUNNER_TEMP/records-in
          n=$( { jq '.cards | length' "$rec/verdicts.json" 2> /dev/null || echo 0; } | head -1)
          e=$( { jq 'length' "$rec/events.json" 2> /dev/null || echo 0; } | head -1)
          r=$( { jq 'length' "$rec/records.json" 2> /dev/null || echo 0; } | head -1)
          if [ "$((n + e + r))" -gt 0 ]; then why+=("the records to merge: $n verdicts, $e events, $r PSD records"); fi
          if [ "$FORCE" = true ]; then why+=("dispatched with force"); fi
          if [ "$FULL" = true ]; then why+=("dispatched with full"); fi
          if [ -n "$CARDS" ]; then why+=("dispatched with cards: $CARDS"); fi
          if [ -n "$RESTORE" ]; then why+=("dispatched with restore: $RESTORE"); fi
          if [ ! -f "$manifest" ]; then
            why+=("no card data yet")
          else
            base=$(jq -r '.card_commit // ""' "$manifest")
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2> /dev/null; then
              why+=("the last build's main commit ${base:0:8} is not in main's history")
            else
              n=$(git log --format=%H "$base..$main" -- "${inputs[@]}" | { grep -c . || true; })
              if [ "$n" -gt 0 ]; then why+=("card inputs changed in $n commits since ${base:0:8}"); fi
            fi
            stale=$(jq '.pending.stale // [] | length' "$manifest")
            if [ "$stale" -gt 0 ]; then why+=("$stale cards still to re-parse"); fi
            built=$(jq -r '.builder.parser_version // ""' "$manifest")
            parser=$(sed -n 's/^PARSER_VERSION *= *\([0-9][0-9]*\).*/\1/p' bot/commands/psd_parser.py)
            if [ "$parser" != "$built" ]; then why+=("parser version ${built:-none} -> $parser"); fi
            built=$(jq -r '.builder.details_version // ""' "$manifest")
            details=$(sed -n 's/^VERSION *= *\([0-9][0-9]*\).*/\1/p' bot/commands/psd_details.py)
            if [ -n "$built" ] && [ "$details" != "$built" ]; then why+=("details version $built -> $details"); fi   # none: older builder
            shopt -s nullglob
            logs=("$db"/changelog/*.jsonl)
            last=0
            if [ ${#logs[@]} -gt 0 ]; then last=$(jq -s 'map(.seq // 0) | max // 0' "${logs[@]}"); fi
            posted=0
            if [ -f "$db/changelog/posted.json" ]; then posted=$(jq '.seq // 0' "$db/changelog/posted.json"); fi
            if [ "$last" -gt "$posted" ]; then why+=("events $((posted + 1))-$last not posted"); fi
          fi
          go=$([ ${#why[@]} -gt 0 ] && echo true || echo false)
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "GO=$go" >> "$GITHUB_ENV"
          {
            echo "## Card data$([ -n "$RECORDS" ] && echo " after the bake")$([ "$DRY_RUN" = true ] && echo " (dry run)")"
            echo
            echo "Main \`${main:0:8}\`, builder \`$BOT_REPO@${builder:0:8}\` ($BUILDER_REF)."
            if [ ${#why[@]} -gt 0 ]; then printf -- '- %s\n' "${why[@]}"; else echo "Nothing to do since the last build."; fi
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The guards' commits since the last build (AutoCroissant, "Card guards: ..."): each one's guard-events.json from the
      # card-guards run of its push (its Guarded-push trailer), matched by the commit it names. One not found warns: its
      # events are lost to the Changes page (Discord never shows them).
      - name: Guard events
        if: env.GO == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_NO_LAZY_FETCH: "1"
          MAIN: ${{ steps.gate.outputs.main }}
        run: |
          base=$(jq -r '.card_commit // ""' carddata/db/manifest.json 2> /dev/null || true)
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2> /dev/null; then exit 0; fi
          out=$RUNNER_TEMP/guard-events
          mkdir -p "$out"
          git log --format='%H%x09%an%x09%(trailers:key=Guarded-push,valueonly,separator=%x2C)%x09%s' "$base..$MAIN" \
            | awk -F'\t' '$2 == "AutoCroissant" && index($4, "Card guards:") == 1 { print $1 " " $3 }' > "$out/commits.txt"
          while read -r sha push; do
            [ -n "$sha" ] || continue
            found=""
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/card-guards.yml/runs?head_sha=${push:-none}&per_page=10" \
                --jq '.workflow_runs[].id' 2> /dev/null); do
              art=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?name=guard-events" --jq '.artifacts[0].id // empty' 2> /dev/null) || art=""
              [ -n "$art" ] || continue
              rm -rf "$out/one" && mkdir -p "$out/one"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$art/zip" > "$out/one.zip" 2> /dev/null || continue
              unzip -q -o "$out/one.zip" -d "$out/one" 2> /dev/null || continue
              if jq -e --arg c "$sha" '.commit == $c' "$out/one/guard-events.json" > /dev/null 2>&1; then
                cat "$out/one/guard-events.json" >> "$out/all.jsonl"
                found=true
                break
              fi
            done
            [ -n "$found" ] || echo "::warning::no guard events for the guards commit ${sha:0:8}: the Changes page misses them"
          done < "$out/commits.txt"
          if [ -s "$out/all.jsonl" ]; then
            jq -s . "$out/all.jsonl" > "$RUNNER_TEMP/guard-events.json"
            echo "Guard events: $(jq '[.[].events | length] | add' "$RUNNER_TEMP/guard-events.json") from $(jq length "$RUNNER_TEMP/guard-events.json") guards commits."
          fi

      # MDW/Fonts' tree sha, the font caches' key. The bake's fonts (main job): its top level, cached by that sha (the card
      # workflows' key, so the entries carry over); the sparse checkout fetches them only on a miss. A hit puts them outside
      # the sparse patterns: without expectFilesOutsideOfPatterns git clears their skip-worktree bits and the bake's ff
      # merge deletes them.
      - &fonts
        name: Fonts tree
        id: fonts
        if: env.GO == 'true'
        run: |
          git config sparse.expectFilesOutsideOfPatterns true
          echo "sha=$(git rev-parse HEAD:MDW/Fonts)" >> "$GITHUB_OUTPUT"

      # The details' "supplied" flags need only the fonts' PostScript names: font_check.save_names' file (CARD_FONT_NAMES),
      # cached by the same sha plus font_check.py's hash (the file's format is the builder's); the fonts are fetched
      # only on a miss, or for a builder without save_names.
      - name: Font names cache
        id: font-names
        if: env.GO == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/font-names.json
          key: card-font-names-${{ steps.fonts.outputs.sha }}-${{ hashFiles('bot/commands/font_check.py') }}

      - name: Font names
        if: env.GO == 'true' && steps.venv.outcome == 'success'
        env:
          HIT: ${{ steps.font-names.outputs.cache-hit }}
        run: |
          if [ "$HIT" != true ]; then
            git sparse-checkout add '/MDW/Fonts/*' '!/MDW/Fonts/stoogedings-src/'
            if ! (cd bot && "$RUNNER_TEMP/venv/bin/python" -c 'import sys; from commands.font_check import save_names; save_names(*sys.argv[1:])' \
                "$GITHUB_WORKSPACE/MDW/Fonts" "$RUNNER_TEMP/font-names.json"); then
              rm -f "$RUNNER_TEMP/font-names.json"
              echo "::warning::font names not saved: the build reads the fonts"
              exit 0
            fi
          fi
          echo "CARD_FONT_NAMES=$RUNNER_TEMP/font-names.json" >> "$GITHUB_ENV"

      # The build on main's head. Exit 0 written or nothing to do, 2 a gate refused, 1 an error. It writes db/ in
      # carddata/ even on a dry run (the artifact); only the data commit publishes it. The main lane's commits since the
      # last build are the card sync's own pushes (--own), whichever data job reads them first. After the bake the
      # dispatch's inputs are left out (they were the data job's).
      - name: Build
        id: build
        if: ${{ !cancelled() && env.GO == 'true' && steps.venv.outcome == 'success' }}
        timeout-minutes: 60
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_NO_LAZY_FETCH: "1"
          PSD_TOOLS_FONT_DIRS: ${{ github.workspace }}/MDW/Fonts
          HEAD_SHA: ${{ steps.gate.outputs.main }}
          FULL: ${{ inputs.full }}
          CARDS: ${{ inputs.cards }}
          ALLOW_ARCHIVE: ${{ inputs.allow_archive }}
          RESTORE: ${{ inputs.restore }}
        run: |
          if [ -n "$RECORDS" ]; then FULL=false; CARDS=; RESTORE=; ALLOW_ARCHIVE=false; fi
          db=$GITHUB_WORKSPACE/carddata/db
          mkdir -p "$db"
          args=(--repo "$GITHUB_REPOSITORY" --checkout "$GITHUB_WORKSPACE" --head "$HEAD_SHA" --db "$db" --budget 400
                --run "$RUN_URL" --summary "$GITHUB_STEP_SUMMARY" --message "$RUNNER_TEMP/message.txt")
          base=$(jq -r '.card_commit // ""' "$db/manifest.json" 2> /dev/null || true)
          if [ -n "$base" ] && git -C "$GITHUB_WORKSPACE" cat-file -e "$base^{commit}" 2> /dev/null; then
            own=$(git -C "$GITHUB_WORKSPACE" log --format='%H|%an|%s' "$base..$HEAD_SHA" \
              | sed -n 's/^\([0-9a-f]*\)|AutoCroissant|Card sync:.*/\1/p' | paste -sd, -)
            if [ -n "$own" ]; then args+=(--own "$own"); fi
          fi
          if [ "$FULL" = true ]; then args+=(--full); fi
          if [ -n "$CARDS" ]; then args+=(--cards "$CARDS"); fi
          if [ "$ALLOW_ARCHIVE" = true ]; then args+=(--allow-archive); fi
          if [ -n "$RESTORE" ]; then args+=(--restore "$RESTORE"); fi
          rec=$RUNNER_TEMP/records-in                    # the bake's verdicts and events not merged yet
          merged=""
          if [ -z "$RESTORE" ] && [ -f "$rec/verdicts.json" ]; then
            args+=(--verdicts "$rec/verdicts.json" --events "$rec/events.json")
            merged=true
            if [ "$(jq length "$rec/records.json" 2> /dev/null || echo 0)" -gt 0 ]; then   # db/'s render and spot records
              if ! grep -q -- '"--records"' commands/card_data.py; then
                echo "::error::The builder ($BUILDER_REF) predates --records: nothing is merged; dispatch with a newer builder_ref"
                exit 1
              fi
              args+=(--records "$rec/records.json")
            fi
          fi
          if [ -f "$RUNNER_TEMP/guard-events.json" ]; then
            args+=(--guard-events "$RUNNER_TEMP/guard-events.json")
          fi
          set +e
          "$RUNNER_TEMP/venv/bin/python" -m commands.card_data "${args[@]}"
          code=$?
          set -e
          if [ "$code" = 2 ]; then echo "::error::A data gate refused: nothing is committed"; fi
          if [ "$code" = 0 ] && [ -n "$merged" ] && [ "$DRY_RUN" != true ]; then   # rides in the data commit
            old=$(jq -c '.merged // {}' "$db/bake-records.json" 2> /dev/null || echo '{}')
            jq -n --argjson old "$old" --slurpfile listed "$rec/listed.json" --slurpfile new "$rec/ids.json" \
              '{merged: (($old | with_entries(select(.key as $k | $listed[0] | any(.id == $k)))) + $new[0])}' \
              > "$db/bake-records.json"                  # the artifacts still listed (not expired), and these
          fi
          exit "$code"

      # One Discord message per push with events past the posted cursor, as discord.json (in the artifact). The card ids
      # come from the live site's cards.json; without it the links search the card.
      - name: Posts
        id: posts
        if: ${{ !cancelled() && env.GO == 'true' && steps.venv.outcome == 'success' }}
        timeout-minutes: 3
        working-directory: bot
        run: |
          ids=()
          if curl -fsS --retry 3 -o "$RUNNER_TEMP/cards.json" "$SITE_URL/data/cards.json"; then
            ids=(--ids "$RUNNER_TEMP/cards.json")
          else
            echo "::warning::the site's cards.json was not fetched: the posts link card searches"
          fi
          "$RUNNER_TEMP/venv/bin/python" -m commands.changelog post --db "$GITHUB_WORKSPACE/carddata/db" --site "$SITE_URL" \
            --repo "$GITHUB_REPOSITORY" "${ids[@]}" --out "$RUNNER_TEMP/discord.json"

      # Off on every dry run. The cursor moves after each accepted message and rides in the data
      # commit. The URL is never printed; a failed call warns and the rest wait for the next run.
      - name: Send the posts
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && steps.posts.outcome == 'success' && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        working-directory: bot
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::DISCORD_CHANGELOG_WEBHOOK is not set; nothing posted"; exit 0; fi
          posts=$RUNNER_TEMP/discord.json
          n=$(jq '.messages | length' "$posts")
          for ((i = 0; i < n; i++)); do
            silent=$(jq ".messages[$i].body == null" "$posts")       # the guards' events alone: no post, the cursor moves
            if [ "$silent" != true ] && ! jq -c ".messages[$i].body" "$posts" | curl -sS -o /dev/null -f -H "Content-Type: application/json" --data @- "$WEBHOOK"; then
              echo "::warning::the Discord webhook call failed: $((n - i)) messages wait for the next run"
              break
            fi
            "$RUNNER_TEMP/venv/bin/python" -m commands.changelog advance --db "$GITHUB_WORKSPACE/carddata/db" \
              --seq "$(jq ".messages[$i].cursor.seq" "$posts")" --push "$(jq -r ".messages[$i].cursor.push // \"\"" "$posts")"
            if [ "$silent" != true ]; then sleep 1; fi
          done

      # db/ and the cursor as one commit on data, never forced; a rejected push fails the job (gate G6's case), but over
      # a Card checks commit (card_data._checks_only, card-checks.yml), which it goes on top of. Tried 3
      # times (a dropped connection), unless it landed after all.
      - name: Commit data
        id: data-commit
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        working-directory: carddata
        run: |
          git add -A db
          if git diff --cached --quiet; then echo "db/ unchanged: no data commit."; exit 0; fi
          if [ ! -s "$RUNNER_TEMP/message.txt" ]; then echo "Card data: posted cursor moved" > "$RUNNER_TEMP/message.txt"; fi
          me=(-c user.name=AutoCroissant -c user.email=autocroissant@gmail.com)
          git "${me[@]}" commit -q -F "$RUNNER_TEMP/message.txt"
          for i in 1 2 3; do
            git push origin HEAD:refs/heads/data && break
            [ "$(git ls-remote origin refs/heads/data | cut -f1)" = "$(git rev-parse HEAD)" ] && break
            # card-checks.yml's commit (db/card_checks.json alone) came between: on top of it; anyone else's stays a failure
            if git fetch -q origin data && [ -z "$(git diff --name-only HEAD...FETCH_HEAD -- . ':!db/card_checks.json')" ]; then
              git "${me[@]}" rebase -q FETCH_HEAD
            fi
            echo "::warning::data push failed (try $i)"
            [ "$i" = 3 ] && exit 1
          done
          echo "committed=true" >> "$GITHUB_OUTPUT"
          git log -1 --format="Data commit \`%h\`: %s." | tee -a "$GITHUB_STEP_SUMMARY"

      # The would-be db/, the posts and the message
      - name: Collect the artifact
        if: always() && env.GO == 'true'
        timeout-minutes: 2
        run: |
          out=$RUNNER_TEMP/card-data
          mkdir -p "$out"
          if [ -d carddata/db ]; then cp -R carddata/db "$out/db"; fi
          for f in discord.json message.txt; do
            if [ -f "$RUNNER_TEMP/$f" ]; then cp "$RUNNER_TEMP/$f" "$out/"; fi
          done

      - uses: actions/upload-artifact@v7
        if: always() && env.GO == 'true'
        timeout-minutes: 5
        with:
          name: ${{ env.RECORDS && 'card-data-after' || 'card-data' }}
          path: ${{ runner.temp }}/card-data
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true     # a re-run replaces attempt 1's

      # A GITHUB_TOKEN push triggers no workflow, so the site build is dispatched after a data commit and after the bake
      # (its PNGs), whatever the data did. Card pushes start no site build of their own (site.yml): this is theirs. Not
      # when Site build start's run is unfinished and under 19 minutes old: it is still in its Data wait (20 minutes at
      # most) and builds this. Missing, replaced while pending in pages-build, or ended: dispatched here.
      - name: Site build
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && (steps.data-commit.outputs.committed == 'true' || env.AFTER != '') }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          EARLY: Card browser (after ${{ github.run_id }} ${{ github.job }})   # site.yml's run-name
        run: |   # 3 tries (a brief API error); a lasting one fails the job
          if at=$(cat "$RUNNER_TEMP/site-start" 2> /dev/null) && [ $(( $(date +%s) - at )) -lt 1140 ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/site.yml/runs?event=workflow_dispatch&per_page=50" \
              --jq "[.workflow_runs[] | select(.display_title == \"$EARLY\")][0].status // \"\"") || status=""
            if [ -n "$status" ] && [ "$status" != completed ]; then
              echo "The site build started with this job ($status) shows this data." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          for wait in 0 10 30; do
            sleep "$wait"
            gh workflow run site.yml --ref main -R "$GITHUB_REPOSITORY" && exit 0
          done
          echo "::error::the site build was not dispatched after 3 tries"
          exit 1

      # The automatic flags, off this run's path (card-checks.yml): it reads only PSDs without a result. Never fails the job.
      # As Site build: not while Site build start's run is unfinished and under 19 minutes old (it checks this data).
      - name: Card checks
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && (steps.data-commit.outputs.committed == 'true' || env.AFTER != '') }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          EARLY: Card checks (after ${{ github.run_id }} ${{ github.job }})   # card-checks.yml's run-name
        run: |
          if at=$(cat "$RUNNER_TEMP/card-checks-start" 2> /dev/null) && [ $(( $(date +%s) - at )) -lt 1140 ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/card-checks.yml/runs?event=workflow_dispatch&per_page=50" \
              --jq "[.workflow_runs[] | select(.display_title == \"$EARLY\")][0].status // \"\"") || status=""
            if [ -n "$status" ] && [ "$status" != completed ]; then
              echo "The card checks started with this job ($status) check this data." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          gh workflow run card-checks.yml --ref main -R "$GITHUB_REPOSITORY" -f "after=$GITHUB_RUN_ID" -f "job=$GITHUB_JOB"

      # A failed live job tells the standards channel once per broken push (owner, 2026-11-11), Card guards' alert
      # included: before posting it looks for the marker line in the commit comments of the push's head commit (this
      # push's, or the push a guards follow-up runs for); after posting it comments it there. A run without a push (the
      # schedule, the chain, a retry, a hand dispatch) also stays quiet when its lane failed in the newest other live run
      # where it ended (runs that skipped or held the lane, and dry runs, pass over), so a lasting failure tells once.
      # It names the failed steps (this job's in the run's job list, else the outcomes below), plain, no preview card,
      # no ping. Unread comments: it posts anyway. The URL is never printed; a failed call only warns.
      - name: Tell Discord
        if: failure() && env.DRY_RUN != 'true'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_STANDARDS_WEBHOOK }}
          GUARDS_RUN: ${{ inputs.guards }}
          OUTCOMES: |
            Bot and data=${{ steps.clones.outcome }}
            Python environment=${{ steps.venv.outcome }}
            Gate=${{ steps.gate.outcome }}
            Fonts tree=${{ steps.fonts.outcome }}
            Build=${{ steps.build.outcome }}
            Posts=${{ steps.posts.outcome }}
            Commit data=${{ steps.data-commit.outcome }}
        run: &tell |
          if [ -z "$WEBHOOK" ]; then echo "::warning::DISCORD_STANDARDS_WEBHOOK is not set; no Discord message"; exit 0; fi
          mark='<!-- discord-failure-told -->'
          if [ "$GITHUB_JOB" = main ]; then lane='.name == "Bake and save"'; job="Bake and save"; keep="Website edits wait for the next bake."
          else lane='(.name | startswith("Card data"))'; job="Card data"; keep="The website and the bot keep the last good data."; fi
          sha=${GITHUB_SHA:-} login=""
          if [ "${GITHUB_EVENT_NAME:-}" = push ]; then login=$GITHUB_ACTOR
          elif [ -n "${GUARDS_RUN:-}" ]; then          # a guards follow-up: that guards run's push
            read -r psha by <<< "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GUARDS_RUN" \
              --jq 'select(.event == "push") | "\(.head_sha) \(.actor.login)"' 2> /dev/null)" || true
            if [ -n "${by:-}" ]; then sha=$psha login=$by; fi
          fi
          if [ -z "$login" ]; then
            bad='(.conclusion == "failure" or .conclusion == "timed_out")'
            held='(.conclusion == "success" and any(.steps[]?; .name == "Gate" and .conclusion == "skipped"))'
            told=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
              --jq "[.jobs[] | select(($lane) and $bad)] | length") || told=0
            if [ "${told:-0}" -gt 0 ]; then echo "$job failed earlier in this run: Discord was told then."; exit 0; fi
            ids=$(gh run list -R "$GITHUB_REPOSITORY" --workflow card-sync.yml --limit 20 --json databaseId,displayTitle \
              --jq ".[] | select(.databaseId != $GITHUB_RUN_ID and .displayTitle != \"Card sync (dry run)\") | .databaseId") \
              || ids=""
            last=""
            for id in $(head -10 <<< "$ids"); do        # the newest live run where the lane ended (a push run's data ends long before it)
              last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                --jq "[.jobs[] | select(($lane) and .conclusion != null and .conclusion != \"skipped\" and .conclusion != \"cancelled\" and ($held | not))]
                  | if length == 0 then \"\" elif any(.[]; $bad) then \"failure\" else \"success\" end") || last=""
              if [ -n "$last" ]; then break; fi
            done
            if [ "$last" = failure ]; then
              echo "$job failed in the last live run where it ran too: Discord was told then."
              exit 0
            fi
          fi
          if [ -n "$sha" ]; then
            told="" read=""
            for wait in 0 10 30; do
              sleep "$wait"
              if told=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/comments" --paginate \
                  --jq ".[] | select(.body | contains(\"$mark\")) | .id"); then read=true; break; fi
            done
            if [ -n "$told" ]; then echo "This push's failure was told in Discord already."; exit 0; fi
            if [ -z "$read" ]; then echo "::warning::the commit's comments were not read: posting anyway"; fi
          fi
          steps=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/${GITHUB_RUN_ATTEMPT:-1}/jobs" --paginate \
            --jq ".jobs[] | select(.status == \"in_progress\" and .runner_name == \"${RUNNER_NAME:-}\") | .steps[]
              | select(.conclusion == \"failure\" or .conclusion == \"timed_out\") | .name" 2> /dev/null) || steps=""
          if [ -z "$steps" ]; then steps=$(sed -n 's/=failure$//p' <<< "$OUTCOMES"); fi
          steps=$(paste -sd, - <<< "${steps:-$job}" | sed 's/,/, /g')
          if [ -n "$login" ]; then where="$login's push ${sha:0:8}"; else where="main ${sha:0:8}"; fi
          jq -n --arg content "Card sync failed on $where: $steps $RUN_URL"$'\n'"$keep" \
            '{content: $content, flags: 4, allowed_mentions: {parse: []}}' \
            | curl -sS -o /dev/null -f -H "Content-Type: application/json" --data @- "$WEBHOOK" \
            || { echo "::warning::the Discord webhook call failed"; exit 0; }
          echo "Told Discord: Card sync failed on $where: $steps."
          if [ -n "$sha" ]; then
            jq -n --arg body "Failure told in Discord: $RUN_URL"$'\n'"$mark" '{body: $body}' \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/commits/$sha/comments" --input - > /dev/null \
              || echo "::warning::the told mark was not commented on ${sha:0:8}"
          fi

  # The main lane goes at once (owner, 2026-11-03: the 30-minute window of 2026-10-24 is gone). A push's run, the
  # schedule's and a chained one first look for a push run whose Bake and save is queued or still in its Guards' fixes
  # (one pushed over 40 minutes ago is stuck and holds nothing). One there syncs main's head after that wait, this
  # push's included, so this run's main lane rides along (skipped; its data lane ran at once). Else the main lane goes.
  # Runs that cannot be read count as none (this run goes on); two near-simultaneous pushes may both wait: the second
  # main lane finds nothing to commit. Other dispatches and retries skip both jobs. A push's lane holds card-main while
  # it waits for its guards: another lane queues behind it.
  timer:
    if: github.event_name == 'schedule' || inputs.chain || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    permissions:
      actions: read       # gh run list
    outputs:
      other: ${{ steps.other.outputs.run }}
      guards: ${{ steps.guards.outputs.run }}
    steps:
      - name: Another timer
        id: other
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: Bake and save       # the main job's name
          WAIT: Guards' fixes       # its step that waits for the push's guards
        run: |
          if ! runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow card-sync.yml --event push --limit 20 --json databaseId,status,createdAt \
              --jq ".[] | select(.status != \"completed\" and .databaseId != ${GITHUB_RUN_ID:-0}
                and (.createdAt | fromdate) > now - 40 * 60) | .databaseId"); then
            echo "::warning::the push runs were not read: this run goes on"
            runs=""
          fi
          while read -r id; do
            [ -n "$id" ] || continue
            # its lane queued, or not past its wait
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
              --jq "[.jobs[] | select(.name == \"$LANE\" and .status != \"completed\"
                and all(.steps[]?; .name != \"$WAIT\" or .status != \"completed\"))] | length") || n=0
            if [ "${n:-0}" -gt 0 ]; then
              echo "run=$id" >> "$GITHUB_OUTPUT"
              echo "Push run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id is about to bake and save main's head (this run's work too)." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done <<< "$runs"
          echo "No push run starting: the main lane goes on." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - *guards

  # The main lane: a push's at once (its setup, then its guards: their check job, then whether they land fixes; no
  # fixed wait: the 30-minute window and its environment card-sync-quiet are gone, owner 2026-11-03), the schedule's and
  # a chained run's when no push run is starting one, another dispatch's and a retry's at once; none while guards' fixes
  # are to land (the run they start is the one). One at a time (card-main); a newer
  # pending one replaces an older one (a retry is dispatched only when no other run is unfinished). It writes only main;
  # db/ is read for the save's names.
  main:
    name: Bake and save
    needs: timer
    if: ${{ !cancelled() && !needs.timer.outputs.other && !needs.timer.outputs.guards }}
    concurrency:
      group: ${{ inputs.dry_run && format('card-main-dry-{0}', github.run_id) || 'card-main' }}   # a dry run: a lock of its own
      cancel-in-progress: false   # a running lane is never cut off
    runs-on: ubuntu-latest
    timeout-minutes: 155    # Commit main pushes M only before minute 60 from the Gate: the 30 left cover the caps of it and
                            # every later step; 65 for the setup and the guards' wait before the Gate
    outputs:
      saved: ${{ steps.venv.outputs.wheels == 'built' || (steps.font-cache.outcome == 'success' && steps.font-cache.outputs.cache-hit != 'true') }}
      m: ${{ steps.main.outputs.m }}
      top: ${{ steps.main.outputs.top }}        # the lane's last commit pushed: R, else M
      baked: ${{ steps.main.outputs.baked }}
      redrawn: ${{ steps.main.outputs.redrawn }}
      records: ${{ steps.records.outputs.records }}
      due: ${{ steps.left.outputs.due }}
      redraw_due: ${{ steps.redraw.outputs.due }}
    defaults:
      run:
        shell: bash
    env:
      CARD_RECORDS_DIR: ${{ github.workspace }}/carddata/db   # the bake's and the redraw's renders: the data's records
      BOT_FILES: *bot-files
    steps:
      - *clones-start
      # The data lane's setup, its checkout plus TTS/ (the save, the rulebook PDF): main's history joins in the
      # background, waited for after the guards' wait (Fonts first reads only the head's tree)
      - name: Cards start
        env:
          TOKEN: ${{ github.token }}
          CARD_FILES: &main-files |
            /.github/actions/
            /.mailmap
            /site/Card Edits.json
            /site/Card Authors.txt
            /site/Card Creation Dates.json
            /MDW/Fonts/stoogedings-src/stoogedings.json
            /TTS/
            /site/rulebook/*.md
        run: *cards-start
      - *history-start
      - *venv-key
      - *venv-cache
      - *cards
      - if: steps.cards.outputs.ok != 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: *main-files
      - *history-join
      - *clones
      - *builder
      - *data-checkout
      - *venv

      # A push's lane and a follow-up's always go (Gate: a push, dispatched): their fonts (Fonts tree below) come
      # before the wait, restore only (the guards' check job saves the entry); a held lane wastes them
      - name: Fonts first
        id: fonts-first
        if: github.event_name == 'push' || inputs.guards
        run: |
          git config sparse.expectFilesOutsideOfPatterns true
          echo "sha=$(git rev-parse HEAD:MDW/Fonts)" >> "$GITHUB_OUTPUT"
      - id: fonts-first-cache
        if: steps.fonts-first.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: MDW/Fonts
          key: card-fonts-${{ steps.fonts-first.outputs.sha }}
      - name: Fonts first (cache miss)
        if: steps.fonts-first.outcome == 'success' && steps.fonts-first-cache.outputs.cache-hit != 'true'
        run: git sparse-checkout add '/MDW/Fonts/*' '!/MDW/Fonts/stoogedings-src/'

      # A push's guards or a follow-up's (above), then main's history (joined), its head and the data's as they are now
      # (not when held)
      - *guards
      - *history-wait
      - *newest

      # Go for a push, a dispatch or a retry; the schedule's and a chained run's when a card input or
      # the save changed (the lane's own commits aside) since the head of the last run whose Bake and save finished (the
      # newest passed over when its rulebook PDF was not drawn, UNDRAWN, but not the one before it: a lag that lasts costs
      # one extra lane), or none of the last 30 runs did; else (g) a website edit the bake put off (capped, main moved):
      # the Pending edits step; else (h) linked pictures not redrawn yet: the Linked due step. GO, EDITS and LINKED in the
      # env. Skipped when the guards hold a push's lane (the schedule and the failure streak pass over such a lane).
      - name: Gate
        id: gate
        if: ${{ !steps.guards.outputs.run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_NO_LAZY_FETCH: "1"
          LANE: Bake and save         # this job's name
          UNDRAWN: Rulebook PDF not drawn   # its step after the PDF's look
          RETRY: ${{ inputs.retry }}
          CHAIN: ${{ inputs.chain }}
        run: |
          main=$(git rev-parse HEAD)
          { echo "main=$main"; echo "start=$(date +%s)"; } >> "$GITHUB_OUTPUT"
          inputs=(':(icase)*.psd' ':(icase)*.png' 'Types/' ':(glob)MDW/Fonts/*' 'MDW/Fonts/stoogedings-src/stoogedings.json'
                  'site/Card Edits.json' 'site/Card Authors.txt' 'site/Card Creation Dates.json' 'TTS/decks.json'
                  'TTS/Impossibility Simulator.json' 'site/rulebook/' 'TTS/Global.lua' 'TTS/Global.xml'
                  'site/assets/' 'site/build/' 'MDW/Linked/')    # the site code and the rulebook's pictures draw its PDF
          why=()
          event=$GITHUB_EVENT_NAME
          if [ -n "$CHAIN" ]; then event=schedule; fi      # a chained run gates as the schedule
          case $event in
            push) why+=("a push") ;;
            schedule)
              synced="" undrawn=""
              if runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow card-sync.yml --status completed --limit 30 \
                  --json databaseId,headSha,displayTitle \
                  --jq '.[] | select(.displayTitle != "Card sync (dry run)") | "\(.databaseId) \(.headSha)"'); then
                while read -r id sha; do
                  [ -n "$id" ] || continue
                  # 1: its lane finished; 2: finished, its PDF not drawn; 0: neither
                  n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq "[.jobs[] | select(.name == \"$LANE\"
                    and .conclusion == \"success\" and any(.steps[]?; .name == \"Gate\" and .conclusion == \"success\"))
                    | if any(.steps[]?; .name == \"$UNDRAWN\" and .conclusion != \"skipped\") then 2 else 1 end] | min // 0") || n=0
                  if [ "${n:-0}" = 1 ] || { [ "${n:-0}" = 2 ] && [ -n "$undrawn" ]; }; then synced=$sha; break; fi
                  if [ "${n:-0}" = 2 ]; then undrawn=$sha; fi
                done <<< "$runs"
              fi
              if [ -z "$synced" ] || ! git cat-file -e "$synced^{commit}" 2> /dev/null; then
                why+=("no finished $LANE found in the last runs")
              else
                n=$(git log --format='%an|%s' "$synced..$main" -- "${inputs[@]}" | { grep -vc '^AutoCroissant|Card sync:' || true; })
                if [ "$n" -gt 0 ]; then why+=("card inputs changed in $n commits since ${synced:0:8} (the last $LANE)"); fi
              fi ;;
            *) why+=("$([ -n "$RETRY" ] && echo "a retry of a $RETRY run" || echo "dispatched")") ;;
          esac
          go=$([ ${#why[@]} -gt 0 ] && echo true || echo false)
          edits=0
          if [ "$go" = false ] && [ -f "site/Card Edits.json" ]; then     # card_edits.KIND's psd fields
            edits=$(jq '[.cards // {} | .[] | select([.name, .stars, .types, .hp, .def, .atk, .spd, .ability] | any(. != null))] | length' \
              "site/Card Edits.json")
          fi
          edits=$([ "$edits" -gt 0 ] && echo true || echo false)
          linked=false                          # (h): the Linked due step reads the links
          if [ "$go" = false ] && [ -f carddata/db/links.json ]; then linked=true; fi
          { echo "go=$go"; echo "edits=$edits"; } >> "$GITHUB_OUTPUT"
          { echo "GO=$go"; echo "EDITS=$edits"; echo "LINKED=$linked"; } >> "$GITHUB_ENV"
          {
            echo "## Bake and save$([ "$DRY_RUN" = true ] && echo " (dry run)")"
            echo
            echo "Main \`${main:0:8}\`."
            if [ ${#why[@]} -gt 0 ]; then printf -- '- %s\n' "${why[@]}"; else echo "Nothing to do since the last bake and save."; fi
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The data checkout plus the bake records no data job merged yet (an earlier run's after job still pending, or
      # lost): Pending edits and the bake read these verdicts, so a card refused a run ago is not baked and told again.
      # Local only: this job never writes data.
      - *records-in
      - name: Unmerged verdicts
        if: steps.venv.outcome == 'success' && steps.records-in.outcome == 'success'
        timeout-minutes: 1
        working-directory: bot
        run: |
          rec=$RUNNER_TEMP/records-in/verdicts.json
          if [ ! -f "$rec" ]; then exit 0; fi
          "$RUNNER_TEMP/venv/bin/python" - "$GITHUB_WORKSPACE/carddata/db" "$rec" <<'PY'
          import json, sys
          from commands.card_db import merge_verdicts
          with open(sys.argv[2], encoding="utf-8") as fh:
              keys = merge_verdicts(sys.argv[1], json.load(fh)["cards"])
          print(f"Verdicts not on data yet: {', '.join(keys) or 'none new'}.")
          PY

      # (g): the bake's put-off edits (card_bake.pending) start the lane.
      - name: Pending edits
        id: edits
        if: env.EDITS == 'true' && env.GO != 'true' && steps.venv.outcome == 'success'
        timeout-minutes: 5
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_NO_LAZY_FETCH: "1"
          MAIN: ${{ steps.gate.outputs.main }}
        run: |
          if ! "$RUNNER_TEMP/venv/bin/python" -c 'import sys; from commands.card_bake import pending; print(*pending(*sys.argv[1:]), sep="\n")' \
              "$GITHUB_REPOSITORY" "$MAIN" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/carddata/db/verdicts.json" > "$RUNNER_TEMP/pending.txt"; then
            echo "::warning::the pending website edits were not read: the next run looks again"
            exit 0
          fi
          names=$(grep . "$RUNNER_TEMP/pending.txt" | paste -sd, - | sed 's/,/, /g' || true)
          if [ -n "$names" ]; then
            echo "- website edits to bake: $names" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "GO=true" >> "$GITHUB_ENV"
          else
            echo "No website edit pending." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # (h): linked pictures and icon glyphs the redraw has not done yet (a capped run, a chain that stopped) start the
      # lane. `due` prints how many cards: the data's links.json and psd_details.json, the icon font's blobs.
      - name: Linked due
        if: env.LINKED == 'true' && env.GO != 'true' && steps.venv.outcome == 'success'
        timeout-minutes: 5
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_NO_LAZY_FETCH: "1"
          MAIN: ${{ steps.gate.outputs.main }}
        run: |
          [ -f commands/psd_links.py ] || { echo "The builder has no psd_links: nothing to redraw."; exit 0; }
          if ! n=$("$RUNNER_TEMP/venv/bin/python" -m commands.psd_links due --head "$MAIN" \
              --clone "$GITHUB_WORKSPACE" --db "$GITHUB_WORKSPACE/carddata/db"); then
            echo "::warning::the linked pictures due were not read: the next run looks again"
            exit 0
          fi
          if [ "${n:-0}" -gt 0 ] 2> /dev/null; then
            echo "- cards to redraw (linked pictures, icon glyphs): $n" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "GO=true" >> "$GITHUB_ENV"
          else
            echo "No linked picture or icon glyph due." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Fonts first's lanes: the miss path again only when Newest moved MDW/Fonts (a restore it outdated removed first)
      - *fonts
      - id: font-cache
        if: env.GO == 'true' && !steps.fonts-first.outputs.sha
        uses: actions/cache@v6
        with:
          path: MDW/Fonts
          key: card-fonts-${{ steps.fonts.outputs.sha }}

      - name: Fonts (cache miss)
        if: env.GO == 'true' && steps.font-cache.outputs.cache-hit != 'true' && steps.fonts.outputs.sha != steps.fonts-first.outputs.sha
        run: |
          git ls-files -v -z -- ':(glob)MDW/Fonts/*' | while IFS= read -r -d '' f; do [ "${f:0:2}" != "S " ] || rm -f -- "${f:2}"; done
          git sparse-checkout add '/MDW/Fonts/*' '!/MDW/Fonts/stoogedings-src/'

      # The bake makes one local commit B on main's head in this checkout (nothing pushed); a dry run commits nothing.
      # A card's error fails the step but keeps B for the others (the bake's
      # per-card rule); no B means the lane goes on from main's head. --pending: a push's run, the schedule's, their
      # retries and bake=pending.
      - name: Bake
        id: bake
        if: env.GO == 'true' && steps.venv.outcome == 'success' && inputs.bake != 'none'
        timeout-minutes: 50
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PSD_TOOLS_FONT_DIRS: ${{ github.workspace }}/MDW/Fonts
          MAIN: ${{ steps.gate.outputs.main }}
          CARD: ${{ inputs.bake }}
          RETRY_OF: ${{ inputs.retry }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --head "$MAIN" --local "$GITHUB_WORKSPACE"
                --verdicts "$GITHUB_WORKSPACE/carddata/db/verdicts.json")    # the data's: what --pending keeps to
          if [[ "$GITHUB_EVENT_NAME" =~ ^(schedule|push)$ || "$RETRY_OF" =~ ^(schedule|push)$ || "$CARD" = pending ]]; then
            args+=(--pending)                   # else a dispatch re-checks every card
          fi
          if [ -n "$CARD" ] && [ "$CARD" != all ] && [ "$CARD" != pending ]; then args+=(--card "$CARD"); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          set +e
          "$RUNNER_TEMP/venv/bin/python" -m commands.card_bake "${args[@]}" > "$RUNNER_TEMP/bake.md"
          code=$?
          set -e
          cat "$RUNNER_TEMP/bake.md"
          cat "$RUNNER_TEMP/bake.md" >> "$GITHUB_STEP_SUMMARY"
          head=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          if [ "$head" != "$MAIN" ]; then
            if [ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^)" != "$MAIN" ]; then
              echo "::error::The checkout's HEAD ${head:0:8} is not a commit on main's head"
              exit 1
            fi
            { echo "baked=true"; echo "b=$head"; } >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      # The save on the checkout (B's Card Edits.json and decks), names from the data branch's head (Card Edits.json's
      # first); with no data, the website's cards.json. In the background while the rulebook PDF prints (the save pins
      # main before M and reads only pages.json's PDF name): TTS save waits for it (20 minutes at most).
      - name: TTS save start
        id: save-start
        if: ${{ !cancelled() && env.GO == 'true' && steps.venv.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: bot
        env:
          AUTOCROISSANT_LOCAL_DIR: ${{ github.workspace }}
          AUTOCROISSANT_HISTORY_CLONE: ${{ runner.temp }}/TTSCardMaker-history.git
        run: |
          save="TTS/Impossibility Simulator.json" bg=$RUNNER_TEMP/save
          names=()
          if [ -f "$GITHUB_WORKSPACE/carddata/db/stats.json" ]; then
            names=(--names "$GITHUB_WORKSPACE/carddata/db/stats.json")
          else
            echo "No card data: names from the website's cards.json."
          fi
          mkdir -p "$bg"
          ( code=0; timeout -k 10 1200 "$RUNNER_TEMP/venv/bin/python" -m commands.tts_save "$GITHUB_WORKSPACE/$save" "${names[@]}" \
              > "$RUNNER_TEMP/save.md" 2> "$bg/err" || code=$?; echo "$code" > "$bg/code" ) < /dev/null > /dev/null 2>&1 &

      # The rulebook's TTS PDF (AutoCroissant commands/rulebook_pages): the website's #/rules/print printed by the runner's
      # Chrome to TTS/Rulebook/Rulebook.pdf (again only when a page's pixels changed), once the website shows main's
      # chapters, rulebook pictures, web fonts, icons and code (it waits up to 10 minutes for the deploy of them; the page
      # and its plain-URL files as Chrome gets them past the CDN); the save puts it in the Rulebooks bag and M takes it. A
      # failure leaves the PDF as it was. changed: the PDF or the page list; key: pages.json's key or pre alone (M takes it
      # only when made for something else); lag: exit 3, the website lagged past the wait (the step below marks the lane,
      # as it does a failure).
      # The schedule's run: Chrome looks even when the pre-key held (--full).
      - name: Rulebook PDF
        id: pages
        if: ${{ !cancelled() && env.GO == 'true' && steps.venv.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 12
        working-directory: bot
        run: |
          if ! fc-list | grep -qi 'color emoji'; then        # the chapters' 🕐 and ⏳; apt-get update only when the image's lists fail
            sudo apt-get -qq install -y fonts-noto-color-emoji > /dev/null 2>&1 \
              || { sudo apt-get -qq update && sudo apt-get -qq install -y fonts-noto-color-emoji > /dev/null; } || echo "::warning::no emoji font"
          fi
          code=0
          CHROME=$(command -v google-chrome || command -v chromium || true) \
            "$RUNNER_TEMP/venv/bin/python" -m commands.rulebook_pages "$GITHUB_WORKSPACE" --site "$SITE_URL" \
            ${{ github.event_name == 'schedule' && '--full' || '' }} | tee "$RUNNER_TEMP/pages.md" || code=$?
          [ "$code" = 0 ] || [ "$code" = 3 ] || exit "$code"
          echo "lag=$([ "$code" = 3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          ws=$GITHUB_WORKSPACE list=TTS/Rulebook/pages.json changed=false key=false
          if [ -n "$(git -C "$ws" status --porcelain -- TTS/Rulebook ":!$list")" ]; then
            changed=true
          elif [ -n "$(git -C "$ws" status --porcelain -- "$list")" ]; then
            if [ "$(jq -S 'del(.key, .pre)' "$ws/$list")" = "$(git -C "$ws" show "HEAD:$list" | jq -S 'del(.key, .pre)')" ]; then key=true; else changed=true; fi
          fi
          { echo "changed=$changed"; echo "key=$key"; } >> "$GITHUB_OUTPUT"

      # The PDF not drawn: the website lagged past its wait (a deploy late or failed, a font's older CDN copy) or the step
      # failed or ran out of time. The Gate of the schedule's next run (and a chained one's) passes over this lane, so its
      # main lane goes and draws the PDF again (once: a lane marked too is not passed over)
      - name: Rulebook PDF not drawn
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && (steps.pages.outputs.lag == 'true' || steps.pages.outcome == 'failure') }}
        run: |
          echo "Rulebook PDF not drawn (the website lagged main's rulebook past the wait, or the step failed): the schedule's next run draws it again." | tee -a "$GITHUB_STEP_SUMMARY"

      # TTS save start's save: its report and exit code
      - name: TTS save
        id: save
        if: ${{ !cancelled() && env.GO == 'true' && steps.venv.outcome == 'success' }}
        timeout-minutes: 20
        env:
          STARTED: ${{ steps.save-start.outcome }}
        run: |
          save="TTS/Impossibility Simulator.json" bg=$RUNNER_TEMP/save
          [ "$STARTED" = success ] || { echo "::error::the save did not start"; exit 1; }
          until [ -s "$bg/code" ]; do sleep 0.2; done
          cat "$bg/err" >&2
          cat "$RUNNER_TEMP/save.md"
          code=$(cat "$bg/code")
          [ "$code" = 0 ] || exit "$code"
          if git -C "$GITHUB_WORKSPACE" diff --quiet -- "$save"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Linked files changed since their users' pictures were drawn (AutoCroissant psd_links redraw, read from main's tree
      # and the data's links.json): those layers redrawn on the checkout's HEAD (B's version of a baked card) and their
      # PNGs re-exported past 2 levels, as one local commit R ("Card sync: linked pictures redrawn", Card-sweep: linked,
      # silent) that Commit main puts on M, in M's push. In the same rewrite, the icon glyphs a stoogedings font commit
      # changed (owner 2026-11-08; psd_glyphs: the cards drawn before it whose texts in psd_details.json use them) drawn
      # again with MDW/Fonts, those glyphs alone, and their PNGs re-exported (Card-sweep: glyphs); a card it cannot redraw
      # gets a hand flag in site/Card Edits.json instead. No card starts past minute 45 of the lane; R's bytes stay under
      # 1.5 GB less M's. Blobs come in the guards' chunks. due: cards left (Leftover work chains on it). A dry run: no R.
      - name: Linked redraw
        id: redraw
        if: ${{ !cancelled() && env.GO == 'true' && steps.venv.outcome == 'success' }}
        timeout-minutes: 50
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_NO_LAZY_FETCH: "1"
          PSD_TOOLS_FONT_DIRS: ${{ github.workspace }}/MDW/Fonts
          MAIN: ${{ steps.gate.outputs.main }}
          START: ${{ steps.gate.outputs.start }}
          SAVED: ${{ steps.save.outputs.changed }}
          PAGES: ${{ steps.pages.outputs.changed }}
        run: |
          [ -f commands/psd_links.py ] || { echo "The builder has no psd_links: nothing to redraw."; exit 0; }
          ws=$GITHUB_WORKSPACE
          [ -f "$ws/carddata/db/links.json" ] || { echo "No db/links.json on data yet: nothing to redraw."; exit 0; }
          left=$((START + 55 * 60 - $(date +%s)))   # killed by minute 55: Commit main still pushes M before minute 60
          [ "$left" -ge 60 ] || { echo "Minute 54 of the lane passed: no redraw this run."; exit 0; }
          head=$(git -C "$ws" rev-parse HEAD)
          m=0                                   # M's bytes: the bake's new blobs, the save, the rulebook's pages
          if [ "$head" != "$MAIN" ]; then
            m=$(git -C "$ws" diff-tree -r --no-renames "$MAIN" "$head" | awk '$4 !~ /^0+$/ {print $4}' \
              | git -C "$ws" cat-file --batch-check='%(objectsize)' | awk '$1 ~ /^[0-9]+$/ {s += $1} END {print s + 0}')
          fi
          if [ "$SAVED" = true ]; then m=$((m + $(stat -c %s "$ws/TTS/Impossibility Simulator.json"))); fi
          if [ "$PAGES" = true ]; then m=$((m + $(du -sb "$ws/TTS/Rulebook" | cut -f1))); fi
          args=(--head "$head" --local "$ws" --db "$ws/carddata/db" --out "$RUNNER_TEMP/linked"
                --deadline "$((START + 45 * 60))" --bytes "$((1500000000 - m))")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          set +e
          timeout "$left" "$RUNNER_TEMP/venv/bin/python" -m commands.psd_links redraw "${args[@]}" > "$RUNNER_TEMP/redraw.md"
          code=$?
          set -e
          cat "$RUNNER_TEMP/redraw.md"
          cat "$RUNNER_TEMP/redraw.md" >> "$GITHUB_STEP_SUMMARY"
          echo "due=$(jq '.due // 0' "$RUNNER_TEMP/linked/redraw.json" 2> /dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          now=$(git -C "$ws" rev-parse HEAD)
          if [ "$now" != "$head" ]; then
            if [ "$(git -C "$ws" rev-parse "$now^")" != "$head" ]; then
              echo "::error::The checkout's HEAD ${now:0:8} is not a commit on ${head:0:8}"
              exit 1
            fi
            echo "r=$now" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      # One commit M on main's head with B's files and the save, then the redraw's R on M, fast-forward only. A temp index
      # and --missing-ok keep git from fetching the tree's blobs. Past minute 60 nothing is pushed (red): the 30 minutes left
      # cover this step's cap and every later one's, and the next run does the work. Main moved meanwhile: M and R are
      # dropped and the lane starts over once from the new head, unless another run is unfinished (it does the work: a
      # push's or a pending one). The retry is marked by inputs.retry, runs only this lane and starts no other.
      - name: Commit main
        id: main
        if: ${{ !cancelled() && env.GO == 'true' && env.DRY_RUN != 'true' && (steps.bake.outputs.baked == 'true' || steps.save.outputs.changed == 'true' || steps.pages.outputs.changed == 'true' || steps.redraw.outputs.r != '') }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_NO_LAZY_FETCH: "1"
          MAIN: ${{ steps.gate.outputs.main }}
          START: ${{ steps.gate.outputs.start }}
          SAVED: ${{ steps.save.outputs.changed }}
          PAGES: ${{ steps.pages.outputs.changed }}
          KEYED: ${{ steps.pages.outputs.key }}
          B: ${{ steps.bake.outputs.b }}
          R: ${{ steps.redraw.outputs.r }}
          RETRY: ${{ inputs.retry && 'true' || 'false' }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          save="TTS/Impossibility Simulator.json"
          head=${B:-$MAIN}                      # the bake's commit, not HEAD: a timed-out bake can leave B unreported
          if [ "$(git rev-parse HEAD)" != "${R:-$head}" ] || { [ -n "$R" ] && [ "$(git rev-parse "$R^")" != "$head" ]; }; then
            echo "::error::The checkout's HEAD is not the commit the lane made (${R:-$head}): nothing for main"
            exit 1
          fi
          parts=()
          if [ "$head" != "$MAIN" ]; then
            n=$(git diff-tree --no-commit-id -r --name-only "$MAIN" "$head" -- ':(icase)*.psd' | { grep -c . || true; })
            if [ "$n" -gt 0 ]; then parts+=("$n card$([ "$n" = 1 ] || echo s) baked"); else parts+=("edits dropped"); fi
          fi
          export GIT_INDEX_FILE=$RUNNER_TEMP/main.index
          git read-tree "$head"
          if [ "$SAVED" = true ]; then
            mode=$(git ls-tree "$head" -- "$save" | cut -d' ' -f1)
            git update-index --add --cacheinfo "${mode:-100644},$(git hash-object -w -- "$save"),$save"
            parts+=("TTS save updated")
          fi
          if [ "$PAGES" = true ]; then           # the rulebook's PDF and pages.json (old page images removed)
            git add -A -- TTS/Rulebook
            parts+=("rulebook PDF printed")
          fi
          tree=$(git write-tree --missing-ok)
          if [ "$KEYED" = true ] && [ "$tree" != "$(git rev-parse "$MAIN^{tree}")" ]; then   # the rulebook's new key rides along
            git add -- TTS/Rulebook/pages.json
            tree=$(git write-tree --missing-ok)
          fi
          unset GIT_INDEX_FILE
          me=(GIT_AUTHOR_NAME=AutoCroissant GIT_AUTHOR_EMAIL=autocroissant@gmail.com
              GIT_COMMITTER_NAME=AutoCroissant GIT_COMMITTER_EMAIL=autocroissant@gmail.com)
          m="" r="" subject=""
          : > "$RUNNER_TEMP/main.txt"
          if [ "$tree" != "$(git rev-parse "$MAIN^{tree}")" ]; then
            subject=$(printf '%s, ' "${parts[@]}")
            {
              echo "Card sync: ${subject%, }"
              if [ "$SAVED" = true ]; then echo; head -1 "TTS/Impossibility Simulator.message.txt" 2> /dev/null || true; fi
              if [ "$head" != "$MAIN" ]; then echo; git log -1 --format=%B "$head"; fi
            } | git stripspace > "$RUNNER_TEMP/main-message.txt"
            m=$(env "${me[@]}" git commit-tree "$tree" -p "$MAIN" -F "$RUNNER_TEMP/main-message.txt")
            git show --no-renames --name-status --format='%H%n%B' "$m" | tee -a "$RUNNER_TEMP/main.txt"
          fi
          if [ -n "$R" ]; then                   # R's files on M (or main's head), its message kept
            export GIT_INDEX_FILE=$RUNNER_TEMP/redraw.index
            git read-tree "${m:-$MAIN}"
            git diff-tree -z -r --no-renames "$head" "$R" | while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
              read -r _ mode _ sha status <<< "$meta"
              if [ "$status" = D ]; then mode=0; fi
              printf '%s %s\t%s\0' "$mode" "$sha" "$path"
            done | git update-index -z --index-info
            rtree=$(git write-tree --missing-ok)
            unset GIT_INDEX_FILE
            git log -1 --format=%B "$R" > "$RUNNER_TEMP/redraw-message.txt"
            r=$(env "${me[@]}" git commit-tree "$rtree" -p "${m:-$MAIN}" -F "$RUNNER_TEMP/redraw-message.txt")
            git show --no-renames --name-status --format='%H%n%B' "$r" | tee -a "$RUNNER_TEMP/main.txt"
          fi
          top=${r:-$m}
          if [ -z "$top" ]; then echo "Nothing for main."; exit 0; fi
          late=$(( (90 - 30) * 60 ))            # the job's timeout-minutes less the caps of this step and the later ones (seconds)
          if [ -n "$START" ] && [ $(( $(date +%s) - START )) -gt "$late" ]; then
            echo "::error::$(( ($(date +%s) - START) / 60 )) minutes into the lane: nothing is pushed; the next run does it"
            exit 1
          fi
          ok=true
          # no delta search (pack.window=0): over HTTPS the pack is thin whatever --no-thin says, and its deltas would want
          # the old blobs this blobless checkout lacks (every bake's first push failed so, 5 s a card to fetch them)
          if ! git -c pack.window=0 push --no-thin origin "$top:refs/heads/main"; then
            if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN" ]; then   # main still there: GitHub refused, or git wanted a blob
              echo "::warning::the push failed with main unmoved (its error is above): once more"
              GIT_NO_LAZY_FETCH=0 git -c pack.window=0 push --no-thin origin "$top:refs/heads/main" || ok=false
            else
              ok=false
            fi
          fi
          now=$top
          if [ "$ok" = false ]; then now=$(git ls-remote origin refs/heads/main | cut -f1); fi
          if [ "$ok" = false ] && [ "$now" = "$top" ]; then echo "::warning::git push failed, but main is at ${top:0:8}: pushed"; fi
          if [ "$now" != "$top" ]; then
            if [ -z "$now" ] || [ "$now" = "$MAIN" ]; then exit 1; fi
            echo "rejected=true" >> "$GITHUB_OUTPUT"
            echo "::warning::main moved during the lane (now ${now:0:8}): the lane's commits are dropped"
            if [ "$RETRY" = true ]; then echo "This run was the retry: the next run with work does it."; exit 0; fi
            waiting=$(gh run list -R "$GITHUB_REPOSITORY" --workflow card-sync.yml --limit 20 --json databaseId,status,displayTitle \
              --jq "map(select(.status != \"completed\" and .databaseId != ${GITHUB_RUN_ID:-0} and .displayTitle != \"Card sync (dry run)\")) | length") \
              || waiting=0
            if [ "${waiting:-0}" -gt 0 ]; then echo "Another Card sync run is unfinished (a push's or a pending one): it does the work."; exit 0; fi
            again=(-f dry_run=false -f force=true -f "retry=$GITHUB_EVENT_NAME" -f "builder_ref=$(git -C bot rev-parse HEAD)"
                   -f "bake=$(jq -r '.bake // "all"' <<< "$INPUTS")")
            for wait in 0 10 30; do               # tried 3 times
              sleep "$wait"
              if gh workflow run card-sync.yml --ref main -R "$GITHUB_REPOSITORY" "${again[@]}"; then exit 0; fi
            done
            echo "::warning::the new run was not dispatched: the next run with work does it"
            exit 0
          fi
          pngs=$(git diff-tree --no-commit-id -r --name-only "$MAIN" "$top" -- ':(icase)*.png' ':(icase)*.pdf' | { grep -c . || true; })   # the rulebook PDF too
          { echo "pushed=true"; echo "m=$m"; echo "top=$top"; echo "baked=$([ "$head" != "$MAIN" ] && echo true || echo false)"
            echo "redrawn=$([ -n "$r" ] && echo true || echo false)"
            echo "pngs=$([ "$pngs" -gt 0 ] && echo true || echo false)"; } >> "$GITHUB_OUTPUT"
          if [ -n "$m" ]; then echo "Main commit \`${m:0:8}\`: Card sync: ${subject%, }." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$r" ]; then echo "Main commit \`${r:0:8}\`: $(head -1 "$RUNNER_TEMP/redraw-message.txt")." >> "$GITHUB_STEP_SUMMARY"; fi

      # The bake's records for the data lane (bake-records): the refusals' verdicts and events always (no main commit),
      # the landed part (the verdicts the dropped entries held, the baked events, their commit M) only when M landed.
      # records=true starts the after job; whichever data job comes first merges them. A dry run's artifact has its own
      # name (bake-records-dry-run): never merged.
      # records.json: what the bake and the link redraw read off PSDs before saving them stripped (the data's render and
      # spot records), true whether M landed or not.
      - name: Bake records
        id: records
        if: ${{ !cancelled() && env.GO == 'true' && (steps.bake.outcome != 'skipped' || steps.redraw.outcome != 'skipped') }}
        timeout-minutes: 1
        env:
          LANDED: ${{ steps.main.outputs.baked == 'true' }}
          M: ${{ steps.main.outputs.m }}
        run: |
          rec=$RUNNER_TEMP/card-bake out=$RUNNER_TEMP/bake-records
          mkdir -p "$out"
          found=()
          for f in "$rec/records.json" "$RUNNER_TEMP/linked/records.json"; do [ -s "$f" ] && found+=("$f"); done
          if [ ${#found[@]} -gt 0 ]; then jq -s 'add' "${found[@]}" > "$out/records.json"; else echo '[]' > "$out/records.json"; fi
          r=$(jq length "$out/records.json")
          if [ ! -f "$rec/verdicts.json" ] || [ ! -f "$rec/bake-events.json" ]; then
            if [ "$r" = 0 ]; then echo "No bake records."; exit 0; fi
            echo '{"schema": 1, "cards": {}}' > "$out/verdicts.json"
            echo '[]' > "$out/events.json"
          else
            jq --argjson landed "$LANDED" '{schema: 1, cards: (.cards + (if $landed then .landed else {} end))}' "$rec/verdicts.json" > "$out/verdicts.json"
            jq --argjson landed "$LANDED" --arg m "$M" '[.events[], (if $landed then .landed[] | .commit = $m else empty end)]' \
              "$rec/bake-events.json" > "$out/events.json"
          fi
          n=$(jq '.cards | length' "$out/verdicts.json") e=$(jq length "$out/events.json")
          echo "Bake records: $n verdicts, $e events, $r PSD records$([ "$LANDED" = true ] || echo " (M did not land: its part left out)")." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$((n + e + r))" -gt 0 ] && [ "$DRY_RUN" != true ]; then echo "records=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && (steps.records.outputs.records == 'true' || env.DRY_RUN == 'true' && steps.records.outcome == 'success') }}
        timeout-minutes: 1
        with:
          name: ${{ env.DRY_RUN == 'true' && 'bake-records-dry-run' || 'bake-records' }}
          path: ${{ runner.temp }}/bake-records
          if-no-files-found: ignore
          retention-days: 90  # unmerged records wait for a data job (the PSD records exist nowhere else)
          overwrite: true     # a re-run replaces attempt 1's bake records (unmerged ones too; the verdicts heal)

      # The website edits left for the chain: card_bake.pending at this run's end (B, or main's head) with this run's
      # verdicts on the data's (over the cap, main moved under a card). Not after a rejected M: its retry or another run
      # does them; nor in a held lane (the guards' run does) or one with nothing to do.
      - name: Leftover edits
        id: left
        if: env.DRY_RUN != 'true' && steps.gate.outcome == 'success' && steps.venv.outcome == 'success' && steps.main.outputs.rejected != 'true' && (env.GO == 'true' || env.EDITS == 'true' || env.LINKED == 'true')
        continue-on-error: true   # uncounted: the safety schedule looks again
        timeout-minutes: 1        # Commit main's reserve covers it
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_NO_LAZY_FETCH: "1"
        run: |
          if ! "$RUNNER_TEMP/venv/bin/python" - "$GITHUB_REPOSITORY" "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
              "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/carddata/db" "$RUNNER_TEMP/bake-records/verdicts.json" > "$RUNNER_TEMP/left.txt" <<'PY'
          import json, os, sys
          from commands.card_bake import pending
          from commands.card_db import merge_verdicts
          repo, head, local, db, run = sys.argv[1:]
          if os.path.exists(run):                    # this run's verdicts, as its data job merges them
              with open(run, encoding="utf-8") as fh:
                  merge_verdicts(db, json.load(fh)["cards"])
          at = {"repository": repo, "head": head, "local": local, "verdicts": os.path.join(db, "verdicts.json")}
          print(len(pending(**at)))
          PY
          then
            echo "::warning::the website edits left were not counted: the safety schedule looks again"
            exit 0
          fi
          read -r due < "$RUNNER_TEMP/left.txt"
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "Website edits left: $due to bake now." | tee -a "$GITHUB_STEP_SUMMARY"

      # The baked PNGs' save links: the save above pinned main before M, so it runs again on the lane's last commit (R,
      # else M; $M below) and any change is a commit on it (the save alone), fast-forward only. A failed push with main
      # still there goes once more (the Gate skips the lane's commits: no run would come for it). Main moved meanwhile: a
      # warning; the next lane's save pins them.
      - name: Re-pin
        id: repin
        if: ${{ !cancelled() && steps.main.outputs.pngs == 'true' }}
        timeout-minutes: 8
        working-directory: bot
        env:
          AUTOCROISSANT_LOCAL_DIR: ${{ github.workspace }}
          AUTOCROISSANT_HISTORY_CLONE: ${{ runner.temp }}/TTSCardMaker-history.git
          GIT_NO_LAZY_FETCH: "1"
          M: ${{ steps.main.outputs.top }}
        run: |
          save="TTS/Impossibility Simulator.json"
          names=()
          if [ -f "$GITHUB_WORKSPACE/carddata/db/stats.json" ]; then names=(--names "$GITHUB_WORKSPACE/carddata/db/stats.json"); fi
          "$RUNNER_TEMP/venv/bin/python" -m commands.tts_save "$GITHUB_WORKSPACE/$save" "${names[@]}" | tee "$RUNNER_TEMP/repin.md"
          cd "$GITHUB_WORKSPACE"
          export GIT_INDEX_FILE=$RUNNER_TEMP/repin.index
          git read-tree "$M"
          mode=$(git ls-tree "$M" -- "$save" | cut -d' ' -f1)
          git update-index --add --cacheinfo "${mode:-100644},$(git hash-object -w -- "$save"),$save"
          tree=$(git write-tree --missing-ok)
          unset GIT_INDEX_FILE
          if [ "$tree" = "$(git rev-parse "$M^{tree}")" ]; then echo "The save's links were current."; exit 0; fi
          { echo "Card sync: TTS save re-pinned"; echo; head -1 "TTS/Impossibility Simulator.message.txt" 2> /dev/null || true; } \
            | git stripspace > "$RUNNER_TEMP/repin-message.txt"
          m2=$(GIT_AUTHOR_NAME=AutoCroissant GIT_AUTHOR_EMAIL=autocroissant@gmail.com \
               GIT_COMMITTER_NAME=AutoCroissant GIT_COMMITTER_EMAIL=autocroissant@gmail.com \
               git commit-tree "$tree" -p "$M" -F "$RUNNER_TEMP/repin-message.txt")
          for try in 1 2; do
            if git push --no-thin origin "$m2:refs/heads/main"; then now=$m2; break; fi
            now=$(git ls-remote origin refs/heads/main | cut -f1) || true       # main unread stays a warning
            if [ "$now" != "$M" ]; then break; fi
            if [ "$try" = 1 ]; then echo "::warning::the push failed with main unmoved (its error is above): once more"; fi
          done
          if [ "$now" != "$m2" ]; then
            why="main moved since M"
            if [ "$now" = "$M" ] || [ -z "$now" ]; then why="the push failed (its error is above)"; fi
            echo "::warning::$why: the baked PNGs' save links wait for the next lane"
            exit 0
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Main commit \`${m2:0:8}\`: Card sync: TTS save re-pinned." | tee -a "$GITHUB_STEP_SUMMARY"

      # The bake's report and crops, the save's report and diff, the main commits
      - name: Collect the artifact
        if: always() && env.GO == 'true'
        timeout-minutes: 2
        run: |
          out=$RUNNER_TEMP/card-sync
          mkdir -p "$out"
          if [ -d "$RUNNER_TEMP/card-bake" ]; then     # not the PSDs (both sides are in git once M lands; 1.4 GB for 40)
            rsync -a --exclude='*.psd' --exclude='*.PSD' "$RUNNER_TEMP/card-bake/" "$out/bake/"
          fi
          if [ -d "$RUNNER_TEMP/linked" ]; then         # the redraw's report (not its PSDs)
            rsync -a --exclude='*.psd' --exclude='*.PSD' --exclude='*.psb' "$RUNNER_TEMP/linked/" "$out/linked/"
          fi
          for f in bake.md pages.md save.md redraw.md repin.md main-message.txt redraw-message.txt main.txt; do
            if [ -f "$RUNNER_TEMP/$f" ]; then cp "$RUNNER_TEMP/$f" "$out/"; fi
          done
          for f in TTS/*.report.md TTS/*.message.txt; do
            if [ -f "$f" ]; then cp "$f" "$out/"; fi
          done
          git diff -- "TTS/Impossibility Simulator.json" > "$out/save.diff" || true

      - uses: actions/upload-artifact@v7
        if: always() && env.GO == 'true'
        timeout-minutes: 5
        with:
          name: card-sync
          path: ${{ runner.temp }}/card-sync
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true     # a re-run replaces attempt 1's

      - name: Tell Discord
        if: failure() && env.DRY_RUN != 'true'
        timeout-minutes: 2        # Commit main's reserve covers it
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_STANDARDS_WEBHOOK }}
          GUARDS_RUN: ${{ inputs.guards }}
          OUTCOMES: |
            Bot and data=${{ steps.clones.outcome }}
            Python environment=${{ steps.venv.outcome }}
            Fonts first=${{ steps.fonts-first.outcome }}
            Gate=${{ steps.gate.outcome }}
            Pending edits=${{ steps.edits.outcome }}
            Fonts tree=${{ steps.fonts.outcome }}
            Bake=${{ steps.bake.outcome }}
            TTS save start=${{ steps.save-start.outcome }}
            TTS save=${{ steps.save.outcome }}
            Linked redraw=${{ steps.redraw.outcome }}
            Commit main=${{ steps.main.outcome }}
            Bake records=${{ steps.records.outcome }}
            Re-pin=${{ steps.repin.outcome }}
        run: *tell

  # After M (it brought the bake's card files), R (the redrawn cards) or a bake that only recorded verdicts: the data lane
  # again, on main's head then, no wait, without the dispatch's inputs (full, cards, restore, allow_archive: the data
  # job's), with the bake's records merged in its data commit. Its site build shows the baked PNGs. Replaced while pending (card-data), or lost,
  # the next data job merges the records.
  after:
    name: Card data after the bake
    needs: main
    if: ${{ !cancelled() && (needs.main.outputs.baked == 'true' || needs.main.outputs.redrawn == 'true' || needs.main.outputs.records == 'true') }}
    concurrency:
      group: ${{ inputs.dry_run && format('card-data-dry-{0}', github.run_id) || 'card-data' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      committed: ${{ steps.data-commit.outputs.committed }}
    defaults:
      run:
        shell: bash
    env:
      AFTER: ${{ (needs.main.outputs.baked == 'true' || needs.main.outputs.redrawn == 'true') && needs.main.outputs.top || '' }}
      RECORDS: "true"
      CARD_RECORDS_DIR: ${{ github.workspace }}/carddata/db
      BOT_FILES: *bot-files
    steps: *data-steps

  # Leftover work (owner, 2026-10-25: the chain and a safety schedule): a live run's last job dispatches the next run when
  # work is left, at once (chain=now): cards still to re-parse (manifest pending.stale), bake records no data commit
  # merged, website edits not baked (chain=wait, for edits held by a recent push, went on 2026-11-04), linked pictures
  # and icon glyphs the redraw's caps left (its Linked due step starts the next lane). None when nothing
  # is left, a lane failed (Discord was told), another live run's lane will read it (unfinished: its own chain looks
  # again), after CHAIN_IDLE runs in a row without a data or main commit or CHAIN_MAX runs (the safety schedule picks it
  # up); never from a dry run. The chain input carries the count. A push's run (its main lane waits for its guards) also
  # looks once its data lane is done, for the data's leftovers, so a re-parse goes on at once.
  chain-data:
    name: Chain after the data
    needs: [data, timer]
    if: ${{ !cancelled() && !inputs.dry_run && needs.timer.result == 'success' && !needs.timer.outputs.other && !needs.timer.outputs.guards && github.event_name == 'push' }}
    concurrency:
      group: card-chain
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    permissions:
      actions: write      # gh workflow run; the runs, jobs and artifacts
      contents: read      # the data branch's manifest
    env:
      TITLE: Chain after the data
      LANES: "data=${{ needs.data.result }}"
      PROGRESS: ${{ needs.data.outputs.committed == 'true' && 'true' || 'false' }}
      DUE: ""
      REDRAW: ""
    steps:
      - &chain
        name: Leftover work
        id: chain
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ inputs.chain }}
          BUILDER: ${{ inputs.builder_ref }}
          CHAIN_IDLE: "3"
          CHAIN_MAX: "12"
          DATA_LANE: Card data          # the data jobs' names start so
          MAIN_LANE: Bake and save
        run: |
          read -r _ runs idle _ <<< "$CHAIN"
          [[ "$runs" =~ ^[0-9]+$ ]] || runs=0
          [[ "$idle" =~ ^[0-9]+$ ]] || idle=0
          runs=$((runs + 1))
          if [ "$PROGRESS" = true ]; then idle=0; else idle=$((idle + 1)); fi
          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          echo "## $TITLE" >> "$GITHUB_STEP_SUMMARY"
          failed=$(tr ' ' '\n' <<< "$LANES" | grep '=failure$' | cut -d= -f1 | paste -sd, - || true)
          if [ -n "$failed" ]; then say "No chain: $failed failed (Discord was told); the safety schedule tries again."; exit 0; fi
          raw=(-H "Accept: application/vnd.github.raw+json")
          if ! stale=$(gh api "${raw[@]}" "repos/$GITHUB_REPOSITORY/contents/db/manifest.json?ref=data" | jq '.pending.stale // [] | length'); then
            echo "::warning::the data's manifest was not read"
            stale=0
          fi
          merged=$(gh api "${raw[@]}" "repos/$GITHUB_REPOSITORY/contents/db/bake-records.json?ref=data" 2> /dev/null | jq -c '.merged // {}') \
            || merged=""
          if [ -z "$merged" ]; then merged='{}'; fi
          if ! records=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bake-records&per_page=100" \
              | jq --argjson seen "$merged" '[.artifacts[] | select((.expired | not) and $seen[(.id | tostring)] == null
                and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length'); then
            echo "::warning::the bake records were not listed"
            records=0
          fi
          now=()
          if [ "${stale:-0}" -gt 0 ]; then now+=("$stale cards still to re-parse"); fi
          if [ "${records:-0}" -gt 0 ]; then now+=("$records bake records not merged"); fi
          data=${#now[@]}
          if [ "${DUE:-0}" -gt 0 ]; then now+=("$DUE website edits to bake"); fi
          if [ "${REDRAW:-0}" -gt 0 ]; then now+=("$REDRAW cards to redraw (linked pictures, icon glyphs)"); fi
          main=$(( ${DUE:-0} + ${REDRAW:-0} ))  # the main lane's work
          if [ ${#now[@]} -eq 0 ]; then say "Nothing left: no chain."; exit 0; fi
          printf -- '- %s\n' "${now[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          # Another live run that will read it: queued, or its lane not finished (its own chain looks again at its end)
          data_by="" main_by=""
          others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow card-sync.yml --limit 20 --json databaseId,status,displayTitle \
            --jq ".[] | select(.status != \"completed\" and .databaseId != ${GITHUB_RUN_ID:-0} and .displayTitle != \"Card sync (dry run)\")
              | \"\(.databaseId) \(.status)\"") || others=""
          while read -r id status; do
            [ -n "$id" ] || continue
            if [[ "$status" =~ ^(queued|requested|pending)$ ]]; then data_by=${data_by:-$id} main_by=${main_by:-$id}; continue; fi
            open=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq "[
                (any(.jobs[]; (.name | startswith(\"$DATA_LANE\")) and .status != \"completed\") | if . then \"data\" else empty end),
                (any(.jobs[]; .name == \"$MAIN_LANE\" and .status == \"completed\") | if . then empty else \"main\" end)] | join(\" \")") || open=""
            if [[ " $open " == *" data "* ]]; then data_by=${data_by:-$id}; fi
            if [[ " $open " == *" main "* ]]; then main_by=${main_by:-$id}; fi
          done <<< "$others"
          if ! { [ "$data" -gt 0 ] && [ -z "$data_by" ]; } && ! { [ "$main" -gt 0 ] && [ -z "$main_by" ]; }; then
            say "No chain: run ${data_by:-$main_by} is unfinished and reads it."
            exit 0
          fi
          if [ "$idle" -ge "$CHAIN_IDLE" ]; then
            say "Chain stopped: $idle runs in a row made no data or main commit; the safety schedule picks it up."
            exit 0
          fi
          if [ "$runs" -ge "$CHAIN_MAX" ]; then say "Chain stopped after $runs runs; the safety schedule picks it up."; exit 0; fi
          args=(-f dry_run=false -f bake=pending -f "chain=now $runs $idle")
          if [ -n "$BUILDER" ]; then args+=(-f "builder_ref=$BUILDER"); fi
          started=""
          for wait in 0 10 30; do               # tried 3 times
            sleep "$wait"
            if gh workflow run card-sync.yml --ref main -R "$GITHUB_REPOSITORY" "${args[@]}"; then started=true; break; fi
          done
          if [ -z "$started" ]; then
            echo "::warning::the next run was not dispatched: the safety schedule picks it up"
            exit 0
          fi
          echo "dispatched=now" >> "$GITHUB_OUTPUT"
          say "Next run dispatched: at once (run $runs of the chain, $idle without progress)."
          sleep 10                              # the next chain job (group card-chain) sees it listed

  chain:
    name: Chain
    needs: [data, main, after]
    if: ${{ !cancelled() && !inputs.dry_run }}
    concurrency:
      group: card-chain
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    permissions:
      actions: write
      contents: read
    env:
      TITLE: Chain
      LANES: "data=${{ needs.data.result }} main=${{ needs.main.result }} after=${{ needs.after.result }}"
      PROGRESS: ${{ (needs.data.outputs.committed == 'true' || needs.after.outputs.committed == 'true' || needs.main.outputs.top) && 'true' || 'false' }}
      DUE: ${{ needs.main.outputs.due }}
      REDRAW: ${{ needs.main.outputs.redraw_due }}
    steps:
      - *chain

  # A new wheel or font cache (its key changes with requirements-cards.txt, Python, MDW/Fonts): the older ones go (caches.yml)
  caches:
    needs: [data, main]
    if: ${{ !cancelled() && (needs.data.outputs.saved == 'true' || needs.main.outputs.saved == 'true') }}
    permissions:
      actions: write
    uses: ./.github/workflows/caches.yml
    with:
      prefixes: card-wheels- card-venv- card-fonts-
