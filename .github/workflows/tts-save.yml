# Keeps the Tabletop Simulator save (TTS/Impossibility Simulator.json) current: image links pinned to the commit that
# last changed each file, new cards added to their decks (TTS/decks.json), names from the card browser.
# Runs the bot's updater (AutoCroissant commands/tts_save.py) and commits the save when it changed.
name: TTS save

on:
  push:
    branches: [main]
    paths:
      - "**/*.png"
      - "TTS/decks.json"
      - "site/Card Edits.json"
  schedule:
    - cron: "41 11 * * *"    # daily: picks up card-browser names the push ran ahead of
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tts-save
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /TTS/
            /site/Card Edits.json

      # The updater and what it imports (no config.py: github_api reads it in a try/except)
      - uses: actions/checkout@v7
        with:
          repository: bobberlington/AutoCroissant
          path: bot
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /commands/tts_save.py
            /commands/repo_history.py
            /commands/card_models.py
            /commands/card_edits.py
            /commands/github_api.py
            /commands/git_commit.py
            /global_config.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -q requests

      # The updater reads TTS/decks.json and site/Card Edits.json from the checkout (AUTOCROISSANT_LOCAL_DIR) and keeps a
      # bare blobless history clone (AUTOCROISSANT_HISTORY_CLONE, made on first use); the report lands next to the save.
      - name: Update the save
        shell: bash
        env:
          AUTOCROISSANT_LOCAL_DIR: ${{ github.workspace }}
          AUTOCROISSANT_HISTORY_CLONE: ~/TTSCardMaker-history.git
        run: |
          cd bot
          python -m commands.tts_save "$GITHUB_WORKSPACE/TTS/Impossibility Simulator.json" | tee "$GITHUB_WORKSPACE/tts-save-report.md"

      - name: Commit the save
        run: |
          if git diff --quiet -- "TTS/Impossibility Simulator.json"; then echo "No changes."; exit 0; fi
          msg=$(grep -E '^## ' tts-save-report.md | sed -E 's/^## (.*) \(([0-9]+)\)$/\2 \1/; s/^## //' | head -4 | paste -sd ',' - | sed 's/,/, /g')
          git config user.name AutoCroissant
          git config user.email autocroissant@gmail.com
          git add "TTS/Impossibility Simulator.json"
          git commit -m "TTS save: ${msg:-updated}"
          git push
