# Keeps the Tabletop Simulator save (TTS/Impossibility Simulator.json) current: image links pinned to the commit that
# last changed each file, new cards added to their decks (TTS/decks.json), names from the card browser.
# Once a day, when a card image, the deck rules, the card edits, the save or the card browser's names changed since the
# last successful run, it runs the bot's updater (AutoCroissant commands/tts_save.py) and commits the save when it changed.
name: TTS save

on:
  schedule:
    - cron: "41 11 * * *"    # daily
  workflow_dispatch:
    inputs:
      force:
        description: Run even if nothing changed since the last run
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: tts-save
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history without file contents, for the change check
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /TTS/
            /site/Card Edits.json

      # The names the updater last ran with: the newest cache entry (saved at the end, its key unique per run, so the
      # newest is always the last run's names, even when they return to a set it ran with before)
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/tts-names
          key: tts-save-names-${{ github.run_id }}
          restore-keys: tts-save-names-

      # The card browser's names (cards.json png -> name, what the updater reads), hashed: they come from the bot's data,
      # not from this repo's history. The file is also the updater's fallback (site/dist) if its own fetch fails.
      - name: Card browser names
        id: names
        shell: bash
        run: |
          last=$(cat "$RUNNER_TEMP/tts-names" 2>/dev/null || true)
          cards=site/dist/data/cards.json
          if curl -fsS --retry 3 --create-dirs -o "$cards" https://michaeljsr.github.io/TTSCardMaker/data/cards.json &&
             sum=$(jq -cS 'reduce (.cards[] | select(.png and .name)) as $c ({}; .[$c.png] = $c.name)' "$cards" | sha256sum | cut -c1-16); then
            echo "$sum" > "$RUNNER_TEMP/tts-names"; echo "sum=$sum" >> "$GITHUB_OUTPUT"
            if [ "$sum" = "$last" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; fi
          else
            echo "Card browser names not fetched."
          fi

      # Skip the day when the updater last ran with these names and nothing the save depends on changed since the
      # branch's last successful run (own commits aside)
      - name: Changes since the last run
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          NAMES_SAME: ${{ steps.names.outputs.same }}
        run: |
          if [ "$FORCE" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$NAMES_SAME" != "true" ]; then
            echo "The updater last ran with other card browser names."; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow tts-save.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 \
            --json headSha -q '.[0].headSha') || last=""
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            echo "No earlier run to compare with."; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          n=$(git log --format='%an|%s' "$last..HEAD" -- '*.png' 'TTS/decks.json' 'site/Card Edits.json' 'TTS/Impossibility Simulator.json' \
            | { grep -v '^AutoCroissant|TTS save:' || true; } | wc -l)
          echo "$n commits changed the save's inputs since ${last:0:8}."
          echo "run=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The updater and what it imports (no config.py: github_api reads it in a try/except)
      - uses: actions/checkout@v7
        if: steps.changes.outputs.run == 'true'
        with:
          repository: bobberlington/AutoCroissant
          path: bot
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /commands/tts_save.py
            /commands/repo_history.py
            /commands/card_models.py
            /commands/card_edits.py
            /commands/github_api.py
            /commands/git_commit.py
            /global_config.py

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.12"

      - run: pip install -q requests
        if: steps.changes.outputs.run == 'true'

      # The updater reads TTS/decks.json and site/Card Edits.json from the checkout (AUTOCROISSANT_LOCAL_DIR) and keeps a
      # bare blobless history clone (AUTOCROISSANT_HISTORY_CLONE, made on first use); the report and the commit subject
      # (<stem>.report.md, <stem>.message.txt) land next to the save.
      - name: Update the save
        if: steps.changes.outputs.run == 'true'
        shell: bash
        env:
          AUTOCROISSANT_LOCAL_DIR: ${{ github.workspace }}
          AUTOCROISSANT_HISTORY_CLONE: ~/TTSCardMaker-history.git
        run: |
          cd bot
          python -m commands.tts_save "$GITHUB_WORKSPACE/TTS/Impossibility Simulator.json"

      - name: Commit the save
        if: steps.changes.outputs.run == 'true'
        run: |
          if git diff --quiet -- "TTS/Impossibility Simulator.json"; then echo "No changes."; exit 0; fi
          msg=$(head -1 "TTS/Impossibility Simulator.message.txt" 2>/dev/null || true)    # the updater's _commit_message
          git config user.name AutoCroissant
          git config user.email autocroissant@gmail.com
          git add "TTS/Impossibility Simulator.json"
          git commit -m "${msg:-TTS save: updated}"
          git push

      # These names are done: tomorrow's check skips unless they or the inputs change
      - if: steps.changes.outputs.run == 'true' && steps.names.outputs.sum && steps.names.outputs.same != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/tts-names
          key: tts-save-names-${{ steps.names.outputs.sum }}-${{ github.run_id }}-${{ github.run_attempt }}
