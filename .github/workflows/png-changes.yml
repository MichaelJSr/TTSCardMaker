# The card PNGs' picture changes (owner 11-09; AutoCroissant commands/png_changes.py): every card PNG change in main's
# history that db/png_changes.json on `data` lacks is measured (the share of the card's pixels visibly changed), in
# batches fetched into a scratch store and dropped (never the history's pictures on disk at once). The record is committed
# to `data` after each round (12 minutes at most), so a run cut short loses one round: dispatch again and it resumes where
# the record stops. Past changelog events with no mark yet are measured first and marked minor as Card sync marks new
# ones, and lose stat lines a misread gave (--events; every seq kept). By hand only (Card sync measures each run's own
# changes); the data writers' lock: no Card sync data job meanwhile. Then the site is rebuilt (it reads the record: a
# change under the share folds as minor).
name: Picture changes

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Measuring time in all, 90 at most (what is left waits for another dispatch)"
        type: number
        default: 60
      builder_ref:
        description: "AutoCroissant ref of the measurer (default: the variable CARD_DATA_BUILDER_REF, else main)"
        type: string
        default: ""

permissions:
  contents: write     # the record's commits on data
  actions: write      # gh workflow run site.yml

concurrency:
  group: card-data    # Card sync's data jobs: one data writer at a time
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      BOT_REPO: bobberlington/AutoCroissant
      BUILDER_REF: ${{ inputs.builder_ref || vars.CARD_DATA_BUILDER_REF || 'main' }}
    steps:
      # main's every commit and tree (no file contents: the batches fetch the pictures they measure)
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.BOT_REPO }}
          ref: ${{ env.BUILDER_REF }}
          path: bot
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /commands/png_changes.py
            /commands/card_models.py
            /commands/card_data.py
            /commands/card_db.py
            /commands/card_edits.py
            /commands/card_history.py
            /commands/changelog.py
            /commands/github_api.py
            /commands/psd_parser.py
            /commands/psd_remote.py
            /commands/psd_regions.py
            /commands/rulebook.py
            /global_config.py
            /requirements-cards.txt

      - uses: actions/checkout@v7
        with:
          ref: data
          path: carddata
          fetch-depth: 1

      - name: Python environment
        uses: ./.github/actions/cards-venv
        with:
          venv: ${{ runner.temp }}/venv
          oxipng: "false"
          help: png_changes card_data

      # Rounds of 12 minutes at most, each one data commit (over a Card checks commit of db/card_checks.json alone, as
      # Card sync's Commit data); exit 3 of a round: pairs left
      - name: Measure
        working-directory: bot
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          db=$GITHUB_WORKSPACE/carddata/db
          end=$(( SECONDS + (MINUTES < 90 ? MINUTES : 90) * 60 ))
          me=(-c user.name=AutoCroissant -c user.email=autocroissant@gmail.com)
          while :; do
            left=$(( (end - SECONDS) / 60 ))
            if [ "$left" -lt 2 ]; then echo "Time is up: dispatch again for the rest." | tee -a "$GITHUB_STEP_SUMMARY"; break; fi
            set +e
            "$RUNNER_TEMP/venv/bin/python" -m commands.png_changes backfill --checkout "$GITHUB_WORKSPACE" --db "$db" \
              --minutes "$(( left < 12 ? left : 12 ))" --events | tee "$RUNNER_TEMP/round.txt"
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" != 0 ] && [ "$code" != 3 ]; then exit "$code"; fi
            (
              cd "$GITHUB_WORKSPACE/carddata"
              git add db/png_changes.json db/changelog
              if git diff --cached --quiet; then exit 0; fi
              git "${me[@]}" commit -q -m "Card data: picture changes measured"
              for i in 1 2 3; do
                git push -q origin HEAD:refs/heads/data && exit 0
                if git fetch -q origin data && [ -z "$(git diff --name-only HEAD...FETCH_HEAD -- . ':!db/card_checks.json')" ]; then
                  git "${me[@]}" rebase -q FETCH_HEAD
                fi
                echo "::warning::data push failed (try $i)"
              done
              exit 1
            )
            tail -2 "$RUNNER_TEMP/round.txt" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" = 0 ]; then break; fi
          done

      - name: Site build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main -R "$GITHUB_REPOSITORY"
