<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--HEAD-->
<title>Impossibility Simulator · Card Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Every Impossibility Simulator card, the rulebook and a starting-hand builder.">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='4' width='44' height='56' rx='7' fill='%233987e5'/%3E%3Cpath d='M32 16l4.7 9.6 10.6 1.5-7.7 7.5 1.8 10.5L32 40.2l-9.4 4.9 1.8-10.5-7.7-7.5 10.6-1.5z' fill='%23fff'/%3E%3C/svg%3E">
<meta name="build" content="<!--BUILD-->">
<link rel="preload" href="data/cards.json" as="fetch" crossorigin>
<link rel="modulepreload" href="assets/app.js">
<link rel="modulepreload" href="assets/text.js">
<link rel="modulepreload" href="assets/search.js">
<link rel="modulepreload" href="assets/deck.js">
<link rel="modulepreload" href="assets/stats.js">
<link rel="modulepreload" href="assets/edit.js">
<link rel="modulepreload" href="assets/profile.js">
<link rel="modulepreload" href="assets/pick.js">
<link rel="modulepreload" href="assets/inline.js">
<link rel="modulepreload" href="assets/details.js">
<link rel="modulepreload" href="assets/decks.js">
<link rel="modulepreload" href="assets/login.js">
<link rel="modulepreload" href="assets/balance.js">
<link rel="stylesheet" href="assets/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";</script>
<script type="module" src="assets/app.js"></script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="top">
  <a class="brand" href="#/cards" aria-label="Card browser home">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="4" width="44" height="56" rx="7" fill="var(--accent)"/><path d="M32 16l4.7 9.6 10.6 1.5-7.7 7.5 1.8 10.5L32 40.2l-9.4 4.9 1.8-10.5-7.7-7.5 10.6-1.5z" fill="#fff"/></svg>
    <span>Impossibility Simulator</span>
  </a>
  <nav class="tabs" aria-label="Sections">
    <a href="#/cards" data-tab="cards">Cards</a>
    <a href="#/rules" data-tab="rules">Rulebook</a>
    <a href="#/deck" data-tab="deck">Deck builder <span class="count" id="deck-count"></span></a>
    <a href="#/stats" data-tab="stats">Stats</a>
    <a href="#/changes" data-tab="changes">Changes</a>
    <a href="#/users" data-tab="users">People <span class="count" id="people-count"></span></a>
  </nav>
  <form class="search" id="search-form" role="search">
    <input id="q" type="search" placeholder="Search cards…  (press /)" autocomplete="off" spellcheck="false" aria-label="Search cards">
    <button type="button" class="ghost icon" id="search-help" aria-label="Search syntax" title="Search syntax">?</button>
  </form>
  <div class="top-actions">
    <button type="button" class="ghost icon" id="random" title="Random card (r)" aria-label="Random card"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg></button>
    <button type="button" class="ghost icon" id="theme" title="Toggle light/dark" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg></button>
    <button type="button" class="ghost" id="account" title="Sign in to edit cards and make a profile">Sign in</button>
    <button type="button" class="ghost icon" id="keys" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7.5 14h9"/></svg></button>
  </div>
</header>
<main id="view" tabindex="-1"><div class="loading">Loading cards…</div></main>
<div id="modal" class="modal" hidden></div>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
